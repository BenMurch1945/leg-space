<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Legendary Space, Skill Shot Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0e1a;
    --panel:#141a2e;
    --bone:#e8e0cc;
    --brass:#d4a843;
    --blood:#e0483e;
    --plasma:#6fd6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--void);touch-action:none;}
  body{
    -webkit-user-select:none;user-select:none;font-family:'Space Grotesk',sans-serif;color:var(--bone);}
  #wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:row;}
  #playarea{position:relative;flex:1;min-width:0;}
  canvas{display:block;width:100%;height:100%;}
  #leftbar,#rightbar{
    flex:0 0 118px;display:flex;flex-direction:column;gap:8px;
    padding:12px 10px;background:rgba(11,14,26,.97);overflow-y:auto;
  }
  #leftbar{border-right:1px solid rgba(212,168,67,.35);flex-basis:136px;}
  #rightbar{border-left:1px solid rgba(212,168,67,.35);}
  .barlabel{
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(212,168,67,.6);margin:6px 0 0;text-align:center;
  }
  #party{display:flex;flex-direction:column;gap:12px;}
  .plate{position:relative;cursor:pointer;border:1px solid #2a2f3d;background:#0b0e16;
    padding:0;transition:border-color .15s, box-shadow .15s;}
  .plate.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass), 0 0 18px rgba(212,168,67,.12);}
  .plate.dead{opacity:.35;filter:grayscale(1);}
  .plate canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;}
  .plate{overflow:hidden;}
  #party .plate{flex:0 0 auto;}
  .platename{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.14em;text-align:center;
    padding:5px 0 2px;color:var(--ink);}
  .platestate{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;text-align:center;
    padding-bottom:6px;color:#6fd6ff;}
  .plate .pbars{padding:0 8px 7px;display:flex;flex-direction:column;gap:3px;}
  .plate .pb{height:4px;background:#181c28;position:relative;}
  .plate .pb i{position:absolute;inset:0;right:auto;background:#6fd6ff;}
  .plate .pb.armor i{background:#9aa4b5;}
  .plate .pb.stress i{background:#b06ae0;}
  .magcount{
    font-size:9px;letter-spacing:.14em;color:rgba(232,224,204,.65);text-align:center;
    margin-top:2px;font-weight:700;
  }
  .magcount.low{color:#e0a33e;}
  .magcount.dry{color:#e0483e;animation:dryflash 0.9s infinite;}
  @keyframes dryflash{0%,100%{opacity:1;}50%{opacity:.35;}}
  .appips{position:absolute;top:7px;left:8px;display:flex;gap:5px;align-items:center;}
  .appips i{width:12px;height:12px;border-radius:50%;background:var(--brass);
    border:1px solid rgba(11,14,22,.8);box-shadow:0 0 9px rgba(212,168,67,.75);}
  .appips.spent::after{content:'SPENT';color:#e0a33e;font-size:9px;font-weight:800;
    letter-spacing:.14em;background:rgba(11,14,22,.9);border:1px solid rgba(224,163,62,.6);
    padding:2px 6px;}
  .plate.dryap canvas{filter:grayscale(.45) brightness(.75);}
  #endturnbtn.urge{animation:deployPulse 1.4s ease-in-out infinite;
    background:rgba(212,168,67,.16);}
  .plate .cdring{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
    font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;
    color:var(--brass);border:1.5px solid var(--brass);background:rgba(11,14,22,.85);}
  .plate.trembling{animation:tremble .35s infinite;}
  @keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,0)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}
  #deck{position:absolute;left:12px;bottom:10px;z-index:5;}
  #wcard{width:272px;background:rgba(11,14,22,.94);border:1.5px solid rgba(212,168,67,.4);
    padding:11px 14px;position:relative;overflow:hidden;transition:transform .16s, opacity .16s;}
  #wcard.swapping{transform:translateX(-24px);opacity:0;}
  .wcslot{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(212,168,67,.75);}
  .wcname{font-family:'Cinzel',serif;font-size:17.5px;letter-spacing:.06em;color:var(--ink);margin:2px 0 8px;}
  .wcmag{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .wcmag .wcmaglbl{font-size:9px;font-weight:800;color:rgba(232,224,204,.55);letter-spacing:.22em;}
  .wcmagsegs{flex:1;display:flex;gap:2px;height:10px;}
  .wcmagsegs i{flex:1;background:#6fd6ff;border-radius:1px;}
  .wcmagsegs i.spentround{background:rgba(232,224,204,.14);}
  .wcmagsegs.wcbelt{background:rgba(232,224,204,.14);border-radius:1px;display:block;position:relative;}
  .wcmagsegs.wcbelt i{position:absolute;left:0;top:0;bottom:0;border-radius:1px;}
  .wcmag b{font-size:13.5px;font-weight:800;color:#6fd6ff;letter-spacing:.06em;min-width:42px;text-align:right;}
  .wcmag.low .wcmagsegs i:not(.spentround){background:#e0a33e;}
  .wcmag.low b{color:#e0a33e;}
  .wcmag.dry b{color:#e0483e;animation:dryflash 0.9s infinite;}
  .wcstats{display:block;margin-bottom:10px;}
  .wcstat{display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.14em;margin-top:6px;}
  .wcstat b{color:var(--ink);font-weight:800;font-size:12px;letter-spacing:.04em;}
  .wcstat span{color:rgba(232,224,204,.55);text-transform:uppercase;font-weight:700;}
  .wcbar{height:3px;background:rgba(232,224,204,.12);border-radius:2px;margin-top:3px;overflow:hidden;}
  .wcbar i{display:block;height:100%;background:var(--brass);border-radius:2px;}
  .wcrow{display:flex;gap:6px;}
  .wcbtn{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--bone);background:rgba(20,26,46,.9);
    border:1.5px solid rgba(212,168,67,.4);padding:8px 0;cursor:pointer;}
  .wcbtn:hover{border-color:var(--brass);color:var(--brass);}
  .wcbtn.armed{background:var(--plasma);color:var(--void);border-color:var(--plasma);}
  #endturnbtn{border-color:var(--brass);color:var(--brass);}
  .portrait{
    background:rgba(20,26,46,.85);border:1px solid rgba(212,168,67,.3);
    border-radius:2px;padding:8px 6px;cursor:pointer;text-align:center;
    transition:border-color .15s;
  }
  .portrait.sel{border-color:var(--brass);box-shadow:0 0 10px rgba(212,168,67,.35);}
  .portrait.dead{opacity:.35;filter:grayscale(1);cursor:default;}
  .pface{
    font-family:'Cinzel',serif;font-weight:800;font-size:20px;
    width:42px;height:42px;border:2px solid var(--brass);border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin:0 auto 5px;
  }
  .pname{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);}
  .parmor{height:3px;background:rgba(154,164,181,.25);margin-top:5px;border-radius:2px;overflow:hidden;}
  .parmor i{display:block;height:100%;background:#9aa4b5;}
  .phpbar{height:4px;background:rgba(224,72,62,.25);margin-top:2px;border-radius:2px;overflow:hidden;}
  .phpbar i{display:block;height:100%;background:var(--plasma);}
  .pstress{height:3px;background:rgba(224,163,62,.18);margin-top:3px;border-radius:2px;overflow:hidden;}
  .pstress i{display:block;height:100%;background:#b06ae0;}
  .pstate{font-size:8px;letter-spacing:.16em;text-transform:uppercase;margin-top:4px;font-weight:700;}
  #charstats{
    background:rgba(20,26,46,.85);border:1px solid rgba(212,168,67,.3);
    border-radius:2px;padding:8px;font-size:10px;
  }
  #charstats .csrow{display:flex;justify-content:space-between;margin-bottom:3px;}
  #charstats .csrow b{color:var(--plasma);font-weight:700;}
  #charstats .cslabel{color:rgba(232,224,204,.6);letter-spacing:.08em;}
  .csdesc{
    font-size:9.5px;color:rgba(232,224,204,.6);letter-spacing:.04em;
    margin-top:4px;line-height:1.5;font-style:italic;
  }
  #charstats .csstate{margin-top:5px;text-align:center;font-size:9px;
    letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
  #objtrack{
    position:absolute;top:52px;right:12px;z-index:7;max-width:210px;
    background:rgba(11,14,26,.88);border:1px solid rgba(212,168,67,.3);
    border-right:3px solid var(--brass);border-radius:2px;padding:9px 12px;
    font-size:10px;letter-spacing:.05em;
  }
  #objtrack .otitle{
    font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(212,168,67,.65);margin-bottom:5px;
  }
  #objtrack .oline{color:var(--bone);line-height:1.5;}
  #objtrack .osec{margin-top:5px;line-height:1.55;}
  #objtrack .ok{color:#6fd6ff;}
  #objtrack .bad{color:rgba(224,72,62,.85);}
  #objtrack .dim{color:rgba(232,224,204,.55);}
  #statetoast{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:8;
    background:rgba(11,14,26,.94);border:1px solid rgba(224,163,62,.5);border-radius:2px;
    padding:7px 16px;font-size:11px;letter-spacing:.06em;color:var(--bone);
    opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;
  }
  #statetoast.show{opacity:1;}
  #sysmodal{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:42;
    text-align:center;visibility:hidden;pointer-events:none;opacity:0;
    transition:opacity .3s, visibility .3s;cursor:pointer;
    background:rgba(11,14,26,.96);border:1px solid rgba(111,214,255,.45);
    border-left:3px solid var(--plasma);border-radius:2px;padding:26px 40px;max-width:460px;
    box-shadow:0 0 50px rgba(0,0,0,.7), 0 0 24px rgba(111,214,255,.12);
  }
  #sysmodal.show{visibility:visible;pointer-events:auto;opacity:1;}
  #askmodal{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:43;
    text-align:center;visibility:hidden;pointer-events:none;opacity:0;
    transition:opacity .25s, visibility .25s;
    background:rgba(11,14,26,.97);border:1px solid rgba(212,168,67,.5);
    border-left:3px solid var(--brass);border-radius:2px;padding:24px 36px;max-width:430px;
    box-shadow:0 0 50px rgba(0,0,0,.75);
  }
  #askmodal.show{visibility:visible;pointer-events:auto;opacity:1;}
  #leftbar.hidden, #rightbar.hidden{visibility:hidden;}
  #shipHead{display:flex;justify-content:center;gap:26px;align-items:baseline;margin:2px 0 8px;}
  #topBanner{position:fixed;top:0;left:0;right:0;z-index:64;
    display:none;align-items:baseline;gap:22px;justify-content:center;
    padding:14px 16px 12px;border-bottom:1px solid rgba(212,168,67,.25);
    background:rgba(5,7,13,.92);}
  body.deck #topBanner{display:flex;}
  body:has(#roster:not(.hidden)) #topBanner{display:flex;}
  #bnTitle{font-family:'Cinzel',serif;font-weight:800;font-size:19px;letter-spacing:.3em;
    color:var(--brass);white-space:nowrap;}
  #shipName{font-size:11.5px;letter-spacing:.28em;color:rgba(232,224,204,.55);text-transform:uppercase;white-space:nowrap;}
  #carryCard{position:fixed;left:12px;bottom:12px;z-index:60;width:210px;display:none;
    background:rgba(11,14,26,.94);border:1.5px solid rgba(212,168,67,.5);
    padding:12px 14px;box-shadow:0 4px 22px rgba(0,0,0,.6);}
  #carryCard .wcname{font-family:'Cinzel',serif;font-size:15px;font-weight:800;}
  #carryCard .wcgroup{font-size:8.5px;letter-spacing:.24em;color:rgba(232,224,204,.5);margin:3px 0 8px;}
  #carryCard .wcstats div{display:flex;justify-content:space-between;gap:10px;
    font-size:10px;letter-spacing:.1em;padding:2.5px 0;background:none;border:none;}
  #carryCard .wcname{color:var(--brass);}
  #carryCard .wcstats span{color:rgba(232,224,204,.5);}
  #carryCard .wcstats b{color:var(--bone);white-space:nowrap;}
  #carryCard .wcbtn{width:100%;margin-top:8px;padding:8px 0;background:rgba(212,168,67,.14);
    border:1.5px solid rgba(212,168,67,.5);color:var(--bone);cursor:pointer;
    font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.18em;}
  #carryCard .wcbtn:hover{border-color:var(--brass);color:var(--brass);}
  .bzNote{width:100%;border:1.5px solid rgba(232,224,204,.18);border-left:4px solid var(--bone);
    background:rgba(14,18,32,.85);padding:11px 16px;font-size:12px;line-height:1.55;
    color:rgba(232,224,204,.8);}
  .bzNote b{display:block;font-size:10px;letter-spacing:.26em;margin-bottom:4px;}
  .bnStat{font-size:13px;letter-spacing:.2em;color:rgba(232,224,204,.7);text-transform:uppercase;white-space:nowrap;}
  .bnStat b{color:var(--ink);font-weight:800;}
  #bnNewGame{font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
    color:rgba(232,224,204,.4);text-decoration:underline dotted;}
  #bnNewGame:hover{color:var(--casualty, #e0483e);}
  #shipCredits{font-family:'Cinzel',serif;font-size:16px;color:var(--brass);letter-spacing:.08em;}
  #shipBack{position:fixed;top:58px;left:14px;z-index:64;
    font:700 10.5px 'Space Grotesk',sans-serif;letter-spacing:.16em;color:var(--brass);
    background:rgba(5,7,13,.9);border:1.5px solid rgba(212,168,67,.5);
    padding:8px 14px;cursor:pointer;}
  #shipBack:hover{background:rgba(212,168,67,.12);}
  #cbwindow{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.2em;
    margin:2px 0 8px;min-height:13px;}
  #cbwindow.cbOpen{color:#6fd6ff;}
  #cbwindow.cbUrgent{color:#e0a33e;}
  #cbwindow.cbLapsed{color:rgba(232,224,204,.35);}
  #mapWrap{position:fixed;inset:0;z-index:61;background:#05070d;overflow:hidden;}

  #mapCanvas{width:100%;height:100%;display:block;cursor:grab;}
  #mapHud{position:absolute;top:100px;left:16px;font-size:11px;letter-spacing:.18em;
    color:rgba(212,168,67,.9);text-transform:uppercase;pointer-events:none;}
  #planetView{position:absolute;inset:0;background:rgba(5,7,13,.97);overflow-y:auto;
    padding:100px 36px 28px;z-index:62;}
  #pvOverview{max-width:940px;margin:0 auto;}
  #pvHero{display:block;width:100%;height:300px;border:1.5px solid rgba(212,168,67,.4);
    box-sizing:border-box;background:#070a12;}
  #pvTitleRow{display:flex;align-items:baseline;gap:16px;margin:12px 2px 10px;}
  #pvName{font-family:'Cinzel',serif;font-size:26px;font-weight:800;color:var(--bone);letter-spacing:.1em;}
  #pvTag{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(212,168,67,.9);}
  #pvBody{display:flex;gap:22px;align-items:flex-start;}
  .pvAreas{display:flex;flex-direction:column;gap:12px;width:170px;flex:0 0 170px;}
  .pvAreaBtn{font:700 12.5px 'Space Grotesk',sans-serif;letter-spacing:.1em;text-align:left;
    color:var(--bone);background:rgba(20,26,46,.85);border:1.5px solid rgba(232,224,204,.3);
    padding:13px 15px;cursor:pointer;transition:all .12s;}
  .pvAreaBtn:hover{border-color:rgba(212,168,67,.7);background:rgba(212,168,67,.1);}
  .pvAreaBtn.pvDepart{border-color:rgba(212,168,67,.5);color:var(--brass);}
  #pvDescCol{flex:1;min-width:0;}
  #pvDesc{font-size:13px;color:rgba(232,224,204,.78);line-height:1.65;text-align:justify;
    border:1.5px solid rgba(232,224,204,.18);background:rgba(11,14,22,.6);padding:16px 20px;}
  #pvDesc p{margin:0 0 11px;} #pvDesc p:last-child{margin-bottom:0;}
  #pvStageWrap{max-width:940px;margin:0 auto;}
  #pvStageHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  #pvStageTitle{font-family:'Cinzel',serif;font-size:20px;font-weight:800;color:var(--bone);letter-spacing:.14em;}
  #pvBack{font:700 10px 'Space Grotesk',sans-serif;letter-spacing:.16em;color:var(--brass);
    background:none;border:1.5px solid rgba(212,168,67,.45);padding:7px 12px;cursor:pointer;}
  #pvContracts{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch;}
  .pvPost{border:1.5px solid rgba(212,168,67,.35);background:rgba(14,18,32,.92);
    padding:0 0 22px 0;width:408px;display:flex;flex-direction:column;
    box-shadow:0 4px 22px rgba(0,0,0,.55);overflow:hidden;}
  .pvPost > *:not(.ppArt):not(.ppNameBand){margin-left:19px;margin-right:19px;}
  .ppNameBand{background:rgba(212,168,67,.12);border-bottom:1.5px solid rgba(212,168,67,.35);
    padding:9px 14px;text-align:center;}
  .ppArt{width:100%;height:120px;display:block;border-bottom:1.5px solid rgba(212,168,67,.25);
    background:#0b0e16;}
  .ppEmp{font-size:12px;letter-spacing:.18em;color:var(--brass);font-weight:800;
    margin-top:14px;line-height:1.6;}
  .ppEmp span{display:block;font-size:10px;letter-spacing:.26em;color:rgba(232,224,204,.5);
    font-weight:700;}
  .ppObj b{display:block;font-size:10.5px;letter-spacing:.3em;color:rgba(111,214,255,.6);
    margin-bottom:3px;}
  .ppObj2 b{color:rgba(176,106,224,.7);}
  .ppObj2{color:#b06ae0 !important;}
  .ppFeeBox{border:1.5px solid rgba(212,168,67,.5);background:rgba(212,168,67,.07);
    padding:13px 16px 14px;text-align:center;margin-top:16px;
    box-shadow:inset 0 0 18px rgba(212,168,67,.08);}
  .ppFeeBox span{display:block;font-size:9.5px;letter-spacing:.3em;
    color:rgba(232,224,204,.55);font-weight:700;margin-bottom:5px;}
  .ppFeeBox b{display:block;font-family:'Cinzel',serif;font-size:32px;font-weight:800;
    color:var(--brass);line-height:1.05;text-shadow:0 0 14px rgba(212,168,67,.35);
    white-space:nowrap;}
  .ppFeeBox i{display:block;font-style:normal;font-size:11px;letter-spacing:.16em;
    color:rgba(232,224,204,.75);font-weight:700;margin-top:6px;white-space:nowrap;}
  .ppMetaRow{font-size:11px;letter-spacing:.2em;font-weight:700;margin-top:8px;
    color:rgba(232,224,204,.6);white-space:nowrap;}
  .pvPost button.ppTermsBtn, .ptFoot button.ppTermsBtn{margin:14px 19px 0;width:auto;
    box-sizing:border-box;background:transparent;color:rgba(232,224,204,.75);
    font:700 11.5px 'Space Grotesk',sans-serif;letter-spacing:.22em;padding:9px 0;
    border:1.5px solid rgba(232,224,204,.3);cursor:pointer;box-shadow:none;}
  .pvPost button.ppTermsBtn:hover, .ptFoot button.ppTermsBtn:hover{
    border-color:rgba(232,224,204,.6);box-shadow:none;}
  #ppTerms{position:fixed;inset:0;background:rgba(7,9,15,.72);z-index:86;
    display:none;align-items:center;justify-content:center;}
  #bnLog{font-size:10px;letter-spacing:.22em;color:rgba(212,168,67,.75);cursor:pointer;
    text-transform:uppercase;border-bottom:1px dotted rgba(212,168,67,.4);}
  #bnLog:hover{color:var(--brass);}
  #chronWin{position:fixed;inset:0;background:rgba(7,9,15,.72);z-index:86;
    display:none;align-items:center;justify-content:center;}
  .chBox{width:620px;max-height:84vh;display:flex;flex-direction:column;
    background:rgba(14,18,32,.98);border:1.5px solid rgba(212,168,67,.5);
    box-shadow:0 0 60px rgba(0,0,0,.8);}
  .chScroll{overflow-y:auto;overflow-x:hidden;padding:14px 22px;flex:1;min-height:0;}
  .chRow{border-left:3px solid var(--bone);padding:8px 0 9px 14px;margin-bottom:10px;}
  .chEyebrow{font-size:9.5px;letter-spacing:.28em;color:rgba(212,168,67,.75);
    font-weight:800;margin-bottom:3px;}
  .chText{font-size:13.5px;color:rgba(232,224,204,.85);line-height:1.55;}
  .ptBox{width:480px;max-height:84vh;display:flex;flex-direction:column;
    background:rgba(14,18,32,.98);border:1.5px solid rgba(212,168,67,.5);
    box-shadow:0 0 60px rgba(0,0,0,.8);}
  .ptScroll{overflow-y:auto;overflow-x:hidden;padding:0 22px 14px;flex:1;min-height:0;}
  .ptFoot{display:flex;gap:12px;padding:12px 19px 16px;border-top:1px solid rgba(212,168,67,.25);}
  .ptFoot button{flex:1;}
  .ptFoot button.ppTermsBtn{margin:0;}

function angleDiff(a, b){
  let d = a - b;
  while(d >  Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  return d;
}

// ---------- morale ----------
// Every unit carries stress. Bravery raises the thresholds and speeds recovery.
// The ladder: steady -> shaken (functioning, badly) -> broken (out of the fight,
// still on the field) -> panicked (the AI takes the wheel).
const MORALE_ORDER = {steady:0, shaken:1, broken:2, panicked:3};

function unitBravery(u){
  return u.stats ? u.stats.bravery : ARCHETYPES[u.type].bravery;
}
function moraleThresholds(u){
  const B = unitBravery(u);
  return {shaken: 30 + B*3, broken: 60 + B*3, panicked: 85 + B*3};
}

// ---------- sedation: alert -> drowsy -> staggering -> out cold ----------
// Deterministic chemistry: stun charge accumulates, and a body's mass decides
// how much it takes. A Soldier drops to one good arc; a Breaker shrugs off three.
function sedCap(u){
  const r = u.r || 10;
  return Math.max(6, Math.round(10 * Math.pow(r/10, 3)));
}

// stun chemistry weighs on the legs: morale governs the gun, sedation the feet
function sedMoveMul(u){
  const st = sedState(u);
  return st === 'drowsy' ? 0.75 : st === 'staggering' ? 0.5 : 1;
}

function sedState(u){
  if(u.ko) return 'out cold';
  const f = (u.sed || 0) / sedCap(u);
  if(f >= 0.65) return 'staggering';
  if(f >= 0.35) return 'drowsy';
  return 'alert';
}

function addSed(u, amt, author){
  if(!u.alive || u.ko || amt <= 0) return;
  explainState('sedated');
  u.sed = (u.sed || 0) + amt;
  if(u.sed >= sedCap(u)){
    u.ko = true;
    if(!u.stats && author && author.stats){
      bark(author, 'sedKO');
      if(state.aar && state.aar.perHero[author.name]) state.aar.perHero[author.name].subdued++;
    }
    u.sed = sedCap(u);
    u.moving = false; u.run = null;
    addPopup(u.x, u.y - (u.r||10) - 10, 'OUT COLD', '#6fd6ff');
    spawnBurst(u.x, u.y, 12, '#6fd6ff', 180);
    if(u.stats){ u.koTurns = 2; u.ap = 0; }   // heroes come round; hostiles stay down
    else checkWin();                           // a body out cold is neutralised
  }else{
    addPopup(u.x, u.y - (u.r||10) - 10, 'ZZT', '#6fd6ff');
  }
}

function isFearless(u){
  return !!(u.stats ? u.stats.fearless : ARCHETYPES[u.type].fearless);
}

function addStress(u, amt){
  if(!u.alive || u.ko || u.downed || amt <= 0) return;   // the unconscious are past worrying
  if(u.bulwark) return;                   // fear breaks on the plate
  if(isFearless(u)){ if(u.stats && amt >= 16) bark(u, 'nerve'); return; }   // just weather
  u.stress += amt;
  updateMorale(u);
}

function decayStress(u){
  const B = unitBravery(u);
  u.stress = Math.max(0, u.stress - (8 + B*0.8));
  updateMorale(u);
}

// first contact with a system freezes the world and explains it, once
let sysOpen = false;
let sysPauseOn = true;         // automated runs can disable the pause
const sysQueue = [];
function setSysPause(v){ sysPauseOn = !!v; }
function setContractsPlayed(n){ contractsPlayed = n; }
function maybeAdviseWatch(){
  const s = state;
  if(s.range || s.over || contractsPlayed < 2) return;
  const living = s.squad.filter(c => c.alive && !c.ko);
  if(!living.length) return;
  const covered = living.filter(c => hugsCoverAt(c.x, c.y, c.r)).length;
  if(covered >= Math.min(2, living.length)) explainState('watch');
}
function contractStartAdvisory(key){
  if(state.range || STATE_EXPLAINED[key] || !STATE_TIPS[key]) return;
  STATE_EXPLAINED[key] = true;
  if(!sysPauseOn) return;
  sysQueue.push(key);
  showNextSys();
}
function clipEmptyAdvisory(){
  // the first dry trigger-pull teaches itself, cap-exempt: mid-fight is exactly when it matters
  if(state.range || STATE_EXPLAINED.clipempty || !STATE_TIPS.clipempty) return;
  STATE_EXPLAINED.clipempty = true;
  if(!sysPauseOn) return;
  sysQueue.push('clipempty');
  showNextSys();
}
function downedAdvisory(c){
  // the first knockdown teaches itself: bypasses the turn gate, the gap, and the cap —
  // this is the one lesson that cannot wait for a quieter moment
  if(state.range || STATE_EXPLAINED.downed || !STATE_TIPS.downed) return;
  STATE_EXPLAINED.downed = true;
  if(!sysPauseOn) return;
  sysQueue.push('downed');
  showNextSys();
}
function explainState(key){
  if(state.range || state.over) return;   // a finished contract teaches nothing new
  if(advisoriesThisContract >= ADVISORIES_PER_CONTRACT) return;   // two per contract: the rest reload
  // the first turn is the player's alone: any advisory triggered now reloads for later
  if(state.turn < 2) return;
  if(STATE_EXPLAINED[key] || !STATE_TIPS[key]) return;
  if(!sysPauseOn){ STATE_EXPLAINED[key] = true; return; }   // automated runs consume silently
  // the window is closed: the advisory reloads, unmarked, for the next occurrence
  if(sysOpen || briefOpen) return;
  if(lastAdvisoryAt && Date.now() - lastAdvisoryAt < ADVISORY_GAP) return;
  STATE_EXPLAINED[key] = true;
  sysQueue.push(key);
  showNextSys();
}
// Bureau Advisories: the game's one teacher, a lesson at the moment of need.
// No two advisories within 45 seconds: queued lessons wait their turn.
let lastAdvisoryAt = 0;
const ADVISORY_GAP = 45000;
function setAdvisoryClock(t){ lastAdvisoryAt = t; }
function showNextSys(){
  if(!sysQueue.length){ sysOpen = false; return; }
  if(lastAdvisoryAt && Date.now() - lastAdvisoryAt < ADVISORY_GAP){ sysOpen = false; return; }
  const key = sysQueue.shift();
  if(!key){ sysOpen = false; return; }
  sysKey = key;
  advisoriesThisContract++;
  sysOpen = true;
  lastAdvisoryAt = Date.now();
  const [title, body, targetId] = STATE_TIPS[key];
  const el = document.getElementById('sysmodal');
  const ptr = document.getElementById('syspointer');
  if(ptr) ptr.style.display = 'none';
  document.querySelectorAll && document.querySelectorAll('.advtarget').forEach(b => b.classList.remove('advtarget'));
  if(targetId){
    const btn = document.getElementById(targetId);
    if(btn && ptr && el.getBoundingClientRect){
      btn.classList.add('advtarget');
      requestAnimationFrame(() => {
        const mr = el.getBoundingClientRect();
        const br = btn.getBoundingClientRect();
        if(!mr.width || !br.width) return;
        const bx = br.left + br.width / 2, by = br.top + br.height / 2;
        const mx = Math.max(mr.left + 10, Math.min(mr.right - 10, bx));
        const my = by < mr.top ? mr.top : by > mr.bottom ? mr.bottom : (by < (mr.top + mr.bottom) / 2 ? mr.top : mr.bottom);
        const sx = bx < mr.left ? mr.left : bx > mr.right ? mr.right : mx;
        const len = Math.hypot(bx - sx, by - my) - Math.max(br.width, br.height) / 2 - 6;
        if(len < 24) return;
        ptr.style.left = sx + 'px';
        ptr.style.top = my + 'px';
        ptr.style.width = len + 'px';
        ptr.style.transform = 'rotate(' + Math.atan2(by - my, bx - sx) + 'rad)';
        ptr.style.display = 'block';
      });
    }
  }
  el.innerHTML = '<div class="bclient" style="margin:0 0 4px">Bureau Advisory</div>' +
    '<div class="bname" style="font-size:19px">' + title + '</div>' +
    '<div class="btext" style="max-width:380px">' + body + '</div>' +
    '<div class="bgo">Click to continue</div>';
  el.classList.add('show');
}
let sysKey = null;
let advisoriesThisContract = 0;
const ADVISORIES_PER_CONTRACT = 2;
function closeAdvisoriesForEnd(){
  for(const k of sysQueue) delete STATE_EXPLAINED[k];
  sysQueue.length = 0;
  if(sysOpen){
    if(sysKey) delete STATE_EXPLAINED[sysKey];
    sysOpen = false;
    document.getElementById('sysmodal').classList.remove('show');
    const ptr = document.getElementById('syspointer');
    if(ptr) ptr.style.display = 'none';
    document.querySelectorAll && document.querySelectorAll('.advtarget').forEach(b => b.classList.remove('advtarget'));
  }
}
function dismissSys(){
  document.getElementById('sysmodal').classList.remove('show');
  const ptr = document.getElementById('syspointer');
  if(ptr) ptr.style.display = 'none';
  document.querySelectorAll && document.querySelectorAll('.advtarget').forEach(b => b.classList.remove('advtarget'));
  showNextSys();
}

function updateMorale(u){
  if(u.downed){
    // a downed body has no morale to lose: whatever fear was in them is quiet now
    if(u.morale !== 'steady'){ u.morale = 'steady'; }
    u.stress = 0;
    return;
  }
  if(isFearless(u)){
    if(u.morale !== 'steady'){ u.morale = 'steady'; u.stress = 0; }
    return;
  }
  const th = moraleThresholds(u);
  let target;
  if(u.stress >= th.panicked) target = 'panicked';
  else if(u.stress >= th.broken) target = 'broken';
  else if(u.stress >= th.shaken) target = 'shaken';
  else target = 'steady';

  const cur = u.morale || 'steady';
  if(target === cur) return;
  // hysteresis: recovering a state needs stress to fall a bit below the line
  if(MORALE_ORDER[target] < MORALE_ORDER[cur]){
    const line = cur === 'panicked' ? th.panicked : cur === 'broken' ? th.broken : th.shaken;
    if(u.stress > line - 10) return;
  }
  if(u.stats && (target === 'shaken' || target === 'panicked') &&
     (cur === 'steady' || (target === 'panicked' && cur !== 'panicked'))){
    bark(u, target === 'panicked' ? 'panic' : 'shaken', target === 'panicked');
    if(target === 'panicked'){
      const mate = state.squad.find(w => w !== u && w.alive && w.morale !== 'panicked');
      const pt = pairTalk();
      if(mate && pt && pt.comfort && pt.comfort[mate.kind]){
        queueBark(mate, pt.comfort[mate.kind], 1.5);
      }
    }
  }
  u.morale = target;
  if(MORALE_ORDER[target] > MORALE_ORDER[cur]){
    if(u.stats) explainState(target);
    const labels = {shaken:['SHAKEN','#e0a33e'], broken:['BROKEN','#e0483e'], panicked:['PANICKED!','#e0483e']};
    const [txt, col] = labels[target];
    if(u.stats || u.visible) addPopup(u.x, u.y - u.r - 14, txt, col);
    if(target === 'broken' || target === 'panicked'){
      u.moving = false; u.run = null;
      if(u.ap !== undefined) u.ap = 0;
    }
  }else if(target === 'steady' || (cur === 'broken' && target === 'shaken')){
    addPopup(u.x, u.y - u.r - 14, 'STEADIED', '#6fd6ff');
  }
  if(u.stats) updateHud();
}

// start-of-turn pressure: looming enemies and exposed backs wear on the nerves
function applyPressure(u, hostiles){
  let amt = 0;
  for(const h of hostiles){
    if(!h.alive) continue;
    if(h.type && u.stats && !canPerceive(h, u)) continue;   // they can't loom if they can't see you
    const d = Math.hypot(h.x-u.x, h.y-u.y);
    if(d < 70) amt += 10;                    // something is right on top of you
    else if(d < 220){
      const bearing = Math.atan2(h.y-u.y, h.x-u.x);
      if(Math.abs(angleDiff(bearing, u.facing)) > 2.36) amt += 6;  // it's behind you
    }
  }
  if(u.hp / u.maxHp < 0.3) amt += 6;         // badly wounded
  if(amt) addStress(u, amt);
}

function rangePhaseSet(p){
  state.rangePhase = p;

}
function startRange(){
  rangePrev = {usingCustom, customLevel, rosterSelection: rosterSelection.slice()};
  usingCustom = true; customLevel = RANGE_LEVEL;

  document.getElementById('roster').classList.add('hidden');

  state.range = true;
  rangePhaseSet('aim');

  document.getElementById('leftbar').classList.add('hidden');
  document.getElementById('rightbar').classList.add('hidden');
}
function spawnRangeTargets(n){
  const arch = ARCHETYPES.soldier;
  for(let i = 0; i < n; i++){
    const ex = W * (0.28 + 0.22 * i + (Math.random() - 0.5) * 0.08);
    const ey = H * (0.30 + (Math.random() - 0.5) * 0.14);
    state.enemies.push({
      x: ex, y: ey, r: arch.bodyR, type: 'soldier',
      hp: arch.hp, maxHp: arch.hp, hitFlash: 0, alive: true,
      facing: Math.random() * Math.PI * 2,
      stress: 0, morale: 'steady',
      alert: 'unaware',
      det: 0, lastKnown: null, lastSeen: null, visible: false,
      home: {x: ex, y: ey}, patrolT: 0,
      bob: Math.random() * 6, run: null, moving: false
    });
  }
}

function exitRange(){
  if(!rangePrev) return;
  document.getElementById('rangeskip').classList.remove('show');
  document.getElementById('leftbar').classList.remove('hidden');
  document.getElementById('rightbar').classList.remove('hidden');
  state.range = false;
  usingCustom = rangePrev.usingCustom; customLevel = rangePrev.customLevel;
  rosterSelection = rangePrev.rosterSelection; rangePrev = null;
  renderRoster();
  if(document.addEventListener) enterShipDeck();   // home is a deck, not a menu (browser only)
  else document.getElementById('roster').classList.remove('hidden');
}

function deckBuildMask(){
  const CS = 14, INF = 5;
  const gw = Math.ceil(W / CS), gh = Math.ceil(H / CS);
  const blocked = new Uint8Array(gw * gh);
  for(const w of state.walls){
    const x0 = w.x - INF, y0 = w.y - INF, x1 = w.x + w.w + INF, y1 = w.y + w.h + INF;
    for(let gy = Math.max(0, (y0 / CS) | 0); gy <= Math.min(gh - 1, (y1 / CS) | 0); gy++)
      for(let gx = Math.max(0, (x0 / CS) | 0); gx <= Math.min(gw - 1, (x1 / CS) | 0); gx++)
        blocked[gy * gw + gx] = 1;
  }
  const ext = new Uint8Array(gw * gh);
  const q = [];
  for(let gx = 0; gx < gw; gx++){ q.push(gx, 0, gx, gh - 1); }
  for(let gy = 0; gy < gh; gy++){ q.push(0, gy, gw - 1, gy); }
  while(q.length){
    const gy = q.pop(), gx = q.pop();
    if(gx < 0 || gy < 0 || gx >= gw || gy >= gh) continue;
    const i = gy * gw + gx;
    if(ext[i] || blocked[i]) continue;
    ext[i] = 1;
    q.push(gx + 1, gy, gx - 1, gy, gx, gy + 1, gx, gy - 1);
  }
  // merge horizontal runs into rects for cheap clipping
  const runs = (want) => {
    const out = [];
    for(let gy = 0; gy < gh; gy++){
      let run = -1;
      for(let gx = 0; gx <= gw; gx++){
        const on = gx < gw && (want === 'ext' ? ext[gy * gw + gx] === 1
                                              : (!ext[gy * gw + gx] && !blocked[gy * gw + gx]));
        if(on && run < 0) run = gx;
        if(!on && run >= 0){
          out.push({x: run * CS, y: gy * CS, w: (gx - run) * CS, h: CS});
          run = -1;
        }
      }
    }
    return out;
  };
  deckMask = {ext: runs('ext'), int: runs('int')};
}

  if(!it || it.kind !== 'weapon') return false;
  if(slot !== 'primary' && slot !== 'sidearm') return false;
  if(!weaponAllowed(d, it.key) || !slotLegal(slot, it.key)) return false;
  const other = slot === 'primary' ? 'sidearm' : 'primary';
  if(it.key === d.loadout[other]) return false;
  const old = d.loadout[slot];
  const pvOld = provOf(d, slot);
  d.loadout[slot] = it.key;
  provSet(d, slot, it);
  d.pack.splice(pi, 1);

    Object.assign({kind: 'weapon', key: old}, pvOld ? {own: pvOld.own, ownFac: pvOld.ownFac} : {}));

  if(c.mag && WPN_CLIP[it.key])

// stow a held piece in the pack without touching the ship's racks
function unequipToPack(c, slotId){

  const key = d.loadout[slotId];
  if(!key) return false;
  if(!Array.isArray(d.pack)) d.pack = [];
  if(d.pack.length >= 4) return false;
  const pv = provOf(d, slotId);
  d.pack.push(Object.assign({kind: 'weapon', key}, pv ? {own: pv.own, ownFac: pv.ownFac} : {}));
  d.loadout[slotId] = null;
  provSet(d, slotId, null);
  if(c.slot === slotId) c.weapon = 'unarmed';
  shipSave();
  return true;

function deckDown(p){
  // a loose crate underfoot: tap to lift it, or walk over and lift on arrival
  const lp = (state.props || []).find(p2 => !p2.holder && !p2.flying &&
    Math.hypot(p2.x - p.x, p2.y - p.y) < 20);
  if(lp && !unitAtPoint(state.squad, p.x, p.y, 22)){
    const c0 = pc();
    if(c0 && carriedThing(c0)){
      addPopup(lp.x, lp.y - 20, 'HANDS FULL', '#e0a33e');
    }else if(c0 && Math.hypot(c0.x - lp.x, c0.y - lp.y) <= 42){
      if(lp.bz) bzPickup(c0); else carryAttach(c0, lp);
      addPopup(c0.x, c0.y - c0.r - 14, 'PICKED UP', '#e8e0cc');
    }else if(c0){
      state.movePreview = computeMovePreview(lp.x + 20, lp.y + 14);
      if(state.movePreview && state.movePreview.valid){
        c0.propGoal = true;
        commitMove();
      }else addPopup(lp.x, lp.y - 20, 'NO PATH', '#e0a33e');
    }
    return;
  }
  // a shelf piece: near enough, read its card; too far, walk over first
  if(state.portDock && !state.deckCombat && state.shelves && state.shelves.length){
    const sh0 = bz() && bz().shop;
    if(sh0){
      let si = -1;
      state.shelves.forEach((pt, i2) => {
        if(si >= 0) return;
        const it2 = sh0.stock[i2];
        if(it2 && !it2.gone && Math.hypot(pt.x - p.x, pt.y - p.y) < 20) si = i2;
      });
      if(si >= 0 && !unitAtPoint(state.squad, p.x, p.y, 22)){
        const c0 = pc();
        if(c0 && Math.hypot(c0.x - state.shelves[si].x, c0.y - state.shelves[si].y) <= 70){
          eqCardOpen(si);
        }else if(c0){
          state.movePreview = computeMovePreview(state.shelves[si].x + 18, state.shelves[si].y + 16);
          if(state.movePreview && state.movePreview.valid){
            c0.shelfGoal = si;
            commitMove();
          }else addPopup(state.shelves[si].x, state.shelves[si].y - 18, 'NO PATH', '#e0a33e');
        }
        return;
      }
    }
  }
  // a named face on the concourse: near enough, talk; too far, walk over first
  const ncv = (state.civs || []).find(v => v.name && v.alive && !v.ko &&
    Math.hypot(v.x - p.x, v.y - p.y) < 20);
  if(ncv && !unitAtPoint(state.squad, p.x, p.y, 22)){
    const c0 = pc();
    if(c0 && Math.hypot(c0.x - ncv.x, c0.y - ncv.y) <= 110){
      portTalk(ncv);
    }else if(c0){
      state.movePreview = computeMovePreview(ncv.x + 34, ncv.y + 10);
      if(state.movePreview && state.movePreview.valid){
        c0.npcGoal = ncv.name;
        commitMove();
      }else{
        addPopup(ncv.x, ncv.y - 24, 'NO PATH', '#e0a33e');
      }
    }
    return;
  }
  const hit = unitAtPoint(state.squad, p.x, p.y, 22);
  if(hit){
    const idx = state.squad.indexOf(hit);
    if(idx >= 0 && !hit.downed && idx !== state.sel){
      state.sel = idx;              // aboard, choosing who you are is always allowed
      state.movePreview = null;
      state.moveGraph = null;
      syncWeaponButtons();
      updateHud();
    }else if(idx === state.sel && !hit.downed){
      deckDossier(hit);             // the second tap asks who they are
    }
    return;
  }
  const st = (state.stations || []).find(t => Math.hypot(t.x - p.x, t.y - p.y) < 26);
  if(st){
    const c = pc();
    if(c && Math.hypot(c.x - st.x, c.y - st.y) > 85){
      // too far: make it a destination, walk up, then use it on arrival
      const d = Math.hypot(c.x - st.x, c.y - st.y) || 1;
      const spread = (state.squad.indexOf(c) % 4) * 0.9 - 1.35;   // each hand takes a different side
      const ba = Math.atan2(c.y - st.y, c.x - st.x) + spread;
      const ax = st.x + Math.cos(ba) * 46, ay = st.y + Math.sin(ba) * 46;
      state.movePreview = computeMovePreview(ax, ay);
      if(state.movePreview && state.movePreview.valid){
        c.deckGoal = st.id;
        commitMove();
      }else{
        addPopup(st.x, st.y - 22, 'NO PATH', '#e0a33e');
      }
    }else{
      deckStation(st);
    }
    return;
  }
  // ground: walk there, no clock aboard your own ship; a plain walk cancels any errand
  const cw = pc();
  if(cw) cw.deckGoal = null;
  state.movePreview = computeMovePreview(p.x, p.y);
  commitMove();
  // together: the rest of the squad fans out around the same point
  if(state.squadMove !== false){
    const selKeep = state.sel;
    state.squad.forEach((c2, i2) => {
      if(i2 === selKeep || !c2.alive || c2.downed) return;
      if(c2.friskT && performance.now() < c2.friskT) return;   // the searched stand still
      const a2 = i2 * 2.4 + 0.8;
      state.sel = i2;
      state.movePreview = computeMovePreview(p.x + Math.cos(a2) * 48, p.y + Math.sin(a2) * 48);
      if(!(state.movePreview && state.movePreview.valid))
        state.movePreview = computeMovePreview(p.x, p.y);   // the offset is blocked: share the spot
      if(state.movePreview && state.movePreview.valid) commitMove();
      else state.movePreview = null;
    });
    state.sel = selKeep;
    state.movePreview = null;
    state.moveGraph = null;
  }
}

    c.fireMode = 'single';
    c.sPopAcc = 0; c.sPopAt = 0;
    c.armor = protMax(c);   // every mission starts with the plate whole
    c.abilityCd = 0;
    c.abilityCharges = (ABILITIES[c.kind] && ABILITIES[c.kind].charges) || 0;
    c.bulwark = false; c.perfect = false;
  }

  let spawnDefs = L.enemies;
  if(L.enemyCount && L.enemyCount < L.enemies.length){
    const fixed = L.enemies.filter(d => d.always);
    const pool = L.enemies.filter(d => !d.always);
    for(let i = pool.length - 1; i > 0; i--){        // shuffle
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    spawnDefs = fixed.concat(pool.slice(0, Math.max(0, L.enemyCount - fixed.length)));
  }
  s.enemies = spawnDefs.map(e => {
    const type = e.type || 'soldier';
    const arch = ARCHETYPES[type];
    const hp = e.hp || arch.hp;
    const ex = e.x*W, ey = e.y*H;
    return {
      x: ex, y: ey, r: arch.bodyR, type,
      hp, maxHp: hp, hitFlash: 0, alive: true,
      facing: L.alerted ? Math.atan2(py0 - ey, px0 - ex) : Math.random()*Math.PI*2,
      stress: 0, morale: 'steady',
      alert: L.alerted ? 'alerted' : 'unaware',
      det: 0, lastKnown: null, lastSeen: null, visible: false,
      home: {x: ex, y: ey}, patrolT: Math.floor(Math.random()*2),
      bob: Math.random()*6, run: null, moving: false
    };
  });

  // the range issues its own iron: survives boot-time resize re-racks
  if(usingCustom && customLevel === RANGE_LEVEL && s.squad[0]){
    const h0 = s.squad[0];
    h0.loadout = {primary: 'trainer', sidearm: h0.loadout.sidearm};
    h0.slot = 'primary'; h0.weapon = 'trainer';
  }

  document.getElementById('title').textContent = usingCustom
    ? `Legendary Space, Custom Contract: ${L.name}`
    : `Legendary Space, Contract 00${levelIdx+1}: ${L.name}`;

  if(expCtx) expCtx.clearRect(0, 0, W, H);   // new contract: nothing explored yet
  advisoriesThisContract = 0;
  s.colonyAlarm = false;
  s.burrowClock = 0;
  s.scans = [];
  if(L.cameras) for(const cm of L.cameras)
    s.scans.push({x: cm.x * W, y: cm.y * H, r: cm.r * W, camera: true});
  s.scansLeft = TUNE.scanCharges;
  s.popups = [];
  s.barks = [];
  s.barkQueue = [];
  s.openerSaid = false;
  s.aar = {shots: 0, rounds: 0, hits: 0, crits: 0, chunks: 0, loudest: 0,
           perHero: {}};
  for(const def of SQUAD_DEFS) s.aar.perHero[def.name] = {kills: 0, subdued: 0};
  s.stars = [];
  for(let i=0;i<90;i++){
    s.stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+0.3, a:Math.random()*0.5+0.15});
  }
}

function wcMagHtml(c){
  const full = clipOf(c.weapon);
  if(!isFinite(full) || !c.mag) return '';
  const left = c.mag[c.slot] || 0;
  const cls = left <= 0 ? ' dry' : (left <= Math.ceil(full / 3) ? ' low' : '');
  let strip;
  if(full > 24){
    // a belt, not a clip: a continuous fill reads where 120 slivers cannot
    strip = '<span class="wcmagsegs wcbelt"><i style="width:' + Math.round(100 * left / full) + '%"></i></span>';
  }else{
    let segs = '';
    for(let i = 0; i < full; i++) segs += '<i class="' + (i < left ? '' : 'spentround') + '"></i>';
    strip = '<span class="wcmagsegs">' + segs + '</span>';
  }
  return '<div class="wcmag' + cls + '">' +
    '<span class="wcmaglbl">CLIP</span>' + strip +
    '<b>' + left + '/' + full + '</b></div>';

// the engraved plates: click to command that operative
function paintPortrait(cv, kind, color, hurt, glyph){
  const PW2 = 176, PH2 = 176;
  cv.width = PW2 * 2; cv.height = PH2 * 2;
  const g = cv.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.fillStyle = '#0b0e16';
  g.fillRect(0, 0, PW2, PH2);
  // hatched ground: the engraving stays, the figure becomes the emblem
  g.strokeStyle = color;
  for(let y = 10; y < PH2; y += 3.2){
    g.globalAlpha = 0.05 + 0.10 * (y / PH2) + hurt * 0.10;
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(0, y + Math.sin(y * 0.31) * 1.2);
    g.lineTo(PW2, y + Math.cos(y * 0.23) * 1.2);
    g.stroke();
  }
  g.globalAlpha = 1;
  // the emblem, engraved large
  g.font = "700 84px 'Cinzel', serif";
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = color;
  g.shadowBlur = 22;
  g.fillStyle = color;
  g.globalAlpha = 0.92;
  g.fillText(glyph || '?', PW2/2, PH2/2 + 4);
  g.shadowBlur = 0;
  g.globalAlpha = 1;

  if(hurt > 0.05){
    const wg = g.createLinearGradient(0, PH2, 0, PH2 * (1 - hurt));
    wg.addColorStop(0, 'rgba(224,72,62,' + (0.28 * hurt + 0.08) + ')');
    wg.addColorStop(1, 'rgba(224,72,62,0)');
    g.fillStyle = wg;
    g.fillRect(0, 0, PW2, PH2);
  }
  g.strokeStyle = '#d4a843';
  g.globalAlpha = 0.75;
  g.lineWidth = 1;
  g.strokeRect(4.5, 4.5, PW2 - 9, PH2 - 9);
  g.globalAlpha = 1;
  g.lineWidth = 2;
  for(const [tx, ty, dx2, dy2] of [[4,4,1,1],[PW2-4,4,-1,1],[4,PH2-4,1,-1],[PW2-4,PH2-4,-1,-1]]){
    g.beginPath();
    g.moveTo(tx + dx2*9, ty); g.lineTo(tx, ty); g.lineTo(tx, ty + dy2*9);
    g.stroke();
  }
}

function renderParty(){
  const party = document.getElementById('party');
  party.innerHTML = '';
  state.squad.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'plate' + (i === state.sel ? ' sel' : '') + (c.alive ? '' : ' dead') +
      (c.morale === 'panicked' ? ' trembling' : '') +
      (c.alive && c.ap <= 0 && state.phase === 'player' ? ' dryap' : '');
    const cv = document.createElement('canvas');
    cv.style.width = '100%';
    cv.style.height = 'auto';
    cv.style.aspectRatio = '1 / 1';
    cv.style.display = 'block';
    const hurt = Math.max(0, 1 - (c.hp / c.maxHp));
    const def = SQUAD_DEFS.find(d => d.name === c.name) || {};
    paintPortrait(cv, c.kind, c.color, c.alive ? hurt : 1, def.icon || c.name[0]);
    d.appendChild(cv);
    if(c.alive){
      const pips = document.createElement('div');
      pips.className = 'appips';
      pips.title = c.ap + ' action point' + (c.ap === 1 ? '' : 's') + ' remaining';
      for(let ap = 0; ap < Math.max(c.ap, 0); ap++){
        const pip = document.createElement('i');
        pips.appendChild(pip);
      }
      if(c.ap <= 0) pips.classList.add('spent');
      d.appendChild(pips);
      const full = clipOf(c.weapon);
      if(isFinite(full) && c.mag){
        const rounds = document.createElement('div');
        rounds.className = 'magcount';
        const left = c.mag[c.slot] || 0;
        rounds.textContent = left + '/' + full;
        rounds.title = 'Rounds in the clip · Reload costs 1 AP';
        if(left <= 0) rounds.classList.add('dry');
        else if(left <= Math.ceil(full / 3)) rounds.classList.add('low');
        d.appendChild(rounds);
      }
    }
    if(c.abilityCd > 0 && c.alive){
      const ring = document.createElement('div');
      ring.className = 'cdring';
      ring.textContent = c.abilityCd;
      ring.title = (ABILITIES[c.kind] ? ABILITIES[c.kind].name : 'Special') + ' recharging';
      d.appendChild(ring);
    }
    const nm = document.createElement('div');
    nm.className = 'platename';
    nm.textContent = c.name.toUpperCase();
    d.appendChild(nm);
    const bars = document.createElement('div');
    bars.className = 'pbars';
    const mk = (cls, frac, col) => {
      const b = document.createElement('div');
      b.className = 'pb ' + cls;
      const f = document.createElement('i');
      f.style.width = Math.max(0, Math.min(100, frac * 100)) + '%';
      if(col) f.style.background = col;
      b.appendChild(f);
      bars.appendChild(b);
    };
    mk('hp', c.hp / c.maxHp, c.hp / c.maxHp <= 0.4 ? 'var(--blood)' : null);
    if(protMax(c) > 0) mk('armor', (c.armor || 0) / protMax(c), null);
    mk('stress', Math.min(1, c.stress / moraleThresholds(c).panicked), null);
    d.appendChild(bars);
    const stateEl = document.createElement('div');
    stateEl.className = 'platestate';
    stateEl.textContent = c.alive ? (c.stats.fearless ? 'fearless' : c.morale) : 'down';
    stateEl.style.color = !c.alive ? '#5a6172' :
      c.morale === 'steady' ? '#6fd6ff' : c.morale === 'shaken' ? '#e0a33e' : '#e0483e';
    d.appendChild(stateEl);
    d.addEventListener('click', () => selectChar(i));
    party.appendChild(d);
  });
}

    '</div>';

function worldToScreen(wx, wy){
  return {x: viewOX + viewScale * ((wx - cam.cx) * cam.zoom + W / 2),
          y: viewOY + viewScale * ((wy - cam.cy) * cam.zoom + H / 2)};
}
function positionInspect(u){
  // logical field point -> screen CSS point, through the view transform AND the camera
  const pa = document.getElementById('playarea');
  const sp = worldToScreen(u.x, u.y);
  const sx = sp.x, sy = sp.y;
  const px = Math.max(8, Math.min(pa.clientWidth - 182, sx + 20));
  const py = Math.max(8, Math.min(pa.clientHeight - 190, sy - 60));
  inspectEl.style.left = px + 'px';
  inspectEl.style.top = py + 'px';
  inspectEl.style.display = 'block';
}
function openHeroInspect(c){
  const st = c.stats;
  const stateCol = c.morale === 'steady' ? '#6fd6ff' : c.morale === 'shaken' ? '#e0a33e' : '#e0483e';
  inspectEl.innerHTML =
    '<h3 style="color:' + c.color + '">' + c.name + '</h3>' +
    statRow('BLOOD', (c.kind || 'human').toUpperCase() + ' \u00B7 ' +
      ((c.def && c.def.sex) === 'f' ? 'FEMALE' : 'MALE')) +
    statRow('HP', Math.ceil(c.hp) + ' / ' + st.health) +
    ((c.armor || 0) > 0 ? statRow('ARMOR', '<span style="color:#9aa4b5">' + Math.round(c.armor) + ' / ' + st.armor + '</span>') : '') +
    statRow('AP', c.ap) +
    statRow('WEAPON', WPN_NAMES[c.weapon] || c.weapon) +
    (st.fearless ? statRow('NERVE', 'FEARLESS') : statRow('STRESS', '<span style="color:#b06ae0">' + Math.round(c.stress) + '</span>')) +
    '<div class="csstate" style="color:' + stateCol + '">' + c.morale + '</div>';
  positionInspect(c);
}

function unitAtPoint(list, x, y, slack){
  for(let i=0;i<list.length;i++){
    const u = list[i];
    if(!u.alive) continue;
    if(Math.hypot(u.x-x, u.y-y) < u.r + slack) return u;
  }
  return null;
}

function selectChar(i){
  if(state.squad[i] && state.squad[i].downed) return;   // you can lift them, not pilot them
  if(busy() || !state.squad[i] || !state.squad[i].alive || i === state.sel) return;
  state.sel = i;
  state.movePreview = null;
  state.moveGraph = null;
  syncWeaponButtons();
  updateHud();
}

function weaponCardHtml(c){
  const key = c.loadout[c.slot];
  const w = wpnFor(c);
  const rng = w.melee ? (w.range + 'px reach') : Math.round(Math.min(charVisionRange(c), w.speed * w.life)) + 'px';
  const dmg = w.sed ? ('SED ' + w.sed) : (w.dmg + (w.pellets > 1 ? '×' + w.pellets : '') + (w.burst > 1 ? ' ×' + w.burst : ''));
  const noiseVal = (c.fireMode === 'burst' && w.noise) ? w.noise : (w.noise || 0);
  const perShot = (w.dmg || 0) * (w.pellets || 1);
  const stats = [
    ['DAMAGE', dmg, w.sed ? Math.min(1, w.sed / 60) : Math.min(1, perShot / 34)],
    ['RANGE', rng, Math.min(1, (w.melee ? (w.range || 0) : Math.min(charVisionRange(c), w.speed * w.life)) / 620)],
    ['NOISE', noiseVal, Math.min(1, noiseVal / 900)],
    ['COST', (w.apCost || 1) + ' AP', null],
  ];
  const other = c.slot === 'primary' ? 'sidearm' : 'primary';
  return '<div class="wcslot">' + (c.slot === 'primary' ? '① PRIMARY' : '② SIDEARM') +
      (w.flashless ? ' · <span style="color:#6fd6ff">STEALTH</span>' : ' · <span style="color:#e0a33e">LOUD</span>') + '</div>' +
    '<div class="wcname">' + WPN_NAMES[key] + '</div>' +
    (isFinite(clipOf(key)) && c.mag ? '<div id="wcmagline">' + wcMagHtml(c) + '</div>' : '') +
    '<div class="wcstats">' + stats.map(([l, v, frac]) =>
      '<div class="wcstat"><span>' + l + '</span><b>' + v + '</b></div>' +
      (frac === null ? '' : '<div class="wcbar"><i style="width:' + Math.round(frac * 100) + '%"></i></div>')
    ).join('') + '</div>' +
    '<div class="wcrow">' +
      '<button class="wcbtn" id="wcswitch" title="' + (WPN_DESC[c.loadout[other]] || '') + '">⇄ SWITCH</button>' +
      (WEAPONS[key] && WEAPONS[key].altMode ?
        '<button class="wcbtn' + (c.fireMode === 'burst' ? ' armed' : '') + '" id="wcmode" title="Fire mode. Single: one clean quiet round. Burst: three rounds, louder, exposing.">' +
        (c.fireMode === 'burst' ? '≡ BURST' : '▸ SINGLE') + '</button>' : '') +
    '</div>';
}

function carryCardHtml(c){
  const held = carriedThing(c);
  const isPkg = held && held.type === 'pkg';
  const vol = held && held.type === 'prop' && held.prop.vol;
  const str = (c.stats && c.stats.strength) || 8;
  const range = Math.round(70 + str * 13);

function syncWeaponButtons(){
  const bar = document.getElementById('weapons');
  const c = pc();
  if(!c){ bar.innerHTML = ''; return; }
  let card = document.getElementById('wcard');
  if(!card){
    card = document.createElement('div');
    card.id = 'wcard';
    bar.innerHTML = '';
    bar.appendChild(card);
  }
  if(carriedThing(c)){
    card.innerHTML = carryCardHtml(c);
    card.title = 'Hands full: the trigger waits until this is down.';
    const dd = document.getElementById('ccdrop');
    if(dd) dd.addEventListener('click', () => { dropCarried(c); });

  card.innerHTML = weaponCardHtml(c);
  card.title = WPN_DESC[c.loadout[c.slot]] || '';

  if(sw) sw.addEventListener('click', () => {
    if(busy()) return;
    card.classList.add('swapping');
    setTimeout(() => {
      const other = c.slot === 'primary' ? 'sidearm' : 'primary';
      c.slot = other;
      c.weapon = c.loadout[other] || 'unarmed';
      syncWeaponButtons();
      document.getElementById('wcard').classList.remove('swapping');
      if(tuneOpen) renderTune();
    }, 160);
  });

  if(md) md.addEventListener('click', () => {
    if(busy()) return;

    syncWeaponButtons();
  });
}

function specialLabel(c){
  const ab = ABILITIES[c.kind];
  if(!ab) return ['Special', ''];
  if(ab.charges !== undefined) return [ab.name, c.abilityCharges > 0 ? 'once per contract' : 'spent'];
  if(c.abilityCd > 0) return [ab.name, 'ready in ' + c.abilityCd];
  return [ab.name, ab.cost > 0 ? ab.cost + ' AP' : 'ready'];
}

function tryAbility(){
  if(state.range) return;
  const c = pc();
  if(!c || busy() || askOpen()) return;
  if(c.morale === 'broken' || c.morale === 'panicked') return;
  const ab = ABILITIES[c.kind];
  if(!ab) return;
  if(ab.charges !== undefined && c.abilityCharges <= 0){
    addPopup(c.x, c.y - c.r - 14, 'ALREADY SPENT', '#e0a33e'); return;
  }
  if(c.abilityCd > 0){
    addPopup(c.x, c.y - c.r - 14, 'READY IN ' + c.abilityCd, '#e0a33e'); return;
  }
  if(c.ap < ab.cost){
    addPopup(c.x, c.y - c.r - 14, 'NEEDS ' + ab.cost + ' AP', '#e0a33e'); return;
  }
  askConfirm(ab.name.toUpperCase(), ab.ask + ' Activate?', () => activateAbility(c));
}

function activateAbility(c){
  const ab = ABILITIES[c.kind];
  if(!ab) return;
  if(ab.charges !== undefined && c.abilityCharges <= 0) return;
  if(c.abilityCd > 0) return;
  if(c.ap < ab.cost) return;
  if(c.kind !== 'minotaur'){                 // the Charge pays when the hooves commit
    if(ab.cost > 0) spendAction(ab.cost);
    if(ab.charges !== undefined) c.abilityCharges--;
    if(ab.cd) c.abilityCd = ab.cd;
  }
  bark(c, 'special', true);
  if(c.kind === 'minotaur'){
    c.chargeReady = true;
    addPopup(c.x, c.y - c.r - 16, 'AIM THE CHARGE', '#d4a843');
    showBanner('CHARGE: DRAG TO AIM', '#d4a843');
  }else if(c.kind === 'vampire'){
    c.perfect = true;
    addPopup(c.x, c.y - c.r - 16, 'THE PERFECT MOMENT', '#b06ae0');
    showBanner('THE PERFECT MOMENT', '#b06ae0');
  }else if(c.kind === 'amarok'){
    showBanner('HOWL', '#c96b3e');
    addPopup(c.x, c.y - c.r - 16, 'HOWL', '#c96b3e');
    state.shake = Math.max(state.shake, 10);
    for(const e of state.enemies){
      if(!e.alive || e.ko) continue;
      if(Math.hypot(e.x - c.x, e.y - c.y) < 300){
        addStress(e, 22);
        stressPop(e, 22);
      }
    }
    noiseAt(c.x, c.y, 420);
  }else if(c.kind === 'human'){
    c.ap = Math.min(3, c.ap + 1);
    addPopup(c.x, c.y - c.r - 16, '+1 AP', '#7f9fc4');
    showBanner('ADRENAL SURGE', '#7f9fc4');
  }
  updateHud();
}

function dismissBrief(){
  if(!state.range && !usingCustom && briefOpen){
    contractsPlayed++;
    if(contractsPlayed === 1) contractStartAdvisory('actions');

  briefOpen = false;
  document.getElementById('brieftoast').classList.remove('show');

  if(state.turn <= 1 && !state.openerSaid){
    state.openerSaid = true;
    const pt = pairTalk();
    if(pt && pt.open && pt.open.length){
      const [a, b] = state.squad;
      const loKey = [a.kind, b.kind].sort().join('+');
      const lo = (LEVEL_OPENERS[currentLevel().name] || {})[loKey];
      const ex = lo || pt.open[Math.floor(Math.random() * pt.open.length)];
      // whoever's kind sorts first speaks first, the data is written that way
      const first = a.kind <= b.kind ? a : b;
      const second = first === a ? b : a;
      queueBark(first, ex[0], 0.7);
      queueBark(second, ex[1], 2.9);
    }
  }
  if(sysQueue.length && !sysOpen) showNextSys();
  // the first tip greets you centre-stage, then glides home to its corner
  // the tracker announces itself
  const ot = document.getElementById('objtrack');
  ot.classList.remove('pulse');
  void ot.offsetWidth;
  ot.classList.add('pulse');
}

function renderContractPicker(){
  const n = contractsAvailable();
  if(!usingCustom && levelIdx >= n) levelIdx = 0;
  const L = currentLevel();
  document.getElementById('cbname').textContent = usingCustom
    ? 'Custom Contract: ' + L.name
    : 'Contract 00' + (levelIdx + 1) + ' · ' + L.name;
  // where the work is, whether The Orrix is there, and how long the window holds
  const atNode = L.at ? galaxyNode(L.at) : null;
  const lvIdx = usingCustom ? -1 : levelIdx;
  const isOpen = usingCustom || lvIdx < 0 || postingOpen(lvIdx, ship.day);
  const goBtn = document.getElementById('rosterGo');
  const winEl = document.getElementById('cbwindow');
  if(winEl){
    if(usingCustom || !atNode){
      winEl.textContent = '';
      winEl.className = '';
    }else if(!isOpen){
      winEl.textContent = 'POSTING LAPSED · THE BOARD TURNS IN ' + postingReopensIn(lvIdx, ship.day) + ' DAYS';
      winEl.className = 'cbLapsed';
    }else{
      const left = postingClosesIn(lvIdx, ship.day);
      const dd = ship.at === L.at ? 0 : daysBetween(ship.at, L.at);
      if(dd >= left){
        winEl.textContent = 'CLOSES IN ' + left + ' DAY' + (left > 1 ? 'S' : '') + ' · OUT OF REACH FROM HERE';
        winEl.className = 'cbLapsed';
      }else{
        winEl.textContent = 'CLOSES IN ' + left + ' DAY' + (left > 1 ? 'S' : '');
        winEl.className = (left - dd) <= 1 ? 'cbUrgent' : 'cbOpen';
      }
    }
  }
  if(goBtn){
    if(!isOpen && !usingCustom){
      goBtn.textContent = 'POSTING LAPSED';
      goBtn.dataset.lapsed = '1';
      delete goBtn.dataset.away;
    }else if(atNode && ship.at !== L.at){
      const dd = daysBetween(ship.at, L.at);
      goBtn.textContent = 'AT ' + atNode.name.toUpperCase() + ' · ' + dd + ' DAY' + (dd > 1 ? 'S' : '') + ' OUT';
      goBtn.dataset.away = L.at;
      delete goBtn.dataset.lapsed;
    }else{
      goBtn.textContent = 'Deploy';
      delete goBtn.dataset.away;
      delete goBtn.dataset.lapsed;
    }
  }
  let firstSentence = (L.brief || '').replace(/<br\s*\/?>/g, ' ').replace(/\s+/g, ' ').split('. ')[0];
  if(firstSentence.length > 150) firstSentence = firstSentence.slice(0, 147).replace(/\s+\S*$/, '') + '…';
  document.getElementById('cbdesc').textContent = L.blurb ? L.blurb : (firstSentence
    ? firstSentence + (/[.…]$/.test(firstSentence) ? '' : '.') : '');
  const hostiles = L.enemyCount || (L.enemies || []).length;   // what deploys, not the lair pool
  const objective = L.objective || 'Neutralise all hostiles';
  const parts = ['<span class="cil">Objective</span> <span class="civ">' + objective + '</span>',
    '<span class="cil">Hostiles</span> <span class="civ">' + hostiles + '</span>'];

    parts.push('<span class="cil">Secondaries</span> <span class="civ">' + L.secondaries.length + '</span>');
  document.getElementById('cbinfo').innerHTML = parts.join('<span class="cis">·</span>');
  const many = n > 1;
  document.getElementById('cprev').style.visibility = many ? 'visible' : 'hidden';
  document.getElementById('cnext').style.visibility = many ? 'visible' : 'hidden';
}

function gridCandidates(def, slot){
  const other = slot === 'primary' ? 'sidearm' : 'primary';
  const std = ISSUE_STOCK;   // the bureau hands out three things; everything else is earned
  const keys = std.concat(ship.armoury.map(armKey).filter(k => !std.includes(k)));
  const seen = new Set();
  return keys.filter(k => {
    if(seen.has(k)) return false;
    seen.add(k);
    if(k === def.loadout[other]) return false;
    return weaponAllowed(def, k) && slotLegal(slot, k);
  });
}
function equipWeapon(def, slot, key){
  if(!weaponAllowed(def, key) || !slotLegal(slot, key)) return false;
  const other = slot === 'primary' ? 'sidearm' : 'primary';
  if(key === def.loadout[other]) return false;
  if(key === def.loadout[slot]) return true;   // already in hand
  const std = ISSUE_STOCK;
  let took = null;
  if(!std.includes(key)){                       // anything beyond issue leaves the rack…
    const ai = armFind(key);
    if(ai < 0) return false;                    // …but only if the ship owns one
    took = ship.armoury.splice(ai, 1)[0];
  }
  const old = def.loadout[slot];
  if(old && !std.includes(old))
    ship.armoury.push(armEntry(old, provOf(def, slot)));   // …and the old piece returns, paper and all
  provSet(def, slot, typeof took === 'object' ? took : null);
  def.loadout[slot] = key;
  shipSave();
  return true;
}
function wpnStatLine(key){
  const w = WEAPONS[key] || {};
  const m = WPN_META[key] || {};
  const bits = [GROUP_LABELS[m.group] || '', m.hands === 1 ? 'ONE-HANDED' : 'TWO-HANDED'];
  if(w.melee) bits.push('MELEE ' + w.dmg);
  else bits.push('DMG ' + w.dmg + (w.pellets > 1 ? '×' + w.pellets : '') + (w.burst > 1 ? ' ×' + w.burst + ' BURST' : ''));
  if(w.pen) bits.push('PEN ' + w.pen);
  if(WPN_PRICE[key] != null) bits.push(WPN_PRICE[key] + ' cr');
  return bits.filter(Boolean).join(' · ');
}
function closeWeaponGrid(){

    if(w.melee){
      rows.push(['DAMAGE', String(w.dmg)], ['HANDS', m.hands === 1 ? 'ONE' : 'TWO']);
      rows.push([(WPN_META[key] || {}).group === 'blunt' ? 'RADIUS' : 'RANGE',
                 Math.round(w.range || 0) + ((WPN_META[key] || {}).group === 'blunt' ? ' MAX' : ' DASH')],
                ['NOISE', 'NEAR-SILENT']);
      rows.push(['CRIT', '×' + (w.critMul || 1)], ['AMMO', WPN_AMMO[key] || 'None']);
      rows.push(['PRICE', (WPN_PRICE[key] || 0) + ' CR'], ['', '']);

    if((m.tags || []).includes('suppressed')) rules.push('SUPPRESSED');
    if((m.tags || []).includes('nonlethal')) rules.push('NON-LETHAL');
    if(w.melee) rules.push('DASH STRIKE');

    iDesc.textContent = WPN_DESC[key] || '';
  };
  for(const key of gridCandidates(def, slot)){
    const tile = document.createElement('div');
    tile.className = 'wgTile' + (def.loadout[slot] === key ? ' current' : '');
    const m = WPN_META[key] || {};
    const glyph = document.createElement('div');

    glyph.style.color = GROUP_COLORS[m.group] || 'var(--bone)';
    glyph.innerHTML = '<svg viewBox="0 0 40 40" width="38" height="38" fill="currentColor">' +
      (GROUP_ICONS[m.group] || '<rect x="8" y="17" width="24" height="6"/>') + '</svg>';

    tile.appendChild(glyph); tile.appendChild(call);

  ov.appendChild(box);
  if(!document.body || !document.body.appendChild) return;   // headless: overlays need a real stage
  document.body.appendChild(ov);
}
function cycleLoadout(def, slot){
  const std = WPN_SLOTS[slot];
  const pool = std.concat(ship.armoury.map(armKey).filter(k => !std.includes(k) && slotLegal(slot, k)));
  const other = slot === 'primary' ? 'sidearm' : 'primary';
  let i = pool.indexOf(def.loadout[slot]);
  for(let step = 0; step < pool.length; step++){
    i = (i + 1) % pool.length;
    const key = pool[i];
    if(key === def.loadout[other]) continue;
    if(!weaponAllowed(def, key)) continue;         // blood-locked iron will not listen
    const old = def.loadout[slot];
    let took2 = null;
    if(!std.includes(key)){                         // an exotic leaves the rack…
      const ai = armFind(key);
      if(ai >= 0) took2 = ship.armoury.splice(ai, 1)[0];
    }
    if(!std.includes(old)) ship.armoury.push(armEntry(old, provOf(def, slot)));  // …with its paper
    provSet(def, slot, typeof took2 === 'object' ? took2 : null);
    def.loadout[slot] = key;
    shipSave();
    return key;
  }
  return def.loadout[slot];
}

function recruitAvailable(){
  return RECRUIT_POOL.filter(p => !SQUAD_DEFS.some(d => d.name === p.name && !d.dead));
}
function livingRoster(){ return SQUAD_DEFS.filter(d => !d.dead); }
function hireRecruit(name){
  const p = RECRUIT_POOL.find(r => r.name === name);
  if(!p) return false;
  if(ship.credits < p.price) return false;
  if(livingRoster().length >= ship.slotsMax) return false;
  ship.credits -= p.price;
  SQUAD_DEFS.push(JSON.parse(JSON.stringify({...p, price: undefined, bio: undefined,
    hired: true, injuries: [], deployed: false})));
  chronicle('crew', 'Signed ' + p.name + ', ' + (p.cls || 'operator') + ', for ' + p.price + ' CR.');
  return true;
}
function buyWeapon(key){
  const price = WPN_PRICE[key] == null ? null : buyPrice(WPN_PRICE[key]);
  if(price == null || ship.credits < price) return false;
  ship.credits -= price;
  ship.armoury.push(key);
  chronicle('trade', 'Bought the ' + (WPN_NAMES[key] || key) + ' for ' + price + ' CR.');
  return true;
}
function sellWeapon(idx){
  const a0 = ship.armoury[idx];
  if(a0 == null) return false;
  const key = armKey(a0);
  ship.armoury.splice(idx, 1);
  ship.credits += Math.round((WPN_PRICE[key] || 100) * SELL_RATE * sellHeatMul());
  shipSave();
  return true;
}
function buySlot(){
  if(ship.credits < SLOT_PRICE) return false;
  ship.credits -= SLOT_PRICE;
  ship.slotsMax++;
  shipSave();
  return true;
}
const ISSUE_STOCK = [];   // retired: nothing is infinite; every piece is one piece
// weapons are instances: a rack entry is a key, or a key wearing its history.
// {key, own, ownFac} rides the rack; def.prov carries it while the piece is in hand.
function armKey(a){ return typeof a === 'string' ? a : (a && a.key); }
function armFind(key){ return ship.armoury.findIndex(a => armKey(a) === key); }
function provOf(def, slot){ return (def.prov || {})[slot] || null; }
function provSet(def, slot, p){
  def.prov = def.prov || {};
  if(p && (p.own || p.ownFac)) def.prov[slot] = {own: p.own, ownFac: p.ownFac};
  else delete def.prov[slot];
}
function armEntry(key, pv){
  return (pv && (pv.own || pv.ownFac)) ? {key, own: pv.own, ownFac: pv.ownFac} : key;
}
function weaponAllowed(def, key){
  const w = WEAPONS[key];
  if(w && w.race && w.race !== def.kind) return false;      // keyed to one blood
  if(w && w.raceNot && [].concat(w.raceNot).includes(def.kind)) return false;   // barred from some
  const m = WPN_META[key];
  if(m && (def.unlockedGroups || []).includes(m.group)) return true;   // a specialization opened this house
  return classAllows(def.cls, key);
}
function toggleSelect(i){
  if(defLocked(i)) return;
  if(SQUAD_DEFS[i] && SQUAD_DEFS[i].dead) return;   // the dead hold no place in the line
  const at = rosterSelection.indexOf(i);
  if(at >= 0) return;              // already deploying: two must always stand
  rosterSelection.shift();
  rosterSelection.push(i);
}

function opPickCycle(slot, dir){

}

// ---------- the galactic map shell ----------
const mapState = {init: false, zoom: 0.55, cx: 815, cy: 540, sel: null, stars: null, belt: null,
                  drag: null, moved: false};
function mapSeeded(seed){
  let t = seed >>> 0;
  return () => {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function mapBuildStars(){
  const rnd = mapSeeded(7703);
  const stars = [];
  for(let i = 0; i < 2600; i++){
    stars.push({x: (rnd() - 0.5) * 64000, y: (rnd() - 0.5) * 40000,
                m: rnd() < 0.82 ? 1 : (rnd() < 0.8 ? 2 : 3), tw: rnd()});
  }
  // a denser drift through Known Space so civilisation sits in a river of stars
  for(let i = 0; i < 500; i++){
    stars.push({x: 200 + rnd() * 1400, y: 150 + rnd() * 800, m: 1, tw: rnd()});
  }
  const belt = [];
  const raft = galaxyNode('raft');
  for(let i = 0; i < 64; i++){
    const a = rnd() * Math.PI * 2, r = 55 + rnd() * 75;
    belt.push({x: raft.x + Math.cos(a) * r * 1.3, y: raft.y + Math.sin(a) * r, s: 1 + rnd() * 2});
  }
  mapState.stars = stars; mapState.belt = belt;
}
function mapCtx(){
  const cv = document.getElementById('mapCanvas');
  if(!cv || !cv.getContext) return null;
  const ctx = cv.getContext('2d');
  return (ctx && ctx.beginPath) ? {cv, ctx} : null;
}
function initMap(){
  if(!mapState.stars) mapBuildStars();
  const m = mapCtx();
  if(!m) return;
  mapState.rect = null;          // remeasure on every open
  if(!mapState.init){
    mapState.init = true;
    if(typeof requestAnimationFrame === 'function') requestAnimationFrame(mapLoop);
    if(typeof window !== 'undefined' && window.addEventListener)
      window.addEventListener('resize', () => { mapState.rect = null; mapState.dirty = true; });
    const cv = m.cv;
    cv.addEventListener('pointerdown', ev => {
      mapState.drag = {x: ev.clientX, y: ev.clientY, cx: mapState.cx, cy: mapState.cy};
      mapState.moved = false;
      try{ cv.setPointerCapture(ev.pointerId); }catch(err){}
    });
    cv.addEventListener('pointermove', ev => {
      if(!mapState.drag) return;
      const dx = ev.clientX - mapState.drag.x, dy = ev.clientY - mapState.drag.y;
      if(Math.hypot(dx, dy) > 4) mapState.moved = true;
      mapState.cx = mapState.drag.cx - dx / mapState.zoom;
      mapState.cy = mapState.drag.cy - dy / mapState.zoom;
      mapRender();
    });
    cv.addEventListener('pointerup', ev => {
      const wasDrag = mapState.moved;
      mapState.drag = null;
      if(!wasDrag) mapPick(ev);
    });
    cv.addEventListener('wheel', ev => {
      ev.preventDefault();
      const r = cv.getBoundingClientRect();
      const mx = ev.clientX - r.left, my = ev.clientY - r.top;
      const wx = mapState.cx + (mx - r.width / 2) / mapState.zoom;
      const wy = mapState.cy + (my - r.height / 2) / mapState.zoom;
      const f = Math.pow(1.0015, -ev.deltaY);
      mapState.zoom = Math.max(0.012, Math.min(2.4, mapState.zoom * f));
      mapState.cx = wx - (mx - r.width / 2) / mapState.zoom;
      mapState.cy = wy - (my - r.height / 2) / mapState.zoom;
      mapRender();
    }, {passive: false});
  }
  mapRender();
}
function mapPick(ev){
  const m = mapCtx();
  if(!m) return;
  const r = mapState.rect || m.cv.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let best = null, bd = 16;
  for(const n of GALAXY){
    const sx = (n.x - mapState.cx) * mapState.zoom + r.width / 2;
    const sy = (n.y - mapState.cy) * mapState.zoom + r.height / 2;
    const d = Math.hypot(mx - sx, my - sy);
    if(d < bd){ bd = d; best = n; }
  }
  mapState.sel = best ? best.id : null;
  mapSidePanel();
  mapRender();
}

function deployContract(i, picks){
  if(!postingOpen(i, ship.day) || LEVELS[i].at !== ship.at) return false;
  portReturn = state.portDock || null;
  portReturnPos = null;
  if(portReturn){
    portReturnPos = {};
    for(const c of state.squad) portReturnPos[c.name] = {x: c.x / W, y: c.y / H};
  }
  const ov = document.getElementById('crewPick') || (document.body && document.body.appendChild ? (() => {
    const d = document.createElement('div'); d.id = 'crewPick'; document.body.appendChild(d); return d;
  })() : null);
  if(!picks && ov && ov.querySelector !== undefined && typeof ov.querySelector === 'function'){
    openCrewPick(i, ov);            // the browser chooses its hands first
    return true;
  }
  leaveShipDeck();   // restores the deck's bookkeeping FIRST...
  chronicle('contract', 'Took the contract \u201C' + LEVELS[i].name + '\u201D from ' +
    (LEVELS[i].client || 'the board') + '.');
  if(picks && picks.length) rosterSelection = picks.slice(0, LEVELS[i].crew || 4);   // ...then the picks are law
  levelIdx = i; usingCustom = false;
  rosterDeployed = true;
  document.getElementById('roster').classList.add('hidden');
  if(ov) ov.style.display = 'none';
  restart();
  return true;
}
function openCrewPick(i, ov){
  const L = LEVELS[i];
  const alive = SQUAD_DEFS.map((d, k) => d.dead ? -1 : k).filter(k => k >= 0);
  const cap = L.crew || 4;
  const picked = new Set(rosterSelection.filter(k => alive.includes(k)).slice(0, cap));

function paintPlanetscape(ctx, w, h, n, t){
  const hue = PORT_HUES[n.id] != null ? PORT_HUES[n.id] : 40;
  const rnd = mapSeeded(1337 + hue * 7);
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#05070d');
  sky.addColorStop(1, 'hsl(' + hue + ',38%,10%)');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
  for(let i = 0; i < 160; i++){
    const base = 0.15 + rnd() * 0.5;
    const tw = t != null ? base * (0.55 + 0.45 * Math.abs(Math.sin(t * (0.25 + (i % 5) * 0.1) + i))) : base;
    ctx.fillStyle = 'rgba(232,224,204,' + tw + ')';
    ctx.fillRect(rnd() * w, rnd() * h * 0.8, rnd() < 0.9 ? 1 : 2, 1);
  }
  const mx = w * (0.62 + rnd() * 0.25), my = h * (0.18 + rnd() * 0.12), mr = 18 + rnd() * 26;
  const mg = ctx.createRadialGradient(mx - mr * 0.4, my - mr * 0.4, mr * 0.2, mx, my, mr);
  mg.addColorStop(0, 'hsl(' + ((hue + 140) % 360) + ',22%,52%)');
  mg.addColorStop(1, 'hsl(' + ((hue + 140) % 360) + ',28%,14%)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();
  const prad = w * 1.5, pcy = h + prad - h * 0.46;
  const pg = ctx.createLinearGradient(0, h * 0.4, 0, h);
  pg.addColorStop(0, 'hsl(' + hue + ',52%,34%)');
  pg.addColorStop(0.5, 'hsl(' + hue + ',48%,20%)');
  pg.addColorStop(1, 'hsl(' + hue + ',42%,9%)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(w / 2, pcy, prad, 0, 7); ctx.fill();
  ctx.strokeStyle = 'hsla(' + hue + ',80%,65%,.6)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(w / 2, pcy, prad + 2, Math.PI * 1.28, Math.PI * 1.72); ctx.stroke();
  for(let i = 0; i < 7; i++){
    ctx.strokeStyle = 'hsla(' + hue + ',40%,' + (18 + rnd() * 24) + '%,.35)';
    ctx.lineWidth = 3 + rnd() * 9;
    const off = h * 0.5 + rnd() * h * 0.46;
    ctx.beginPath(); ctx.arc(w / 2, pcy, prad - (off - h * 0.46), Math.PI * (1.3 + rnd() * 0.1), Math.PI * (1.6 + rnd() * 0.1)); ctx.stroke();
  }
  if(n.id === 'mercy'){
    ctx.fillStyle = 'rgba(201,107,62,.75)';
    for(let i = 0; i < 26; i++){
      ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h * 0.55, 1 + rnd() * 2.6, 0, 7); ctx.fill();
    }
  }
  ctx.fillStyle = 'hsla(' + ((hue + 40) % 360) + ',85%,70%,.8)';
  for(let i = 0; i < 40; i++){
    const a = Math.PI * (1.36 + rnd() * 0.28);
    const rr = prad - 4 - rnd() * 26;
    ctx.fillRect(w / 2 + Math.cos(a) * rr, pcy + Math.sin(a) * rr, 1.5, 1.5);
  }
}

function nodeDanger(id){ return (galaxyNode(id) || {}).danger || 0; }
function beginFlight(toId){

function beginFlightCore(nodeId){
  if(state.flight || ship.at === nodeId) return false;
  const days = daysBetween(ship.at, nodeId);
  const total = days * SEC_PER_DAY;
  // the longer and darker the road, the more the dark may hold
  const danger = Math.max(nodeDanger(ship.at), nodeDanger(nodeId));
  const checks = Math.max(1, Math.ceil(days / 2));
  const schedule = [];
  for(let i = 0; i < checks; i++){
    if(Math.random() < 0.3 + danger * 0.2)
      schedule.push(total * (0.15 + Math.random() * 0.7));
  }
  if(!schedule.length) schedule.push(total * (0.25 + Math.random() * 0.55));   // the dark always holds at least one thing
  schedule.sort((a, b) => b - a);   // consumed from the tail as time falls
  state.flight = {to: nodeId, days, total, left: total, events: schedule, intro: 3.6};
  document.getElementById('roster').classList.add('hidden');   // fly from the deck
  updateOrbitStatus();
  const fi = document.getElementById('flightIntro');
  if(fi){
    fi.style.display = 'block';
    fi.innerHTML = '<div id="fiDest">LEAVING FOR ' + galaxyNode(nodeId).name.toUpperCase() + ' IN</div>' +
                   '<div id="fiCount">3</div>';
  }

}
function flightTick(dt){
  const f = state.flight;
  if(!f) return;
  if(f.paused) return;          // the game is thinking: the stars can wait
  if(f.intro > 0){
    f.intro -= dt;
    const fc = document.getElementById('fiCount');
    const n = Math.max(1, Math.ceil(f.intro - 0.6));
    if(fc && fc.textContent !== String(n)){
      fc.textContent = String(n);
      fc.style.animation = 'none';
      void fc.offsetWidth;                       // restart the pop
      fc.style.animation = '';
    }
    if(f.intro <= 0){
      const fi = document.getElementById('flightIntro');
      if(fi) fi.style.display = 'none';
      const ft0 = document.getElementById('flightTimer');
      if(ft0) ft0.style.display = 'block';
      showBanner('UNDERWAY: ' + galaxyNode(f.to).name.toUpperCase() + ' · ' + Math.round(f.total) + 'S OUT', '#d4a843', false, true);
    }
    return;
  }
  f.left -= dt;
  while(f.events.length && f.left <= f.events[f.events.length - 1]){
    f.events.pop();
    const bA = bz();
    if(bA && bA.recoveryArmed){
      beginBoarding();   // Varric's recovery team found the Orrix
    }else{
      const pool = [];
      for(const ev of FLIGHT_EVENTS) for(let i = 0; i < ev.w; i++) pool.push(ev);
      pool[Math.floor(Math.random() * pool.length)].run();
    }
  }
  const ft = document.getElementById('flightTimer');
  if(ft) ft.textContent = Math.max(0, Math.ceil(f.left)) + 'S UNTIL ARRIVAL';
  if(f.left <= 0){
    const dest = f.to;
    state.flight = null;
    if(ft) ft.style.display = 'none';
    travelTo(dest);
    updateOrbitStatus();   // the orbit line is the door now
  }

function travelTo(nodeId){
  const n = galaxyNode(nodeId);
  if(!n || ship.at === nodeId) return 0;
  const days = daysBetween(ship.at, nodeId);
  const before = boardState(ship.day);
  ship.day += days;
  ship.at = nodeId;
  if(ship.medPod) ship.medPod.hp = Math.min(ship.medPod.max, ship.medPod.hp + days * 6);   // the pod drinks the crossing
  const after = boardState(ship.day);
  const lapsed = [], posted = [];
  for(let i = 0; i < LEVELS.length; i++){
    if(before[i] && !after[i]) lapsed.push(LEVELS[i].name.toUpperCase());
    if(!before[i] && after[i]) posted.push(LEVELS[i].name.toUpperCase());
  }
  shipSave();
  showBanner('ARRIVED: ' + n.name.toUpperCase() + ' · DAY ' + ship.day, '#d4a843', false, true);
  shipCreditsRefresh();
  const news = document.getElementById('mapNews');
  if(news){
    const bits = [];
    if(lapsed.length) bits.push('<span style="opacity:.55">WHILE YOU FLEW · LAPSED: ' + lapsed.join(', ') + '</span>');
    if(posted.length) bits.push('<span style="color:#6fd6ff">NEW POSTINGS: ' + posted.join(', ') + '</span>');
    news.innerHTML = bits.join('<br>');
    news.style.display = bits.length ? 'block' : 'none';
  }

  mapRender();

function mapPaint(){

  const {cv, ctx} = m;
  const r = mapState.rect || cv.getBoundingClientRect();
  mapState.rect = r;
  if(cv.width !== Math.round(r.width) || cv.height !== Math.round(r.height)){
    cv.width = Math.round(r.width) || 900; cv.height = Math.round(r.height) || 540;
  }
  const w = cv.width, h = cv.height, z = mapState.zoom;

  // the field: faint and endless, so Known Space can become insignificant
  for(const st of mapState.stars){
    const px = sx(st.x), py = sy(st.y);
    if(px < -4 || px > w + 4 || py < -4 || py > h + 4) continue;
    const a = st.m === 3 ? 0.75 : st.m === 2 ? 0.45 : 0.22;
    ctx.fillStyle = 'rgba(232,224,204,' + a + ')';
    const sz = st.m === 3 ? 1.6 : 1;

    }
  }
