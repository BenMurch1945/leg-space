// ---------- shared run following ----------
function followRun(ent, dt, isPlayer){
  if(!ent.moving || !ent.run) return;
  const run = ent.run;
  if(ent.stats && run.stepAt !== undefined && run.traveled >= run.stepAt){
    footfallAt(ent, run.walking);
    run.stepAt = run.traveled + 85;
  }
  // ramps are fixed lengths of deck, not fractions of the journey:
  // a long walk spends its middle at full stride instead of forever arriving
  const rampIn  = Math.min(60, run.dist * 0.3);
  const rampOut = Math.min(90, run.dist * 0.4);
  const left = run.dist - run.traveled;
  const easeIn  = rampIn  > 0 ? Math.min(1, run.traveled / rampIn) : 1;
  const easeOut = rampOut > 0 ? Math.min(1, left / rampOut) : 1;
  const speed = run.topSpeed * Math.max(0.2, Math.min(easeIn, easeOut));
  let step = speed * dt;
  let stopped = false;

  while(step > 0 && !stopped){
    const wp = run.path[run.seg + 1];
    if(!wp){ stopped = true; break; }
    const dxw = wp.x - ent.x, dyw = wp.y - ent.y;
    const rem = Math.hypot(dxw, dyw);
    if(rem < 0.5){ run.seg++; continue; }
    const dirX = dxw/rem, dirY = dyw/rem;
    run.dirX = dirX; run.dirY = dirY;
    ent.facing = Math.atan2(dirY, dirX);
    const inc = Math.min(step, 6, rem);
    ent.x += dirX * inc;
    ent.y += dirY * inc;
    run.traveled += inc;
    run.stride += inc;
    step -= inc;
    if(rem - inc < 0.5) run.seg++;

    // footstep dust
    run.dustAt += inc;
    if(run.dustAt > 24){
      run.dustAt = 0;
      state.particles.push({
        x: ent.x - dirX*ent.r*0.7, y: ent.y - dirY*ent.r*0.7 + ent.r*0.5,
        vx: -dirX*40 + (Math.random()-0.5)*30,
        vy: -dirY*40 + (Math.random()-0.5)*30 - 15,
        life: 0.45, t: 0, color: 'rgba(232,224,204,0.5)', r: Math.random()*2+1.5
      });
    }

    // a dashing body is a wrecking ball: low cover in the way is low cover no longer
    if(isPlayer && run.dash){
      for(const wl of state.walls){
        if(wl.high) continue;
        if(!circleRect(ent.x, ent.y, ent.r + 2, wl)) continue;
        for(const ch of chunksOf(wl)){
          if(ch.hp > 0 && circleRect(ent.x, ent.y, ent.r + 2, ch)){
            damageChunk(ch, 999, ent.x, ent.y, true);
          }
        }
      }
    }

    // contact: the blade's edge on a dash, the bull's shoulder on a run
    if(isPlayer){
      for(const e of state.enemies){
        if(!e.alive || e.ko) continue;
        if(Math.hypot(e.x-ent.x, e.y-ent.y) >= e.r + ent.r) continue;
        if(run.dash){
          if(!run.dash.hit.has(e)){
            run.dash.hit.add(e);
            if(run.dash.charge) ramEnemy(e, 1, ent, 2);   // the horns: double dose
            else bladeStrike(ent, e, run.dash);
          }
        }else if(!state.ramSet.has(e)){
          state.ramSet.add(e);
          ramEnemy(e, speed / run.topSpeed, ent);
        }
        shoveAside(ent, e, dirX, dirY);
      }
      if(run.dash) for(const cv of (state.civs || [])){
        if(!cv.alive || cv.ko || run.dash.hit.has(cv)) continue;
        if(Math.hypot(cv.x - ent.x, cv.y - ent.y) >= cv.r + ent.r) continue;
        run.dash.hit.add(cv);
        let dmg;
        if(run.dash.charge){ dmg = ent.stats ? ent.stats.strength : 8; }
        else{
          const perp = Math.abs((cv.x - ent.x) * Math.sin(run.dash.a) - (cv.y - ent.y) * Math.cos(run.dash.a));
          const base = (ent.weapon === 'unarmed' && ent.stats) ? ent.stats.strength : run.dash.w.dmg;
          dmg = perp <= cv.r * 0.5 ? base : Math.round(base / 2);
        }
        spawnBurst(cv.x, cv.y, 10, '#c96b3e', 240);
        civStruck(cv, dmg, 'player', ent, false, null);
        if(cv.alive && !cv.ko && (state.civs || []).includes(cv)) shoveAside(ent, cv, dirX, dirY);
      }
    }

    if(run.seg >= run.path.length - 1){
      stopped = true;
      if(isPlayer && run.dash) unstickFromWalls(ent);   // the bull does not live in the rubble
    }
  }

  if(stopped){
    if(ent.stats){
      for(const e of state.enemies){
        if(!e.alive || e.ko) continue;
        const dd = Math.hypot(e.x - ent.x, e.y - ent.y);
        if(dd < e.r + ent.r) shoveAside(ent, e, run.dirX || 1, run.dirY || 0);
      }
    }
    ent.moving = false;
    ent.run = null;
    // aboard, an arrival can be an errand: the terminal was the point of the walk
    if(ent.propGoal && state.shipDeck && !state.deckCombat && ent.stats){
      const gp = (state.props || []).find(p2 => !p2.holder && Math.hypot(p2.x - ent.x, p2.y - ent.y) < 40);
      ent.propGoal = null;
      if(gp){
        if(gp.bz) bzPickup(ent);
        else carryAttach(ent, gp);
        addPopup(ent.x, ent.y - ent.r - 14, 'PICKED UP', '#e8e0cc');
      }
    }
    if(ent.npcGoal && state.shipDeck && !state.deckCombat && ent.stats){
      const ncv = (state.civs || []).find(v => v.name === ent.npcGoal);
      ent.npcGoal = null;
      if(ncv && Math.hypot(ncv.x - ent.x, ncv.y - ent.y) < 110) portTalk(ncv);
    }
    if(ent.shelfGoal != null && state.shipDeck && !state.deckCombat && ent.stats){
      const si = ent.shelfGoal;
      ent.shelfGoal = null;
      if(state.shelves && state.shelves[si] &&
         Math.hypot(state.shelves[si].x - ent.x, state.shelves[si].y - ent.y) < 90) eqCardOpen(si);
    }
    if(ent.deckGoal && state.shipDeck && !state.deckCombat && ent.stats){
      const st = (state.stations || []).find(t => t.id === ent.deckGoal);
      ent.deckGoal = null;
      const rEl = document.getElementById('roster');
      const menuUp = rEl && rEl.classList && rEl.classList.contains && !rEl.classList.contains('hidden');
      if(st && !menuUp && Math.hypot(ent.x - st.x, ent.y - st.y) <= 85) deckStation(st, ent);
    }
  }
}

// ---------- enemy AI ----------
// Can a shooter standing at (x,y) with body radius r land a straight shot on (tx,ty)?
// Honours the same cover rules as real projectiles.
// is the low wall blocking this line the TARGET'S own cover, or just furniture?
function targetHuggingBlocker(ex, ey, er, p){
  const d = Math.hypot(p.x-ex, p.y-ey);
  if(d < 1) return false;
  const dx = (p.x-ex)/d, dy = (p.y-ey)/d;
  const ownReach = er + ADJACENT_REACH + 2;
  for(let t = 5; t < d - 12; t += 5){
    const px = ex + dx*t, py = ey + dy*t;
    for(const w of state.walls){
      if(w.high || !circleRect(px, py, 4, w)) continue;
      // the shooter's own firing step: rounds clear it, it is not the blocker
      const sx = Math.max(w.x, Math.min(ex, w.x + w.w));
      const sy = Math.max(w.y, Math.min(ey, w.y + w.h));
      if(Math.hypot(ex-sx, ey-sy) <= ownReach) continue;
      let live = false;
      for(const ch of chunksOf(w)){
        if(ch.hp > 0 && circleRect(px, py, 4, ch)){ live = true; break; }
      }
      if(!live) continue;
      // first live blocker found: is the target attached to it?
      const nx = Math.max(w.x, Math.min(p.x, w.x + w.w));
      const ny = Math.max(w.y, Math.min(p.y, w.y + w.h));
      return Math.hypot(p.x-nx, p.y-ny) <= (p.r || 11) + ADJACENT_REACH + 2;
    }
  }
  return false;
}

function canShootFrom(x, y, r, tx, ty){
  const ex = shooterExemptions(x, y, r);
  const d = Math.hypot(tx-x, ty-y);
  if(d < 1) return true;
  const dx = (tx-x)/d, dy = (ty-y)/d;
  const step = 5;
  for(let t = step; t < d - 12; t += step){
    const px = x + dx*t, py = y + dy*t;
    for(const w of state.walls){
      if(!circleRect(px, py, 4, w)) continue;
      if(!wallBlocksShot(ex, w, px, py)) continue;
      if(w.high) return false;
      // low wall: only a live chunk actually stops the round
      for(const c of chunksOf(w)){
        if(c.hp > 0 && circleRect(px, py, 4, c)) return false;
      }
    }
  }
  return true;
}

// Score a candidate position for an enemy archetype
function scorePosition(e, arch, cx, cy, target, wts){
  const p = target || nearestChar(cx, cy);
  if(!p) return 0;
  wts = wts || arch.weights;
  const d = Math.hypot(p.x-cx, p.y-cy);
  const diag = Math.hypot(W, H);
  const effRange = arch.shotSpeed * arch.shotLife * 0.9;

  const hasLOS = canShootFrom(cx, cy, e.r, p.x, p.y) && d < effRange;
  const inCover = !canShootFrom(p.x, p.y, p.r, cx, cy);

  // adjacency to a low wall is its own small bonus, a firing step
  let lowAdj = 0;
  for(const w of state.walls){
    if(w.high) continue;
    if(wallAliveFrac(w) < 0.3) continue;   // shredded cover shelters no one
    const nx = Math.max(w.x, Math.min(cx, w.x+w.w));
    const ny = Math.max(w.y, Math.min(cy, w.y+w.h));
    if(Math.hypot(cx-nx, cy-ny) <= e.r + ADJACENT_REACH){ lowAdj = 1; break; }
  }

  const pref = arch.idealRange;
  const rangeScore = 1 - Math.min(1, Math.abs(d - pref) / pref);

  // flanking: where does this candidate sit in the player's facing arc?
  const bearing = Math.atan2(cy - p.y, cx - p.x);
  const rel = Math.abs(angleDiff(bearing, p.facing));
  const flankScore = rel > 2.36 ? 1 : (rel > 1.05 ? 0.45 : 0);

  return wts.los   * (hasLOS ? 1 : 0)
       + wts.cover * ((inCover ? 1 : 0) + lowAdj*0.4)
       + wts.range * rangeScore
       + wts.close * (1 - d/diag)
       + wts.flank * flankScore
       + Math.random() * 0.25;
}

// Decide an enemy's turn: returns a plan {path, shots, melee}
function enemyDecide(e){
  const arch = ARCHETYPES[e.type];
  // broken: hits the floor, wishing for it all to be over
  if(e.morale === 'broken') return {path:null, shots:0, cower:true};
  // an alerted Valkyrie fights her way to the gate: bounding moves, cover-hungry, guns out
  const hx = currentLevel().hostileExtract;
  if(e.type === 'valkyrie' && e.alert === 'alerted' && hx){
    // her first act is the transmission: the recall is blown for all six
    if(!e.signalSent && e.alive && !e.ko){
      e.signalSent = true;
      for(const v of state.enemies){
        if(v === e || v.type !== 'valkyrie' || !v.alive || v.ko) continue;
        if(v.alert !== 'alerted'){
          v.alert = 'alerted'; v.signalSent = true;   // relayed alerts need no second broadcast
          v.lastKnown = e.lastKnown ? {x: e.lastKnown.x, y: e.lastKnown.y} : {x: e.x, y: e.y};
          addPopup(v.x, v.y - v.r - 12, 'SIGNAL RECEIVED', '#cfe1f2');
        }
      }
    }
    const g = buildMoveGraph(e);
    const gx = hx.x * W, gy = hx.y * H;
    const budget = arch.moveRange * 0.62 * sedMoveMul(e);
    const gateBearing = Math.atan2(gy - e.y, gx - e.x);
    const hereDist = Math.hypot(gx - e.x, gy - e.y);
    let best = null, bestScore = -Infinity;
    // close enough to make the door in one push: take it
    if(hereDist < budget * 1.15){
      const gate = clampTargetPoint(gx, gy, g.rects, e.r);
      const path = findPath({x: e.x, y: e.y}, gate, g);
      if(path) best = path;
    }
    if(!best){
      for(let ai = -2; ai <= 2; ai++){
        for(const rf of [0.55, 0.85]){
          const a = gateBearing + ai * 0.42;
          const t = clampTargetPoint(e.x + Math.cos(a) * budget * rf,
                                     e.y + Math.sin(a) * budget * rf, g.rects, e.r);
          const path = findPath({x: e.x, y: e.y}, t, g);
          if(!path || !path.length) continue;
          const end = path[path.length - 1];
          const progress = hereDist - Math.hypot(gx - end.x, gy - end.y);
          const score = progress
            + (hugsCoverAt(end.x, end.y, e.r) ? 95 : 0)
            + Math.random() * 18;
          if(score > bestScore){ bestScore = score; best = path; }
        }
      }
    }
    const seen = state.squad.some(c => c.alive && !c.ko && canPerceive(e, c));
    return {path: best, shots: seen ? 1 : 0, flee: true};   // one burst: rounds-per-volley is the fire stage's job
  }
  // unaware: alternate between scanning and a short patrol stroll near the post
  if(e.alert === 'unaware'){
    e.patrolT = (e.patrolT || 0) + 1;
    const restless = arch.melee && !arch.burst;   // a creature prowls; a sentry pauses to scan
    if(restless || e.patrolT % 2 === 0){
      const budget = arch.moveRange * (restless ? 1.0 : 0.9) * sedMoveMul(e);
      const g3 = buildMoveGraph(e);
      const restless2 = arch.melee && !arch.burst;
      if(restless2){
        // a roamer walks the whole cave: hold a far destination, drift toward it, pick anew on arrival
        for(let tries = 0; tries < 8; tries++){
          if(!e.wander || Math.hypot(e.wander.x - e.x, e.wander.y - e.y) < 44){
            e.wander = {x: W * (0.06 + Math.random() * 0.88), y: H * (0.06 + Math.random() * 0.88)};
          }
          const t = clampTargetPoint(e.wander.x, e.wander.y, g3.rects, e.r);
          const path = findPath({x:e.x, y:e.y}, t, g3);
          if(path && pathLen(path) > 12){
            return {path: truncatePath(path, budget), shots:0, patrol:true};
          }
          e.wander = null;   // unreachable: dream up somewhere else
        }
        return {path:null, shots:0, idle:true};
      }
      for(let tries = 0; tries < 5; tries++){
        const a = Math.random() * Math.PI * 2;
        const rr = budget * (0.5 + Math.random() * 0.9);
        const t = clampTargetPoint(e.home.x + Math.cos(a)*rr, e.home.y + Math.sin(a)*rr, g3.rects, e.r);
        const path = findPath({x:e.x, y:e.y}, t, g3);
        if(path && pathLen(path) > 24){
          return {path: truncatePath(path, budget), shots:0, patrol:true};
        }
      }
    }
    return {path:null, shots:0, idle:true};
  }
  // suspicious: go and look at what that was
  if(e.alert === 'suspicious'){
    if(e.lastKnown){
      const budget = arch.moveRange * sedMoveMul(e);
      const g2 = buildMoveGraph(e);
      const t = clampTargetPoint(e.lastKnown.x, e.lastKnown.y, g2.rects, e.r);
      const path = findPath({x:e.x, y:e.y}, t, g2);
      if(path && pathLen(path) > 14){
        return {path: truncatePath(path, budget), shots:0, investigate:true};
      }
      // arrived: nothing here, scan and stay wary
      e.lastKnown = null;
    }
    return {path:null, shots:0, idle:true};
  }
  // panicked: flee wildly, then fire at the nearest thing, friend or foe
  if(e.morale === 'panicked'){
    const budget = arch.moveRange * sedMoveMul(e);
    const g2 = buildMoveGraph(e);
    const f = fleePoint(e, budget);
    const t = clampTargetPoint(f.x, f.y, g2.rects, e.r);
    const path = findPath({x:e.x, y:e.y}, t, g2);
    return {path: path ? truncatePath(path, budget) : null, shots:0, panic:true};
  }
  refreshMemory(e);
  const p = memTarget(e);
  if(!p) return {path:null, shots:0, hold:true};   // nothing known: hold and listen
  const g = buildMoveGraph(e);
  const shaken = e.morale === 'shaken';
  const budget = arch.moveRange * (shaken ? 0.75 : 1) * sedMoveMul(e);
  // frustration: turns spent without firing turn patience into aggression
  e.noShotTurns = (e.noShotTurns || 0) + 1;
  let wts = arch.weights;
  if(e.noShotTurns >= 3 && !shaken){
    wts = {...arch.weights, close: arch.weights.close + 2.5,
           flank: arch.weights.flank + 1.5, cover: arch.weights.cover * 0.5};
  }
  const effRange = arch.shotSpeed * arch.shotLife * 0.9;
  const meleeReach = e.r + p.r + 12;
  const distNow = Math.hypot(p.x-e.x, p.y-e.y);

  // candidates: stay put + sampled reachable points
  const cands = [{x:e.x, y:e.y, path:null, score:scorePosition(e, arch, e.x, e.y, p, wts)}];
  for(let i=0; i<24; i++){
    const a = Math.random()*Math.PI*2;
    const rr = Math.sqrt(Math.random()) * budget;
    const t = clampTargetPoint(e.x + Math.cos(a)*rr, e.y + Math.sin(a)*rr, g.rects, e.r);
    const path = findPath({x:e.x, y:e.y}, t, g);
    if(!path) continue;
    const len = pathLen(path);
    if(len > budget) continue;
    const end = path[path.length-1];
    cands.push({x:end.x, y:end.y, path, score:scorePosition(e, arch, end.x, end.y, p, wts)});
  }
  cands.sort((a,b) => b.score - a.score);
  let best = cands[0] || {path: null, x: e.x, y: e.y, score: -1};   // nowhere to go is a plan too

  // a hunter stops on its own side of the prey: straight in, no orbiting
  const nearSide = (px, py) => {
    const dx = px - e.x, dy = py - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const stop = Math.max(0, d - (e.r + 10 + 6));
    return clampTargetPoint(e.x + dx / d * stop, e.y + dy / d * stop, g.rects, e.r);
  };
  // Breaker with no way to threaten: spend both actions closing
  if(arch.melee && p && distNow > budget + meleeReach && distNow > effRange){
    const t = arch.burst ? clampTargetPoint(p.x, p.y, g.rects, e.r) : nearSide(p.x, p.y);
    const path = findPath({x:e.x, y:e.y}, t, g);
    if(path){
      const cut = truncatePath(path, budget*2);
      return {path: cut, shots: 0, melee: true, doubleMove: true, target: p};
    }
  }
  // a creature with no gun always closes with intent: the strike lands on arrival
  if(arch.melee && !arch.burst && p){
    const t = nearSide(p.x, p.y);
    const path = findPath({x:e.x, y:e.y}, t, g);
    if(path){
      return {path: truncatePath(path, budget), shots: 0, melee: true, target: p};
    }
  }

  const staying = !best.path || Math.hypot(best.x-e.x, best.y-e.y) < 12;
  const toldOnly = p.told && !p.live;   // smelled, never seen: pursuit, not fire
  if(staying){
    const canHit = !toldOnly && canShootFrom(e.x, e.y, e.r, p.x, p.y) &&
                   Math.hypot(p.x-e.x, p.y-e.y) < effRange;
    const effR = arch.shotSpeed * arch.shotLife * 0.9;
    const dNow = Math.hypot(p.x-e.x, p.y-e.y);
    if(!canHit && dNow < effR && !allyInLine(e, p.x, p.y) &&
       targetHuggingBlocker(e.x, e.y, e.r, p) &&
       (p.live || (p.ghost && !p.told && p.age <= 1 && p.hoseN < 2))){
      // they're HUGGING that cover: hosing it is the whole point
      if(p.ghost && e.mem && e.mem[p.key]) e.mem[p.key].hoseN = (e.mem[p.key].hoseN || 0) + 1;
      return {path: null, shots: 2, suppress: true, melee: !!arch.melee, target: p};
    }
    if(!canHit){
      // furniture in the lane, not their cover: don't waste the magazine, find an angle
      const firing = toldOnly ? null : cands.find(cd => cd.path &&
        canShootFrom(cd.x, cd.y, e.r, p.x, p.y) && Math.hypot(p.x-cd.x, p.y-cd.y) < effRange);
      if(firing) return {path: firing.path, shots: 1, melee: !!arch.melee, target: p};
      // no angle anywhere reachable: then CLOSE. Waiting is not a plan.
      let advance = null, advD = distNow - 20;
      for(const cd of cands){
        if(!cd.path) continue;
        const cdD = Math.hypot(p.x-cd.x, p.y-cd.y);
        if(cdD < advD){ advD = cdD; advance = cd; }
      }
      if(advance) return {path: advance.path, shots: 0, melee: !!arch.melee, target: p};
    }
    return {path: null, shots: canHit ? 2 : 0, melee: !!arch.melee, target: p};
  }
  return {path: best.path, shots: toldOnly ? 0 : 1, melee: !!arch.melee, target: p};
}

function copCuffPass(){
  if(!state.deckCombat || !state.portFight) return;
  for(const e of state.enemies){
    if(!e.alive || e.ko || e.type !== 'constable') continue;
    for(const c of state.squad){
      if(!c.alive || !c.downed || c.cuffed) continue;
      if(Math.hypot(c.x - e.x, c.y - e.y) > e.r + c.r + 26) continue;
      c.cuffed = true;
      addPopup(c.x, c.y - c.r - 16, 'CUFFED \u00B7 IN THE LAW\u2019S HANDS', '#b06ae0');
      chronicle('combat', 'Constable ' + (e.name || 'the officer') + ' knelt and cuffed ' + c.name +
        ' where they lay. A prisoner changes the arithmetic.');
    }
  }
}
function startEnemyTurn(){
  if(state.shipDeck && !state.deckCombat) return;
  if(state.deckCombat && !state.enemies.some(e2 => e2.alive && !e2.ko) &&
     !(state.boarding && !state.boarding.spawned)){
    // irons out, nobody opposite: the port still takes its turn, thieves run,
    // badges walk, witnesses carry their stories, and THEN the turn comes back
    state.phase = 'enemy';
    state.worldBeatT = performance.now() + 1200;
    return;
  }
  // the law walks TOWARD the fallen it means to cuff, and cuffs at arm's reach
  if(state.portFight){
    copCuffPass();
    for(const e of state.enemies){
      if(!e.alive || e.ko || e.type !== 'constable') continue;
      const mt9 = memTarget(e);
      if(mt9 && !mt9.ghost) continue;   // a live threat still outranks the paperwork
      let dn = null, dd9 = 1e9;
      for(const c of state.squad){
        if(!c.alive || !c.downed || c.cuffed) continue;
        const d9 = Math.hypot(c.x - e.x, c.y - e.y);
        if(d9 < dd9 && segClearHigh(e.x, e.y, c.x, c.y)){ dd9 = d9; dn = c; }
      }
      if(dn) e.lastKnown = {x: dn.x, y: dn.y};
    }
  }
  if(state.boardingSetup){
    state.boardingSetup = false;
    const eb = document.getElementById('endturnbtn');
    if(eb && eb.classList) eb.classList.remove('urge');
  }
  // the aura: enemies beginning their turn near a terror-set wearer lose their nerve
  for(const c of (state.squad || [])){
    if(!c.alive || c.downed || !c.def) continue;
    const suit = outfitOf(c.def);
    if(suit.special !== 'aura') continue;
    for(const e of state.enemies){
      if(!e.alive || e.ko) continue;
      if(Math.hypot(e.x - c.x, e.y - c.y) <= suit.auraR){
        e.stress = Math.min(100, (e.stress || 0) + suit.auraStress);
        updateMorale(e);
        addPopup(e.x, e.y - e.r - 14, 'UNNERVED', '#b06ae0');
      }
    }
  }
  if(state.deckCombat && state.boarding && !state.boarding.spawned){
    // the wall gives: they come through the cut
    const b = state.boarding;
    b.spawned = true; b.telegraph = false;
    for(let i = 0; i < b.n; i++){
      const a = (i / b.n) * Math.PI * 2;
      const e = makeBoarder(i === 0 ? 'soldier' : (Math.random() < 0.5 ? 'soldier' : 'runner'),
        b.ix + Math.cos(a) * 16, b.iy + Math.sin(a) * 16);
      e.lastKnown = {x: W * 0.5, y: H * 0.52};   // they came knowing the shape of the spine
      state.enemies.push(e);
    }
    pushStepRing(b.ix, b.iy, 300);
    spawnBurst(b.bx, b.by, 30, '#e0483e', 420);
    state.shake = Math.max(state.shake || 0, 16);
    showBanner('HULL BREACHED', '#e0483e');
  }
  const s = state;
  const alive = s.enemies.filter(e => e.alive && !e.ko);
  if(!alive.length || s.over) return;
  // alarm fades slowly, going loud can't be quickly taken back
  for(const e of alive){
    refreshMemory(e);
    let anyFresh = false;
    if(e.mem) for(const k in e.mem){
      if(e.mem[k].fresh) anyFresh = true;
    }
    if(anyFresh){ e.calmT = 0; }
    else {
      e.calmT = (e.calmT || 0) + 1;
      if(e.alert === 'alerted' && e.calmT >= 5){
        e.alert = 'suspicious';
        e.det = 60;
        const g = memTarget(e);
        e.lastKnown = g ? {x: g.x, y: g.y} : e.lastKnown;
        if(e.visible) addPopup(e.x, e.y - e.r - 14, '?', '#e0a33e');
      }else if(e.alert === 'suspicious' && e.calmT >= 9){
        e.alert = 'unaware';
        e.det = 0;
        e.mem = {};
        e.lastKnown = null;
      }
    }
  }
  s.phase = 'enemy';
  showBanner('HOSTILE TURN', '#e0483e');
  s.et = {order: alive, k: -1, stage: 'next', timer: 0.7, e: null, plan: null, shotsLeft: 0, wait: 0};
  const Lb = currentLevel();
  if(Lb.burrows && !s.over){
    const brood = s.colonyAlarm ? (Lb.alarmBrood || 3) : (Lb.calmBrood || 2);
    const every = s.colonyAlarm ? (Lb.alarmEvery || 1) : (Lb.calmEvery || 3);
    const netAlert = s.colonyAlarm || s.enemies.some(e2 => e2.alive && e2.alert === 'alerted');
    s.burrowClock = (s.burrowClock || 0) + 1;
    for(let bi = 0; bi < Lb.burrows.length; bi++){
      const b = Lb.burrows[bi];
      if((s.burrowClock + bi) % every !== 0) continue;   // this mouth is between broods
      const mine = s.enemies.filter(e2 => e2.alive && e2.spawned && e2.burrow === bi).length;
      if(mine >= brood) continue;                        // her brood is whole
      const cx = b.x * W, cy = b.y * H;
      const arch2 = ARCHETYPES.arachne;
      const spawnR = Lb.burrowR || 52;
      let bx = null, by = null;
      for(let tries = 0; tries < 10; tries++){
        const a2 = Math.random() * Math.PI * 2;
        const rr2 = 16 + Math.random() * (spawnR - 16);
        const tx = cx + Math.cos(a2) * rr2, ty = cy + Math.sin(a2) * rr2;
        const inWall = s.walls.some(w2 => wallAliveFrac(w2) > 0.3 &&
          tx + arch2.bodyR > w2.x && tx - arch2.bodyR < w2.x + w2.w &&
          ty + arch2.bodyR > w2.y && ty - arch2.bodyR < w2.y + w2.h);
        if(inWall) continue;
        const crowded = s.enemies.some(e2 => e2.alive &&
          Math.hypot(e2.x - tx, e2.y - ty) < e2.r + arch2.bodyR + 5) ||
          s.squad.some(c2 => c2.alive && Math.hypot(c2.x - tx, c2.y - ty) < c2.r + arch2.bodyR + 5);
        if(crowded) continue;
        bx = tx; by = ty; break;
      }
      if(bx === null) continue;   // the mouth is blocked this turn
      // alert propagates only with information: inherit an informed sibling's intel or be born calm
      let bornAlert = 'unaware', bornLK = null;
      if(netAlert){
        const informed = s.enemies.find(e2 => e2.alive && !e2.ko &&
          (e2.type === 'arachne' || e2.type === 'queen') && e2.alert === 'alerted' && e2.lastKnown);
        if(informed){
          bornAlert = 'alerted';
          bornLK = {x: informed.lastKnown.x, y: informed.lastKnown.y};
        }
      }
      s.enemies.push({
        x: bx, y: by, r: arch2.bodyR, type: 'arachne', spawned: true, burrow: bi,
        hp: arch2.hp, maxHp: arch2.hp, hitFlash: 0, alive: true,
        facing: bornLK ? Math.atan2(bornLK.y - by, bornLK.x - bx) : Math.random() * Math.PI * 2,
        stress: 0, morale: 'steady',
        alert: bornAlert,
        det: 0, lastKnown: bornLK, lastSeen: null, visible: false,
        home: {x: cx, y: cy}, patrolT: 0,
        bob: Math.random() * 6, run: null, moving: false
      });
      spawnBurst(bx, by, 6, '#c9a6ff', 120);
    }
  }
  if(s.colonyAlarm && s.pkg && !s.pkg.delivered){
    const scent = s.pkg.carried && s.pkg.carried.alive
      ? {x: s.pkg.carried.x, y: s.pkg.carried.y}
      : {x: s.pkg.x, y: s.pkg.y};
    for(const e of s.enemies){
      if(!e.alive || e.ko) continue;
      if(e.type !== 'arachne' && e.type !== 'queen') continue;
      e.alert = 'alerted';
      e.lastKnown = {x: scent.x, y: scent.y};   // eyes still beat nose: live perception wins in decide
    }
  }

}

function enemyFireAt(e, target){
  const s = state;
  const arch = ARCHETYPES[e.type];
  const p = (target && target.alive) ? target : nearestChar(e.x, e.y);
  if(!p) return;
  if(allyInLine(e, p.x, p.y)) return;                     // never through a brother
  if(!canShootFrom(e.x, e.y, e.r, p.x, p.y) &&
     !targetHuggingBlocker(e.x, e.y, e.r, p)) return;     // walls are not targets
  const baseA = Math.atan2(p.y - e.y, p.x - e.x);
  e.facing = baseA;
  const ex = shooterExemptions(e.x, e.y, e.r);
  e.noShotTurns = 0;
  if(e.visible) pushNoiseRing(e.x, e.y, NOISE_GUN, true);
  for(const o of state.enemies){
    if(!o.alive || o === e || o.alert === 'alerted') continue;
    if(Math.hypot(o.x-e.x, o.y-e.y) < NOISE_GUN) makeSuspicious(o, p.x, p.y);
  }
  // an issued weapon shoots by its own paper; the archetype is the fallback
  const wv = (e.wpnKey && WEAPONS[e.wpnKey] && !WEAPONS[e.wpnKey].melee) ? WEAPONS[e.wpnKey] : null;
  const fwPellets = wv ? (wv.pellets || 1) : arch.pellets;
  const fwSpeed = wv ? wv.speed : arch.shotSpeed;
  const fwDmg = wv ? wv.dmg : arch.dmg;
  const fwPen = wv ? (wv.pen != null ? wv.pen : 1) : (arch.pen || 1);
  const fwLife = wv ? wv.life : arch.shotLife;
  const spread = arch.spread * DEG * TUNE.enemySpreadMul * (e.morale === 'shaken' ? 1.8 : 1);
  for(let i=0; i<fwPellets; i++){
    let a;
    if(fwPellets === 1){
      a = baseA + (Math.random()*2 - 1) * spread;
    }else{
      const f = (i/(fwPellets-1))*2 - 1;
      a = baseA + f*spread + (Math.random()*2-1)*spread*0.2;
    }
    s.bullets.push({
      x: e.x, y: e.y,
      vx: Math.cos(a)*fwSpeed, vy: Math.sin(a)*fwSpeed,
      r: 3, dmg: fwDmg * TUNE.enemyDmgMul, maxSpeed: fwSpeed, team: 'enemy', owner: e, pen: fwPen,
      maxBounces: 0, ex,
      bounces: 0, life: fwLife, trail: []
    });
  }
  spawnBurst(e.x, e.y, 5, arch.color, 120);
}

function enemyMelee(e, target){
  let p = target || nearestChar(e.x, e.y);
  if(p && !p.stats){   // a perception wrapper, not the character: resolve to the body it saw
    p = state.squad.find(c => c.alive && Math.hypot(c.x - p.x, c.y - p.y) < 26) || nearestChar(e.x, e.y);
  }
  if(!p || !p.alive) return false;
  if(Math.hypot(p.x - e.x, p.y - e.y) > e.r + p.r + 14){
    // the lunge finds only air: the ghost it chased was just a ghost
    addPopup(e.x, e.y - e.r - 10, '?', '#b06ae0');
    return false;
  }
  e.noShotTurns = 0;
  const arch = ARCHETYPES[e.type];
  e.facing = Math.atan2(p.y - e.y, p.x - e.x);
  let dmg = arch.melee * TUNE.enemyDmgMul;
  const bearing = Math.atan2(e.y - p.y, e.x - p.x);
  const rear = Math.abs(angleDiff(bearing, p.facing)) > 2.36;
  if(rear) dmg *= TUNE.rearMult;
  const crushSplit = applyDamage(p, dmg);
  p.hitFlash = 1;
  if(crushSplit.armor > 0) addPopup(p.x, p.y - p.r - 16, '-' + crushSplit.armor.toFixed(1) + ' ARMOR', '#9aa4b5');
  addPopup(p.x, p.y - p.r - 8, crushSplit.flesh.toFixed(1) + (rear ? ' REAR' : ''), rear ? '#d4a843' : '#e0483e');
  spawnBurst((p.x+e.x)/2, (p.y+e.y)/2, 16, '#e8e0cc', 300);
  state.shake = 12;
  showBanner('CRUSHED', '#b06ae0');
  if(p.hp <= 0) charDown(p);
  else { addStress(p, dmg*2 + 10); updateHud(); }
  return true;
}

function processEnemyTurn(realDt){
  const s = state;
  const et = s.et;
  if(!et) return;

  switch(et.stage){
    case 'next': {
      et.timer -= realDt;
      if(et.timer > 0) return;
      // wait for stray enemy bullets before handing back the turn
      et.k++;
      while(et.k < et.order.length && !et.order[et.k].alive) et.k++;
      if(et.k >= et.order.length){
        if(s.bullets.some(b => b.team === 'enemy' || b.team === 'wild') && et.wait < 2){
          et.wait += realDt; et.timer = 0.1; et.k--; return;
        }
        s.et = null;
        endEnemyTurn();
        return;
      }
      const e = et.e = et.order[et.k];
      decayStress(e);
      if(e.alert === 'alerted') applyPressure(e, s.squad);
      et.plan = enemyDecide(e);
      et.shotsLeft = et.plan.shots;
      const tgt = et.plan.target;
      if(et.plan.path){
        e.run = {
          path: et.plan.path, seg: 0, traveled: 0,
          dist: pathLen(et.plan.path),
          topSpeed: Math.min(LW,LH) * 0.55 * TUNE.runSpeedMul *
                    (et.plan.patrol && !e.visible ? 6 : et.plan.patrol ? 0.6 : 1),
          stride: 0, dustAt: 0
        };
        e.moving = true;
        et.stage = 'moving';
      }else if(et.plan.panic){
        wildFire(e);
        et.stage = 'post'; et.timer = 0.45;
      }else if(et.plan.cower){
        if(e.visible) addPopup(e.x, e.y - e.r - 12, '...', '#e0a33e');
        et.stage = 'post'; et.timer = 0.35;
      }else if(et.plan.idle){
        e.facing += (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random()*0.9);
        et.stage = 'post'; et.timer = e.visible ? 0.25 : 0.05;
      }else{
        if(tgt) e.facing = Math.atan2(tgt.y - e.y, tgt.x - e.x);
        if(et.plan.melee && ARCHETYPES[e.type].melee && !s.over){
          let mt = et.plan.target;
          if(mt && !mt.stats)   // perception wrapper: resolve to the body it saw
            mt = state.squad.find(c => c.alive && Math.hypot(c.x - mt.x, c.y - mt.y) < 26) || null;
          if(!mt || !mt.alive) mt = nearestChar(e.x, e.y);
          if(mt && Math.hypot(mt.x - e.x, mt.y - e.y) < e.r + mt.r + 12){
            enemyMelee(e, mt);
            et.stage = 'post'; et.timer = 0.5;
            return;
          }
        }
        et.stage = et.shotsLeft > 0 ? 'aim' : 'post';
        et.timer = et.shotsLeft > 0 ? 0.45 : 0.25;
      }
      return;
    }
    case 'moving': {
      const e = et.e;
      if(!e.alive){ et.stage = 'post'; et.timer = 0.25; return; }
      if(e.moving) return;
      if(et.plan.panic){
        wildFire(e);
        et.stage = 'post'; et.timer = 0.45;
        return;
      }
      if(et.plan.investigate || et.plan.patrol){
        // look around at the spot
        e.facing += (Math.random() < 0.5 ? -1 : 1) * 0.6;
        et.stage = 'post'; et.timer = e.visible ? 0.3 : 0.05;
        return;
      }
      // arrived, melee if in reach, else shoot if the line is there
      let p = et.plan.target;
      if(!p || !p.alive) p = et.plan.target = nearestChar(e.x, e.y);
      if(!p){ et.stage = 'post'; et.timer = 0.2; return; }
      const dist = Math.hypot(p.x-e.x, p.y-e.y);
      const arch = ARCHETYPES[e.type];
      if(et.plan.melee && arch.melee && dist < e.r + p.r + 12 && !s.over){
        const landed = enemyMelee(e, p);
        if(!landed && p.told) e.lastKnown = null;   // the trail went cold right here
        et.stage = 'post'; et.timer = 0.5;
        return;
      }
      // a ghost reached and found empty dissolves: they searched, you were gone
      if(p.ghost && Math.hypot(p.x-e.x, p.y-e.y) < 46){
        refreshMemory(e);
        const nowSee = memTarget(e);
        if(!nowSee || nowSee.ghost){
          if(e.mem) delete e.mem[p.key];
          // "Clear!", the pod drops every stale sighting near this spot
          for(const o of state.enemies){
            if(!o.alive || o === e || !o.mem) continue;
            if(Math.hypot(o.x-e.x, o.y-e.y) > 260) continue;
            const om = o.mem[p.key];
            if(om && !om.fresh && Math.hypot(om.x-p.x, om.y-p.y) < 70) delete o.mem[p.key];
          }
          addPopup(e.x, e.y - e.r - 12, '?', '#e0a33e');
          et.stage = 'post'; et.timer = 0.4;
          return;
        }
      }
      const effRange = arch.shotSpeed * arch.shotLife * 0.9;
      const witnessed = p.live || (p.ghost && !p.told && p.age <= 1 && (p.hoseN || 0) < 2);
      if(et.shotsLeft > 0 && dist < effRange && !(p.told && !p.live) &&
         (canShootFrom(e.x, e.y, e.r, p.x, p.y) || witnessed)){
        // no clean line but they watched the duck? hose the cover, twice at
        // most, and never through a pod-mate who's moved into the lane
        if(allyInLine(e, p.x, p.y)){ et.stage = 'post'; et.timer = 0.3; return; }
        if(!canShootFrom(e.x, e.y, e.r, p.x, p.y)){
          if(!targetHuggingBlocker(e.x, e.y, e.r, p)){ et.stage = 'post'; et.timer = 0.3; return; }
          et.plan.suppress = true;
          if(p.ghost && e.mem && e.mem[p.key]) e.mem[p.key].hoseN = (e.mem[p.key].hoseN || 0) + 1;
        }
        e.facing = Math.atan2(p.y - e.y, p.x - e.x);
        et.stage = 'aim'; et.timer = 0.45;
      }else{
        et.stage = 'post'; et.timer = 0.3;
      }
      return;
    }
    case 'aim': {
      et.timer -= realDt;
      if(et.timer > 0) return;
      et.burstLeft = (et.e.wpnKey && WEAPONS[et.e.wpnKey] && WEAPONS[et.e.wpnKey].burst) ||
        ARCHETYPES[et.e.type].burst || 1;
      et.stage = 'fire'; et.timer = 0;
      return;
    }
    case 'fire': {
      et.timer -= realDt;
      if(et.timer > 0) return;
      enemyFireAt(et.e, et.plan.target);
      et.burstLeft--;
      if(et.burstLeft > 0){
        et.timer = (et.e.wpnKey && WEAPONS[et.e.wpnKey] && WEAPONS[et.e.wpnKey].burstGap) ||
          ARCHETYPES[et.e.type].burstGap || 0.09;
        return;
      }
      et.shotsLeft--;
      if(et.shotsLeft > 0){
        et.stage = 'aim'; et.timer = 0.55;
      }else{
        et.stage = 'post'; et.timer = 0.45;
      }
      return;
    }
    case 'post': {
      et.timer -= realDt;
      if(et.timer > 0) return;
      et.stage = 'next'; et.timer = 0.15; et.wait = 0;
      return;
    }
  }
}

function endEnemyTurn(){
  const s = state;
  copCuffPass();   // an officer standing over the fallen cuffs before anything else
  s.phase = 'player';
  s.turn++;
  for(const c of s.squad){
    if(!c.alive || !c.downed) continue;
    if(c.cuffed){   // the law stabilises its prisoner: nobody bleeds out in custody
      addPopup(c.x, c.y - c.r - 14, 'IN CUSTODY \u00B7 STABILISED', '#b06ae0');
      continue;
    }
    c.downTimer--;
    if(c.downTimer <= 0){ charDie(c); }
    else addPopup(c.x, c.y - c.r - 14, c.downTimer + (c.downTimer === 1 ? ' TURN LEFT' : ' TURNS LEFT'), '#e0483e');
  }
  // the dying have died; only now may the law lose the scent
  if(s.deckCombat && s.portFight && !s.over){
    const liveE = s.enemies.filter(e2 => e2.alive && !e2.ko);
    const seen9 = liveE.some(e2 => s.squad.some(c2 => c2.alive && !c2.downed && canPerceive(e2, c2)));
    if(liveE.length && s.squad.some(c2 => c2.alive)){
      if(!seen9){
        s.scentT = (s.scentT || 0) + 1;
        if(s.scentT >= 3){ portFightBreakOff(); return; }
        showBanner('OUT OF SIGHT \u00B7 ' + s.scentT + '/3, THE LAW IS LOSING THE SCENT', '#b06ae0');
      }else if(s.scentT){
        s.scentT = 0;
        showBanner('SEEN, THE SCENT IS FRESH AGAIN', '#e0483e');
      }
    }
  }
  maybeAdviseWatch();
  for(const e of s.enemies){              // last-known positions grow colder
    if(!e.alive || !e.mem) continue;
    for(const k in e.mem){ if(!e.mem[k].fresh) e.mem[k].age++; }
  }
  s.scans = s.scans.filter(sc => sc.camera);   // scans fade; hacked camera feeds hold
  for(const c of s.squad){
    if(!c.alive) continue;
    if(c.ko){
      c.koTurns = (c.koTurns || 1) - 1;
      if(c.koTurns <= 0){
        c.ko = false; c.sed = 0;
        addPopup(c.x, c.y - c.r - 10, 'COMING ROUND', '#6fd6ff');
      }
    }
    c.exposed = false;                    // the flash has faded from their eyes
    c.watch = null;                       // the night watch ends
    c.bulwark = false;                    // the plate comes down
    if(c.abilityCd > 0) c.abilityCd--;
    decayStress(c);
    if(c.braced){                         // braced: nerves recover properly
      c.stress = Math.max(0, c.stress - (15 + unitBravery(c)));
      updateMorale(c);
      c.braced = false;
    }
    applyPressure(c, s.enemies);
    c.ap = (c.ko || c.morale === 'broken' || c.morale === 'panicked') ? 0 : 2;
  }
  // panicked characters act on their own before you get control
  const panicked = s.squad.filter(c => c.alive && c.morale === 'panicked');
  if(panicked.length){
    s.pq = {list: panicked, k: 0, stage: 'start', timer: 0.6};
  }
  updateHud();
  if(!s.over) showBanner('YOUR TURN', '#d4a843');
}

// ---------- panic: the AI takes the wheel ----------
function fleePoint(u, budget){
  // away from the nearest threat, with a wild swerve
  const hostiles = u.stats ? state.enemies : state.squad;
  let nx = 0, ny = 0, nd = Infinity;
  for(const h of hostiles){
    if(!h.alive) continue;
    const d = Math.hypot(h.x-u.x, h.y-u.y);
    if(d < nd){ nd = d; nx = h.x; ny = h.y; }
  }
  let a = nd < Infinity ? Math.atan2(u.y-ny, u.x-nx) : Math.random()*Math.PI*2;
  a += (Math.random()*2 - 1) * 1.1;
  return {x: u.x + Math.cos(a)*budget, y: u.y + Math.sin(a)*budget};
}

// the nearest thing they register as a threat, friend or foe
function nearestPerceivedThreat(u){
  let best = null, bd = Infinity;
  for(const o of [...state.squad, ...state.enemies]){
    if(!o.alive || o === u) continue;
    const d = Math.hypot(o.x-u.x, o.y-u.y);
    if(d < bd){ bd = d; best = o; }
  }
  return best;
}

function wildFire(u){
  const t = nearestPerceivedThreat(u);
  if(!t) return;
  if(u.stats) muzzleFlash(u, (wpnFor(u) && wpnFor(u).noise) || NOISE_GUN);
  const isChar = !!u.stats;
  const w = isChar ? wpnFor(u) : null;
  const speed = isChar ? w.speed * 0.9 : ARCHETYPES[u.type].shotSpeed;
  const life  = isChar ? w.life : ARCHETYPES[u.type].shotLife;
  const dmg   = isChar ? w.dmg * 0.9 : ARCHETYPES[u.type].dmg * TUNE.enemyDmgMul;
  const r     = isChar ? w.r : 3;
  const pellets = isChar ? w.pellets : ARCHETYPES[u.type].pellets;
  const baseA = Math.atan2(t.y-u.y, t.x-u.x);
  u.facing = baseA;
  const ex = shooterExemptions(u.x, u.y, u.r);
  for(let i=0;i<pellets;i++){
    const a = baseA + (Math.random()*2 - 1) * 14*DEG;
    state.bullets.push({
      x: u.x, y: u.y,
      vx: Math.cos(a)*speed, vy: Math.sin(a)*speed,
      r, dmg, maxSpeed: speed, team: 'wild', owner: u,
      pen: (isChar ? (w.pen || 1) : (ARCHETYPES[u.type].pen || 1)),
      maxBounces: 0, ex,
      bounces: 0, life, trail: []
    });
  }
  spawnBurst(u.x, u.y, 6, '#e0483e', 140);
  noiseAt(u.x, u.y, NOISE_GUN);
}

// ---------- ship hardpoint: the scanner ----------
// The ship in orbit paints an area of the field: full sight there, as if a
// squad member stood at the point. Passive, nothing on the ground notices.
// Lasts through the coming enemy turn, then the picture fades.
function placeScan(p){
  const s = state;
  if(s.scansLeft <= 0) return;
  s.scansLeft--;
  s.scans.push({x: p.x, y: p.y, r: TUNE.scanRange});
  addPopup(p.x, p.y, 'SCAN ACTIVE', '#6fd6ff');
  spawnBurst(p.x, p.y, 14, '#6fd6ff', 200);
  clearRallyMode();
  updateHud();
}

// ---------- rally: steady a comrade's nerves ----------
const RALLY_RANGE = 90;
function tryRescueTap(p){
  const s = state;
  if(s.phase !== 'player' || s.over || s.range) return false;
  const target = s.squad.find(c => c.alive && c.downed &&
    Math.hypot(c.x - p.x, c.y - p.y) < c.r + 14);
  if(!target) return false;
  const me = pc();
  if(!me || !me.alive || me.downed) return true;
  if(Math.hypot(me.x - target.x, me.y - target.y) <= me.r + target.r + ADJACENT_REACH){
    standUp(me, target);
  }else{
    addPopup(target.x, target.y - target.r - 14, 'GET CLOSER TO LIFT THEM', '#e0a33e');
  }
  return true;
}
function tryRally(tap){
  const me = pc();
  if(me.ap <= 0 || me.morale === 'broken' || me.morale === 'panicked') return;
  for(const c of state.squad){
    if(!c.alive || c === me) continue;
    if(Math.hypot(c.x - tap.x, c.y - tap.y) > c.r + 14) continue;   // tap on them
    if(Math.hypot(c.x - me.x, c.y - me.y) > RALLY_RANGE){
      addPopup(c.x, c.y - c.r - 12, 'TOO FAR', '#e0a33e');
      return;
    }
    me.ap--;
    me.facing = Math.atan2(c.y - me.y, c.x - me.x);
    const relief = 25 + me.stats.bravery * 2;
    c.stress = Math.max(0, c.stress - relief);
    addPopup(c.x, c.y - c.r - 12, 'RALLIED', '#6fd6ff');
    spawnBurst(c.x, c.y, 8, '#6fd6ff', 120);
    updateMorale(c);
    updateHud();
    clearRallyMode();
    return;
  }
}

// ---------- overwatch: the interrupt snap shot ----------
// Bank an AP to watch a direction. When a hostile crosses the wedge during
// their turn, time freezes and the player takes the shot by hand, a snap
// shot, breathing faster than normal. The moment offered, the charge is spent.
const WATCH_HALF = 40 * DEG;

function watchRange(c){
  const w = wpnFor(c);
  return Math.min(charVisionRange(c), w.speed * w.life);
}

function commitWatch(angle){
  const c = pc();
  if(c.ap <= 0 || c.morale === 'broken' || c.morale === 'panicked') return;
  if((wpnFor(c).apCost || 1) > 1){
    addPopup(c.x, c.y - c.r - 14, 'TOO HEAVY FOR WATCH', '#e0a33e');
    return;
  }
  if(wpnFor(c).melee){
    addPopup(c.x, c.y - c.r - 14, 'A BLADE KEEPS NO WATCH', '#e0a33e');
    return;
  }
  c.facing = angle;
  const banked = c.ap;                      // every remaining point becomes a snap shot
  c.watch = {facing: angle, charges: (c.watch ? c.watch.charges : 0) + banked};
  c.ap = 0;
  addPopup(c.x, c.y - c.r - 12, 'WATCHING ×' + c.watch.charges, '#d4a843');
  clearRallyMode();
  updateHud();
}

function inWatchWedge(c, e){
  const d = Math.hypot(e.x-c.x, e.y-c.y);
  if(d > watchRange(c)) return false;
  const bearing = Math.atan2(e.y-c.y, e.x-c.x);
  if(Math.abs(angleDiff(bearing, c.watch.facing)) > WATCH_HALF) return false;
  return canShootFrom(c.x, c.y, c.r, e.x, e.y);
}

// scan for triggers while enemies are moving; freeze the world when one lands
function checkOverwatch(){
  const s = state;
  if(s.ow || s.phase !== 'enemy' || s.over) return;
  for(const c of s.squad){
    if(!c.alive || !c.watch || c.watch.charges <= 0) continue;
    if(c.morale === 'broken' || c.morale === 'panicked') continue;
    for(const e of s.enemies){
      if(!e.alive || !e.moving) continue;
      if(!inWatchWedge(c, e)) continue;
      // the moment: spend the charge, freeze, hand the player the shot
      c.watch.charges--;
      if(c.watch.charges <= 0) c.watch = null;
      s.ow = {char: c, enemy: e, timer: TUNE.snapTime};
      s.sel = s.squad.indexOf(c);
      s.mode = 'shoot';
      c.facing = Math.atan2(e.y-c.y, e.x-c.x);
      showBanner('SNAP SHOT', '#d4a843');
      syncWeaponButtons();
      updateHud();
      return;
    }
  }
}

// panicked squad members resolve before the player gets control
function processPanicQueue(realDt){
  const s = state;
  const q = s.pq;
  if(!q) return;
  const c = q.list[q.k];
  switch(q.stage){
    case 'start': {
      q.timer -= realDt;
      if(q.timer > 0) return;
      if(!c || !c.alive || c.morale !== 'panicked'){ q.stage = 'next'; return; }
      addPopup(c.x, c.y - c.r - 14, 'PANICKED!', '#e0483e');
      const budget = maxMoveDist(c);
      const g = buildMoveGraph(c);
      const t = clampTargetPoint(fleePoint(c, budget).x, fleePoint(c, budget).y, g.rects, c.r);
      const path = findPath({x:c.x, y:c.y}, t, g);
      if(path){
        const cut = truncatePath(path, budget);
        c.run = {path: cut, seg:0, traveled:0, dist: pathLen(cut),
                 topSpeed: Math.min(W,H)*0.55 * TUNE.runSpeedMul, stride:0, dustAt:0};
        c.moving = true;
        s.ramSet = new Set();
        q.stage = 'moving';
      }else{
        q.stage = 'fire'; q.timer = 0.3;
      }
      return;
    }
    case 'moving':
      if(c.moving) return;
      q.stage = 'fire'; q.timer = 0.35;
      return;
    case 'fire':
      q.timer -= realDt;
      if(q.timer > 0) return;
      if(c.alive) wildFire(c);
      c.ap = 0;
      q.stage = 'settle'; q.timer = 0.4;
      return;
    case 'settle':
      q.timer -= realDt;
      if(q.timer > 0 || s.bullets.some(b => b.team === 'wild')) return;
      q.stage = 'next';
      return;
    case 'next':
      q.k++;
      if(q.k >= q.list.length){ s.pq = null; updateHud(); }
      else { q.stage = 'start'; q.timer = 0.4; }
      return;
  }
}

// ---------- update ----------
let last = performance.now();
let partySig = '';
function partyPulse(){
  // repaint the plates the moment anything about the people changes
  const sig = state.squad.map(c =>
    [Math.round(c.hp), Math.round(c.armor || 0), Math.round(c.stress), c.morale, c.abilityCd | 0, c.ap, c.alive ? 1 : 0].join(',')
  ).join('|') + '#' + state.sel;
  if(sig !== partySig){
    partySig = sig;
    renderParty();
  }
}

// two bodies on one spot: move the second a clear step away from the first (deterministic, wall-aware)
function squadUnstack(c, from){
  const min = c.r + from.r + 2;
  let dx = c.x - from.x, dy = c.y - from.y;
  let d = Math.hypot(dx, dy);
  if(d >= min) return false;
  if(d < 0.5){ const a = ((c.name || '').length * 1.7) % 6.283; dx = Math.cos(a); dy = Math.sin(a); d = 1; }
  c.x = from.x + dx / d * min; c.y = from.y + dy / d * min;
  c.x = Math.max(c.r, Math.min(W - c.r, c.x)); c.y = Math.max(c.r, Math.min(H - c.r, c.y));
  unstickFromWalls(c);
  return true;
}
function deckSeparate(){
  const sq = state.squad;
  for(let i = 0; i < sq.length; i++){
    for(let j = i + 1; j < sq.length; j++){
      const a = sq[i], b = sq[j];
      if(!a.alive || !b.alive) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy), min = a.r + b.r + 2;
      if(d <= 0.01){
        const ja = (i * 2.4 + j) % 6.283;     // deterministic: the same pair always parts the same way
        a.x -= Math.cos(ja) * min / 2; a.y -= Math.sin(ja) * min / 2;
        b.x += Math.cos(ja) * min / 2; b.y += Math.sin(ja) * min / 2;
        continue;
      }
      if(d < min){
        const push = (min - d) / 2;
        const ux = dx / d, uy = dy / d;
        // the one standing still gives way to the one walking
        const am = a.moving ? 0.25 : 1, bm = b.moving ? 0.25 : 1;
        if(d < min * 0.5 && !a.moving && !b.moving){ squadUnstack(b, a); continue; }   // stacked: step apart cleanly
        a.x -= ux * push * am; a.y -= uy * push * am;
        b.x += ux * push * bm; b.y += uy * push * bm;
        for(const u of [a, b]){
          for(const w of state.walls){
            if(circleRect(u.x, u.y, u.r, w)){
              u.x = Math.max(w.x - u.r, Math.min(w.x + w.w + u.r, u.x));
              u.y = u.y < w.y + w.h / 2 ? w.y - u.r : w.y + w.h + u.r;
            }
          }
        }
      }
    }
  }
}
function frame(now){
  let realDt = Math.min((now-last)/1000, 0.05);
  last = now;
  if(state && state.simPause && state.shipDeck && !state.deckCombat) realDt = 0;   // a popup holds the world
  if(state && state.shipDeck && state.squad) deckSeparate();
  if(state && state.flight) flightTick(realDt);
  if(state && state.squad && !editorOn) partyPulse();
  if(state && state.squad && !editorOn){
    if(!state._propT) state._propT = performance.now();
    const pdt = Math.min(0.05, (performance.now() - state._propT) / 1000);
    state._propT = performance.now();
    tickProps(pdt);
    updateIxBtn();
  }
  if(editorOn){
    drawEditor();
    requestAnimationFrame(frame);
    return;
  }
  if(sysOpen){                 // a lesson is on screen: the world holds its breath
    draw();
    requestAnimationFrame(frame);
    return;
  }
  const s = state;

  // slow-mo: a bullet closing on a target it can finish
  let targetScale = 1;
  for(const b of s.bullets){
    if(b.team === 'player'){
      for(const e of s.enemies){
        if(!e.alive) continue;
        const dx = e.x - b.x, dy = e.y - b.y;
        if(Math.hypot(dx,dy) < 130 && (dx*b.vx + dy*b.vy) > 0 && impactDamage(b) >= e.hp){
          targetScale = 0.18; break;
        }
      }
    }else{
      for(const c of s.squad){
        if(!c.alive) continue;
        const dx = c.x - b.x, dy = c.y - b.y;
        if(Math.hypot(dx,dy) < 130 && (dx*b.vx + dy*b.vy) > 0 && impactDamage(b) >= c.hp){
          targetScale = 0.18; break;
        }
      }
    }
    if(targetScale < 1) break;
  }
  if(s.slowmoHold > 0){ targetScale = Math.min(targetScale, 0.15); s.slowmoHold -= realDt; }
  s.timeScale += (targetScale - s.timeScale) * Math.min(realDt*14, 1);
  const dt = realDt * s.timeScale;

  // aiming
  if(s.aiming && pointer.down){
    if(s.mode === 'move'){
      s.movePreview = computeMovePreview(pointer.x, pointer.y);
      // look down the first leg of the intended path
      if(s.movePreview && s.movePreview.valid && s.movePreview.cutPath.length > 1){
        const a0 = s.movePreview.cutPath[0], a1 = s.movePreview.cutPath[1];
        pc().facing = Math.atan2(a1.y - a0.y, a1.x - a0.x);
      }
    }else{
      const dx = pc().x - pointer.x;
      const dy = pc().y - pointer.y;
      const len = Math.hypot(dx, dy);
      const cl = Math.min(len, MAX_DRAG);
      s.power = cl / MAX_DRAG;
      s.aimVec = {x: dx, y: dy};
      // face where you're aiming, not where you'll snap to
      if(s.power >= MIN_POWER) pc().facing = Math.atan2(dy, dx);
      const shakeMul = (pc().morale === 'shaken' ? 1.5 : 1) * (s.ow ? TUNE.snapBreathe : 1);
      s.coneT += realDt * (TUNE.breatheBase + s.power * TUNE.breathePower) * shakeMul;
    }
  }

  // burst sequencing
  if(s.burst){
    s.burst.timer -= realDt;
    if(s.burst.timer <= 0 && s.burst.left > 0){
      const w = wpn();
      const sc = s.burst.shooter;
      if(!s.burst.ex) s.burst.ex = shooterExemptions(sc.x, sc.y, sc.r);
      const bloomed = s.burst.cone + s.burst.fired * w.bloom;
      const a = s.burst.baseA + (Math.random()*2 - 1) * bloomed;
      s.bullets.push({
        x: sc.x, y: sc.y,
        vx: Math.cos(a)*s.burst.speed, vy: Math.sin(a)*s.burst.speed,
        r: w.r, dmg: w.dmg, maxSpeed: w.speed, team: 'player', owner: sc, pen: w.pen || 1, sed: w.sed || 0, noise: w.noise || 0,
        tracked: (state.aar && state.aar.rounds++, true),
        maxBounces: w.bounces, ex: s.burst.ex,
        bounces: 0, life: w.life, trail: []
      });
      spawnBurst(sc.x, sc.y, 4, '#d4a843', s.burst.speed*0.12);
      s.shake = Math.max(s.shake, 3.5);
      s.burst.fired++; s.burst.left--; s.burst.timer = w.burstGap;
    }
    if(s.burst.left <= 0) s.burst = null;
  }

  // runs, squad members and any enemy currently executing a move
  for(const c of s.squad){
    if(c.alive && c.run) followRun(c, dt, true);
  }
  for(const e of s.enemies){
    if(e.alive && e.run && !s.ow) followRun(e, dt, false);
  }

  // bullets
  for(let bi = s.bullets.length-1; bi >= 0; bi--){
    const b = s.bullets[bi];
    b.life -= dt;
    if(b.life <= 0){
      if(b.scream) screamDetonate(b);
      spawnBurst(b.x, b.y, 6, b.team==='enemy' ? '#e0483e' : '#6fd6ff', 140);
      s.bullets.splice(bi,1);
      continue;
    }
    b.trail.push({x:b.x, y:b.y});
    if(b.trail.length > 20) b.trail.shift();

    const steps = Math.ceil(Math.hypot(b.vx, b.vy)*dt / 6) || 1;
    const sdt = dt/steps;
    let dead = false;
    for(let i=0;i<steps && !dead;i++){
      b.x += b.vx*sdt; b.y += b.vy*sdt;
      grazeCheck(b);

      if(b.x < b.r){ b.x = b.r; b.vx *= -1; dead = bounce(b); }
      if(!dead && b.x > W-b.r){ b.x = W-b.r; b.vx *= -1; dead = bounce(b); }
      if(!dead && b.y < b.r){ b.y = b.r; b.vy *= -1; dead = bounce(b); }
      if(!dead && b.y > H-b.r){ b.y = H-b.r; b.vy *= -1; dead = bounce(b); }

      if(!dead) for(const w of state.walls){
        if(!circleRect(b.x, b.y, b.r, w)) continue;
        if(!wallBlocksShot(b.ex, w, b.x, b.y)) continue;

        if(!w.high){
          if(state.invoice && b.team === 'player') state.invoice.wallHits++;
          // find the chunk actually struck (nearest live chunk under the round)
          let struck = null, sd = Infinity;
          for(const c of chunksOf(w)){
            if(c.hp <= 0 || !circleRect(b.x, b.y, b.r, c)) continue;
            const d2 = Math.hypot(b.x - (c.x+c.w/2), b.y - (c.y+c.h/2));
            if(d2 < sd){ sd = d2; struck = c; }
          }
          if(!struck) continue;   // the round is passing through an eroded gap

          // rounds hammering the cover you're hugging: pinned (any shooter but you)
          {
            for(const c of [...state.squad, ...state.enemies]){
              if(!c.alive || c.ko || c === b.owner) continue;
              if(Math.hypot(c.x-b.x, c.y-b.y) > 80) continue;
              if(!adjacentLowWalls(c).includes(w)) continue;
              if(b.grazed && b.grazed.has(c)) continue;
              (b.grazed || (b.grazed = new Set())).add(c);
              const pAmt = pinStressOf(b, c.braced);
              addStress(c, pAmt);
              stressPop(c, pAmt);
              const now = performance.now();
              if(!c.pinPopAt || now - c.pinPopAt > 1400){
                c.pinPopAt = now;
                if(c.stats || c.visible) addPopup(c.x, c.y - c.r - 12, 'PINNED', '#e0a33e');
                if(c.stats) explainState('pinned');
              }
            }
          }

          const impact = impactDamage(b);
          const coverDmg = impact * (b.pen || 1);
          const broke = damageChunk(struck, coverDmg, b.x, b.y, b.team === 'player');
          if(broke && coverDmg >= struck.maxHp - 0.01){
            // punched clean through: the round continues, diminished
            b.vx *= TUNE.penKeep;
            b.vy *= TUNE.penKeep;
            continue;
          }
          dead = true;
          break;
        }

        // high walls: solid, ricochet or die as before
        const cx = w.x+w.w/2, cy = w.y+w.h/2;
        const px = (b.x-cx)/(w.w/2+b.r), py = (b.y-cy)/(w.h/2+b.r);
        if(Math.abs(px) > Math.abs(py)){
          b.vx = Math.abs(b.vx)*Math.sign(px);
          b.x = px>0 ? w.x+w.w+b.r : w.x-b.r;
        }else{
          b.vy = Math.abs(b.vy)*Math.sign(py);
          b.y = py>0 ? w.y+w.h+b.r : w.y-b.r;
        }
        dead = bounce(b);
        break;
      }

      if(!dead){
        // a projectile is a projectile: it hits anyone but its shooter
        for(const c of s.squad){
          if(!c.alive || c.ko || c.downed || c === b.owner) continue;   // the fallen lie below the fire
          if(Math.hypot(c.x-b.x, c.y-b.y) < c.r + b.r){
            hitChar(c, b); dead = true; break;
          }
        }
        if(!dead && s.civs) for(const cv of s.civs){
          if(!cv.alive || cv.ko) continue;
          if(Math.hypot(cv.x - b.x, cv.y - b.y) < cv.r + b.r){
            civStruck(cv, b.dmg, b.team, b.owner, b.sed, b);
            dead = true; break;
          }
        }
        if(!dead) for(const e of s.enemies){
          if(!e.alive || e.ko || e === b.owner) continue;   // out cold means out of the fight
          if(b.pierced && b.pierced.has(e)) continue;       // already passed through this one
          if(Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r){
            hitEnemy(e, b);
            (b.pierced || (b.pierced = new Set())).add(e);
            b.bodyPen = (b.bodyPen !== undefined ? b.bodyPen : 1) - 1;
            // a body still standing stops the round: only the dead are passed through
            if(b.bodyPen <= 0 || (e.alive && !e.ko)){ dead = true; }
            break;
          }
        }
      }
    }
    if(dead){
      if(b.scream) screamDetonate(b);
      s.bullets.splice(bi,1);
    }
  }

  // enemy turn engine (frozen while a snap shot is live)
  if(s.phase === 'enemy' && !s.over && !s.ow){
    processEnemyTurn(realDt);
  }
  if(s.phase === 'enemy' && !s.over){
    checkOverwatch();
  }
  // the snap window closes whether or not the shot was taken
  if(s.ow){
    s.ow.timer -= realDt;
    if(s.ow.timer <= 0 || !s.ow.enemy.alive || !s.ow.char.alive){
      s.ow = null;
      state.aiming = false;
      document.body.classList.remove('aiming');
    }
  }
  // panicked squad members act before the player regains control
  if(s.phase === 'player' && s.pq && !s.over){
    processPanicQueue(realDt);
  }

  // player phase end check: every living character has spent their actions
  if(s.phase === 'player' && !s.over &&
     aliveChars().every(c => c.ap <= 0) &&
     !s.bullets.length && !s.burst && !s.squad.some(c => c.moving)){
    startEnemyTurn();
  }

  // particles
  for(let i=s.particles.length-1;i>=0;i--){
    const pt = s.particles[i];
    pt.t += dt;
    if(pt.t > pt.life){ s.particles.splice(i,1); continue; }
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    pt.vx *= (1 - 3*dt); pt.vy *= (1 - 3*dt);
  }

  // popups & flashes in real time
  for(let i=s.popups.length-1;i>=0;i--){
    const pp = s.popups[i];
    pp.t += realDt;
    pp.x += realDt * (pp.vx || 0);
    pp.y += realDt * (pp.vy === undefined ? -34 : pp.vy);
    if(pp.t > pp.life) s.popups.splice(i,1);
  }
  if(s.barks){
    for(let i = s.barks.length - 1; i >= 0; i--){
      const bk = s.barks[i];
      bk.t += realDt;
      if(bk.t > bk.life || !bk.c.alive) s.barks.splice(i, 1);
    }
  }
  if(!s.range && s.phase === 'player' && !s.over){
    const allDry = s.squad.every(c => !c.alive || c.ap <= 0) && !s.ow;
    document.getElementById('endturnbtn').classList.toggle('urge', allDry);
  }
  if(s.range){
    for(const c of s.squad) if(c.alive){ c.ap = 2; c.exposed = false; }
    if(s.rangePhase === 'complete' && performance.now() - (s.rangePhaseAt || 0) > 2400){
      exitRange();
    }
    if(s.rangePhase === 'play' && s.rangeExtract){
      const h0 = s.squad[0];
      if(h0.alive && Math.hypot(h0.x - s.rangeExtract.x, h0.y - s.rangeExtract.y) < s.rangeExtract.r){
        rangePhaseSet('complete');
        document.getElementById('rangeskip').classList.remove('show');
      }
    }
    if(s.rangePhase === 'aim' && s.aiming) rangePhaseSet('cone');
    else if(s.rangePhase === 'cone' && !s.aiming && s.aar && s.aar.shots > 0) rangePhaseSet('again');
    else if(s.rangePhase === 'move' && s.rangeMoveFrom){
      const h = s.squad[0];
      if(!h.moving && Math.hypot(h.x - s.rangeMoveFrom.x, h.y - s.rangeMoveFrom.y) > 70){
        rangePhaseSet('play');
        spawnRangeTargets(3);
        state.rangeExtract = {x: W * 0.14, y: H * 0.18, r: 72};
      }
    }
  }
  // a Valkyrie that reaches the service gate is gone, and so is the contract
  {
    const hx = currentLevel().hostileExtract;
    if(hx && !s.over && !s.range){
      const gx = hx.x * W, gy = hx.y * H, gr = hx.r * W;
      for(const e of s.enemies){
        if(!e.alive || e.ko || e.type !== 'valkyrie' || e.alert !== 'alerted') continue;
        if(Math.hypot(e.x - gx, e.y - gy) < gr){
          e.alive = false; e.escaped = true;
          addPopup(gx, gy - gr - 12, 'UNIT ESCAPED', '#e0483e');
          spawnBurst(gx, gy, 10, '#cfe1f2', 180);
          fail();
        }
      }
    }
  }
  // the crowd keeps turn time in a fight; on a deck or a won field it keeps its own
  {
    const deckLive = (s.shipDeck && !s.deckCombat) || freeRoam();
    if(s.civs && s.civs.length && !s.over && (s.phase === 'enemy' || deckLive)){
      if(deckLive) crowdTick(realDt);
      for(const cv of s.civs){
        if(!cv.alive || cv.ko) continue;
        if(cv.panic <= 0 && cv.errand && errandTick(cv, realDt)) continue;
        if(cv.kind === 'constable' && s.deckCombat && !s.portFight && cv.panic <= 0 &&
           !(cv.pursue || cv.respond || cv.chase || cv.escort || cv.sweep || cv.hunt)){
          beatTick(cv, realDt);   // irons in the open are not yet the law's problem
          continue;
        }
        if(cv.name && deckLive && !(cv.panic > 0)) continue;   // the cast keeps its own beat
      if(cv.panic > 0) cv.panic -= realDt;
      const spd = (cv.panic > 0 ? cv.pace * 5.2 : cv.pace * 2.4);
      const dx = cv.tx - cv.x, dy = cv.ty - cv.y;
      const d = Math.hypot(dx, dy);
      if(d > 3){
        const step = Math.min(d, spd * realDt);
        const nx = cv.x + dx / d * step, ny = cv.y + dy / d * step;
        if(!state.walls.some(w => circleRect(nx, ny, cv.r, w))){ cv.x = nx; cv.y = ny; }
        else cv.tx = cv.x, cv.ty = cv.y;   // bumped a stall: stop, pick fresh next tick
      }else if(cv.panic <= 0 && Math.random() < realDt * 0.35){
        // a new errand: a short stroll that doesn't cross the furniture
        for(let tr = 0; tr < 6; tr++){
          const a = Math.random() * Math.PI * 2;
          const rr = cv.home ? 24 + Math.random() * cv.homeR : 40 + Math.random() * 80;
          const ax = cv.home ? cv.home.x : cv.x, ay = cv.home ? cv.home.y : cv.y;
          const nx = Math.max(20, Math.min(W - 20, ax + Math.cos(a) * rr));
          const ny = Math.max(H * 0.12, Math.min(H * 0.86, ay + Math.sin(a) * rr));
          if(!inShipZone(nx, ny) && !state.walls.some(w => circleRect(nx, ny, cv.r + 4, w))){ cv.tx = nx; cv.ty = ny; break; }
        }
      }
      cv.x = Math.max(cv.r, Math.min(W - cv.r, cv.x));
      cv.y = Math.max(cv.r, Math.min(H - cv.r, cv.y));
      }
    }
  }
  if(s.barkQueue){
    for(let i = s.barkQueue.length - 1; i >= 0; i--){
      const q = s.barkQueue[i];
      q.at -= realDt;
      if(q.at <= 0){ sayLine(q.c, q.txt); s.barkQueue.splice(i, 1); }
    }
  }
  for(const e of s.enemies) e.hitFlash = Math.max(0, e.hitFlash - realDt*4);
  for(const c of s.squad) c.hitFlash = Math.max(0, c.hitFlash - realDt*4);

  // fog: who can see whom, and who is being noticed
  if(!s.over){
    updateVisibility();
    if(TUNE.fog && !briefOpen) updateDetection(realDt);
  }

  s.shake = Math.max(0, s.shake - realDt*30);
  s.flash = Math.max(0, s.flash - realDt*2.5);

  realDtDraw = realDt;
  // the package: walked over, carried, dropped by the fallen, delivered
  if(s.pkg && !s.pkg.delivered && !s.over){
    if(!s.pkgFound && s.pkgSites){
      const seesPoint = (x, y) => {
        for(const c of aliveChars()){
          if(c.ko) continue;
          if(Math.hypot(c.x - x, c.y - y) <= charVisionRange(c) && losHigh(c.x, c.y, x, y)) return true;
        }
        for(const sc of s.scans){
          if(Math.hypot(sc.x - x, sc.y - y) <= sc.r && losHigh(sc.x, sc.y, x, y)) return true;
        }
        return false;
      };
      // every sighted site resolves: the truth is found, the rumours are cleared
      for(const site of s.pkgSites){
        if(site.cleared) continue;
        if(!seesPoint(site.x, site.y)) continue;
        if(Math.hypot(site.x - s.pkg.x, site.y - s.pkg.y) < 2){
          s.pkgFound = true;
          addPopup(s.pkg.x, s.pkg.y - 20, 'CACHE LOCATED', '#d4a843');
          showBanner('CACHE LOCATED', '#d4a843');
          spawnBurst(s.pkg.x, s.pkg.y, 10, '#d4a843', 160);
        }else{
          site.cleared = true;
          addPopup(site.x, site.y - 16, 'SITE CLEAR', '#8c8c96');
        }
      }
    }
    if(!s.pkg.carried){
      if(s.pkgFound) for(const c of aliveChars()){
        if(c.ko) continue;
        if(Math.hypot(c.x - s.pkg.x, c.y - s.pkg.y) < c.r + 12){
          s.pkg.carried = c;
          addPopup(c.x, c.y - c.r - 14, 'PACKAGE SECURED', '#d4a843');
          showBanner('DELIVER TO EXTRACTION', '#6fd6ff');
          colonyAlarm(c.x, c.y);
          spawnBurst(s.pkg.x, s.pkg.y, 10, '#d4a843', 160);
          break;
        }
      }
    }else{
      const carrier = s.pkg.carried;
      if(!carrier.alive || carrier.ko){
        s.pkg.carried = null;             // it falls where they fell
        s.pkg.x = carrier.x; s.pkg.y = carrier.y;
        addPopup(carrier.x, carrier.y - 16, 'PACKAGE DROPPED', '#e0a33e');
        showBanner('PACKAGE DROPPED', '#e0a33e');
      }else if(s.extract &&
               Math.hypot(carrier.x - s.extract.x, carrier.y - s.extract.y) < s.extract.r){
        s.pkg.delivered = true;
        addPopup(carrier.x, carrier.y - carrier.r - 14, 'DELIVERED', '#6fd6ff');
        winOffer();
      }
    }
  }

  if(moveHintT > 0){
    moveHintT -= realDt;
    if(moveHintT <= 0) hint.style.opacity = 0;
  }
  flushStressPops();
  renderObjectives();

  const rosterEl = document.getElementById('roster');
  const menuOpen = rosterEl && rosterEl.classList && rosterEl.classList.contains &&
                   !rosterEl.classList.contains('hidden');
  if(!menuOpen) draw();
  requestAnimationFrame(frame);
}

function restart(){
  const s = state;
  if(s.range){ s.range = false;
    document.getElementById('rangeskip').classList.remove('show');
    document.getElementById('leftbar').classList.remove('hidden');
    document.getElementById('rightbar').classList.remove('hidden');
    if(rangePrev){ usingCustom = rangePrev.usingCustom; customLevel = rangePrev.customLevel;
      rosterSelection = rangePrev.rosterSelection; rangePrev = null; } }
  if(advanceOnRestart){ levelIdx++; advanceOnRestart = false; }
  if(!usingCustom && levelIdx >= LEVELS.length) levelIdx = LEVELS.length - 1;
  s.over = false; s.bullets = []; s.burst = null;
  s.invoice = {noise: 0, civPanics: 0, cruelty: 0, wallHits: 0};
  s.shipDeck = false; s.stations = null;   // decks re-flag themselves after; missions never do
  // the level declares its world; the reference field is only the default
  const wd = currentLevel().world;
  W = (wd && wd.w) || LW;
  H = (wd && wd.h) || LH;
  resize();
  if(typeof camReset === 'function') camReset();
  s.particles = []; s.popups = []; s.barks = []; s.timeScale = 1; s.slowmoHold = 0;
  s.phase = 'player'; s.turn = 1; s.et = null; s.pq = null; s.ow = null;
  document.getElementById('overlay').style.display = 'none';
  layout();
  syncWeaponButtons();
  updateHud();
  if(!state.range) showBrief();
}
function afterActionReturn(){
  enterShipDeck();                           // home is the deck in orbit over the dock
  if(portReturn && portReturn === ship.at){
    enterPort();                             // …or the pad you launched from
    if(portReturnPos){                       // everyone back where they stood: mid-word, mid-errand
      const onDeck3 = (x, y) => deckMask && deckMask.int.some(r2 =>
        x >= r2.x && x <= r2.x + r2.w && y >= r2.y && y <= r2.y + r2.h);
      for(const c of state.squad){
        const h = portReturnPos[c.name];
        if(h && c.alive && onDeck3(h.x * W, h.y * H)){ c.x = h.x * W; c.y = h.y * H; }
      }
    }
  }
  portReturn = null;
  portReturnPos = null;
}
document.getElementById('again').addEventListener('click', () => {
  if(state.range){ restart(); return; }     // the range keeps its own loop
  document.getElementById('overlay').style.display = 'none';
  afterActionReturn();
});

// morale glyphs above heads: ! shaken, v broken, !! panicked (pulsing)
function drawMoraleGlyph(u, x, y){
  if(!u.morale || u.morale === 'steady') return;
  ctx.textAlign = 'center';
  ctx.font = "800 13px 'Space Grotesk',sans-serif";
  const yy = y - u.r - 10;
  if(u.morale === 'shaken'){
    ctx.fillStyle = '#e0a33e';
    ctx.fillText('!', x, yy);
  }else if(u.morale === 'broken'){
    ctx.fillStyle = 'rgba(232,224,204,.6)';
    ctx.fillText('▼', x, yy);
  }else{
    const blink = 0.55 + 0.45*Math.sin(performance.now()/120);
    ctx.fillStyle = `rgba(224,72,62,${blink})`;
    ctx.fillText('!!', x, yy);
  }
}

// walls: low = sandbag-style cover, high = solid structure with height
function drawWall(r, high, selColor){
  const crystalTheme = currentLevel().theme === 'arachne';
  if(high){
    // drop shadow + extruded top face to read as tall
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(r.x+4, r.y+6, r.w, r.h);
    ctx.fillStyle = crystalTheme ? '#8f93a4' : '#2b3558';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = crystalTheme ? '#b8bcc9' : '#3a4670';
    ctx.fillRect(r.x, r.y, r.w, Math.min(5, r.h*0.4));
    ctx.strokeStyle = selColor || 'rgba(232,224,204,.75)';
    ctx.lineWidth = selColor ? 2.5 : 2;
    ctx.strokeRect(r.x+0.5, r.y+0.5, r.w-1, r.h-1);
  }else{
    // low cover erodes chunk by chunk where fire lands on it
    const chunks = r.chunks;
    if(!chunks){
      ctx.fillStyle = 'rgba(31,41,71,.85)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }else{
      for(const c of chunks){
        if(c.hp <= 0) continue;
        const f = c.hp / c.maxHp;
        ctx.fillStyle = crystalTheme
          ? `rgba(139,74,224,${0.30 + 0.45*f})`
          : `rgba(31,41,71,${0.35 + 0.5*f})`;
        // battered chunks shrink slightly inward: a chewed, ragged edge
        const inset = (1 - f) * Math.min(c.w, c.h) * 0.22;
        ctx.fillRect(c.x + inset, c.y + inset, c.w - inset*2, c.h - inset*2);
        if(f < 0.55){
          ctx.strokeStyle = 'rgba(212,168,67,.2)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(c.x + inset, c.y + inset);
          ctx.lineTo(c.x + c.w - inset, c.y + c.h - inset);
          ctx.stroke();
        }
      }
    }
    // hatching clipped to the surviving material
    ctx.save();
    ctx.beginPath();
    if(chunks){
      for(const c of chunks){
        if(c.hp > 0) ctx.rect(c.x, c.y, c.w, c.h);
      }
    }else{
      ctx.rect(r.x, r.y, r.w, r.h);
    }
    ctx.clip();
    ctx.strokeStyle = 'rgba(212,168,67,.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i = -r.h; i < r.w; i += 12){
      ctx.moveTo(r.x + i, r.y + r.h);
      ctx.lineTo(r.x + i + r.h, r.y);
    }
    ctx.stroke();
    ctx.restore();
    // the dashed outline fades as the wall is destroyed
    const frac = wallAliveFrac(r);
    if(frac > 0){
      ctx.strokeStyle = selColor || `rgba(212,168,67,${0.55 * Math.max(0.35, frac)})`;
      ctx.lineWidth = selColor ? 2.5 : 1.5;
      ctx.setLineDash([6,4]);
      ctx.strokeRect(r.x+0.5, r.y+0.5, r.w-1, r.h-1);
      ctx.setLineDash([]);
    }
  }
}

let realDtDraw = 0.016;
// ---------- draw ----------
function drawEnemyTurnFrame(){
  // the room belongs to them: red pressing hard from the edges
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.36, W/2, H/2, Math.max(W,H)*0.68);
  g.addColorStop(0, 'rgba(224,72,62,0)');
  g.addColorStop(0.7, 'rgba(224,72,62,0.12)');
  g.addColorStop(1, 'rgba(224,72,62,0.34)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // and a hard inner frame, so the edge itself burns
  ctx.strokeStyle = 'rgba(224,72,62,0.5)';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
  ctx.font = "800 26px 'Cinzel',serif";
  ctx.textAlign = 'center';
  const t = performance.now() / 1000;
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 2.4);
  ctx.fillStyle = 'rgba(224,72,62,.95)';
  ctx.fillText('ENEMY TURN', W/2, 44);
  ctx.globalAlpha = 1;
}
// the setup phase speaks: a title, and an instruction that breathes
function drawSetupPrompt(){

  ctx.fillStyle = '#e0483e';
  ctx.font = "800 20px 'Cinzel',serif";
  ctx.fillText('SET UP YOUR OPERATORS', W/2, 40);
  ctx.fillStyle = 'rgba(232,224,204,' + (0.55 + 0.4 * Math.sin(performance.now() / 280)) + ')';
