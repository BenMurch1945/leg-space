// ---------- fog rendering ----------
// explored memory accumulates; the fog canvas is rebuilt each frame:
// black, minus a dim punch for explored ground, minus a full punch for live sight
let fogCanvas = null, fogCtx = null, expCanvas = null, expCtx = null;
let coneCanvas = null, coneCtx = null;
function initFog(){
  fogCanvas = document.createElement('canvas');
  expCanvas = document.createElement('canvas');
  coneCanvas = document.createElement('canvas');
  // native resolution: logical field x view scale x DPR, so no compositing step ever upscales
  const os = Math.max(0.5, viewScale) * DPR;
  const PW = Math.max(1, Math.round(LW * os)), PH = Math.max(1, Math.round(LH * os));
  for(const cv of [fogCanvas, expCanvas, coneCanvas]){ cv.width = PW; cv.height = PH; }
  fogCtx = fogCanvas.getContext('2d');
  expCtx = expCanvas.getContext('2d');
  coneCtx = coneCanvas.getContext('2d');
  for(const cx of [fogCtx, expCtx, coneCtx]) cx.setTransform(os, 0, 0, os, 0, 0);
}

// all enemy vision cones painted opaque into one layer, composited once —
// overlapping cones merge into a single clean field instead of stacking
function drawEnemyCones(){
  if(!TUNE.fog || !coneCtx) return;
  coneCtx.clearRect(0, 0, W, H);
  let any = false;
  // calm steel, wary amber, hunting red, later passes win where they overlap
  const CONE_COLORS = {unaware: 'rgb(122,138,160)', suspicious: 'rgb(224,163,62)', alerted: 'rgb(224,72,62)'};

  // the hunters first, gate-free: a short red cone burning at the shoulder, gone by the tip
  for(const e of state.enemies){
    if(!e.alive || e.ko || !e.visible || e.alert !== 'alerted') continue;
    const shortR = enemyVisionRange(e) * 0.42;
    const hpts = conePolyAt(e, shortR);
    if(!hpts || hpts.length < 2) continue;
    const grad = ctx.createRadialGradient(e.x, e.y, e.r + 3, e.x, e.y, shortR);
    grad.addColorStop(0, 'rgba(224,72,62,.30)');
    grad.addColorStop(0.55, 'rgba(224,72,62,.14)');
    grad.addColorStop(1, 'rgba(224,72,62,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);   // the fan opens at the body: arc points close it
    for(const pt of hpts) ctx.lineTo(pt.x, pt.y);
    ctx.closePath();
    ctx.fill();
  }
  const conePolys = new Map();
  for(const pass of ['unaware', 'suspicious']){
    for(const e of state.enemies){
      if(!e.alive || e.ko || !e.visible || e.alert !== pass) continue;
      any = true;
      const pts = conePolyAt(e);
      conePolys.set(e, pts);
      coneCtx.fillStyle = CONE_COLORS[pass];
      coneCtx.beginPath();
      coneCtx.moveTo(e.x, e.y);
      for(const p of pts) coneCtx.lineTo(p.x, p.y);
      coneCtx.closePath();
      coneCtx.fill();
    }
  }
  if(!any) return;
  ctx.save();
  ctx.globalAlpha = 0.13;
  ctx.drawImage(coneCanvas, 0, 0, W, H);
  ctx.restore();
  // thin individual edges so each wedge stays readable inside the merged field
  ctx.lineWidth = 1;

  for(const e of state.enemies){
    if(!e.alive || e.ko || !e.visible) continue;
    const pts = conePolys.get(e);
    if(!pts) continue;
    if(!pts) continue;
    ctx.strokeStyle = e.alert === 'suspicious' ? 'rgba(224,163,62,.3)' : 'rgba(224,72,62,.25)';
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    for(const p of pts) ctx.lineTo(p.x, p.y);
    ctx.closePath();
    ctx.stroke();
  }
}

function visionPolyAt(px, py, R, peeks){
  const segsRects = highWalls();
  // ray angles: a regular full-circle sweep plus every wall corner
  const angles = [];
  for(let a = -Math.PI; a < Math.PI; a += 6*DEG) angles.push(a);
  for(const w of segsRects){
    const cs = [[w.x,w.y],[w.x+w.w,w.y],[w.x,w.y+w.h],[w.x+w.w,w.y+w.h]];
    for(const [cx, cy] of cs){
      const a = Math.atan2(cy-py, cx-px);
      angles.push(a - 0.001, a, a + 0.001);
    }
  }
  angles.sort((a, b) => a - b);
  const pts = [];
  for(const a of angles){
    pts.push(castSightRay(px, py, a, R, segsRects, peeks));
  }
  return pts;
}
function visionPoly(c){
  const exm = shooterExemptions(c.x, c.y, c.r);
  return visionPolyAt(c.x, c.y, charVisionRange(c), exm ? exm.peeks : null);
}

// an enemy's cone, occluded: rays stop at high walls so the drawn wedge
// matches what they can actually see
function conePolyAt(e, rOverride){
  const R = rOverride || enemyVisionRange(e);
  const f = e.facing;
  const half = visionArcHalf(e);
  const segsRects = highWalls();
  const angles = [f - half, f + half];
  for(let a = -half; a <= half; a += 5*DEG) angles.push(f + a);
  for(const w of segsRects){
    const cs = [[w.x,w.y],[w.x+w.w,w.y],[w.x,w.y+w.h],[w.x+w.w,w.y+w.h]];
    for(const [cx, cy] of cs){
      const a = Math.atan2(cy-e.y, cx-e.x);
      if(Math.abs(angleDiff(a, f)) <= half + 0.02){
        angles.push(a - 0.001, a, a + 0.001);
      }
    }
  }
  angles.sort((a, b) => angleDiff(a, f - VISION_HALF) - angleDiff(b, f - VISION_HALF));
  const pts = [];
  for(const a of angles){
    const off = angleDiff(a, f);
    if(off < -VISION_HALF - 0.01 || off > VISION_HALF + 0.01) continue;
    pts.push(castSightRay(e.x, e.y, a, R, segsRects, null));
  }
  return pts;
}

function castSightRay(ox, oy, ang, maxR, rects, peeks){
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let t = maxR;
  for(const r of rects){
    // slab intersection for entry/exit distances
    let t0 = 0, t1 = maxR;
    const p = [-dx, dx, -dy, dy];
    const q = [ox - r.x, r.x + r.w - ox, oy - r.y, r.y + r.h - oy];
    let hit = true;
    for(let i=0;i<4;i++){
      if(p[i] === 0){ if(q[i] < 0){ hit = false; break; } }
      else{
        const tt = q[i]/p[i];
        if(p[i] < 0){ if(tt > t1){ hit = false; break; } if(tt > t0) t0 = tt; }
        else{ if(tt < t0){ hit = false; break; } if(tt < t1) t1 = tt; }
      }
    }
    if(!hit || t0 <= 0.01 || t0 >= t) continue;
    // grazing a hugged corner? the ray slips past
    let grazes = false;
    if(peeks){
      const ex = ox + dx*t0, ey = oy + dy*t0;
      const xx = ox + dx*Math.min(t1, maxR), xy = oy + dy*Math.min(t1, maxR);
      for(const pk of peeks){
        if(pk.w !== r) continue;
        if(Math.hypot(ex-pk.cx, ey-pk.cy) < PEEK_R &&
           Math.hypot(xx-pk.cx, xy-pk.cy) < PEEK_R){ grazes = true; break; }
      }
    }
    if(!grazes) t = t0;
  }
  return {x: ox + dx*t, y: oy + dy*t};
}

function drawFog(){
  if(currentLevel().noFog) return;
  if(!TUNE.fog || !fogCtx) return;
  // stamp live sight into explored memory + build the punch list
  const polys = [];
  for(const c of state.squad){
    if(!c.alive || c.ko) continue;
    polys.push({c, pts: visionPoly(c)});
  }
  for(const sc of state.scans){
    polys.push({c: sc, pts: visionPolyAt(sc.x, sc.y, sc.r, null)});
  }
  expCtx.fillStyle = '#fff';
  for(const {c, pts} of polys){
    if(!pts.length) continue;
    expCtx.beginPath();
    expCtx.moveTo(pts[0].x, pts[0].y);
    for(const p of pts) expCtx.lineTo(p.x, p.y);
    expCtx.closePath();
    expCtx.fill();
  }
  // rebuild fog in two hue-distinct passes:
  //   pass 1, memory veil: translucent teal over everything you're not
  //            currently watching (live sight punched out)
  //   pass 2, the void: near-opaque violet-black over the unexplored,
  //            (explored + live punched out), laid on top of the veil
  const punchLive = () => {
    fogCtx.globalCompositeOperation = 'destination-out';
    fogCtx.globalAlpha = 1;
    fogCtx.fillStyle = '#fff';   // opaque: erase strength must be 100%, not the veil's alpha
    for(const {c, pts} of polys){
      if(!pts.length) continue;
      fogCtx.beginPath();
      fogCtx.moveTo(pts[0].x, pts[0].y);
      for(const p of pts) fogCtx.lineTo(p.x, p.y);
      fogCtx.closePath();
      fogCtx.fill();
    }
  };

  // pass 1: teal memory veil (blurred for a soft sight edge)
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.clearRect(0, 0, W, H);
  fogCtx.fillStyle = 'rgba(28,74,84,0.48)';
  fogCtx.fillRect(0, 0, W, H);
  punchLive();
  ctx.save();
  ctx.filter = 'blur(9px)';
  ctx.drawImage(fogCanvas, 0, 0, W, H);
  ctx.restore();

  // pass 2: violet-black void over the unexplored
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.clearRect(0, 0, W, H);
  fogCtx.fillStyle = 'rgba(10,5,22,0.97)';
  fogCtx.fillRect(0, 0, W, H);
  fogCtx.globalCompositeOperation = 'destination-out';
  fogCtx.globalAlpha = 1;
  fogCtx.drawImage(expCanvas, 0, 0, expCanvas.width, expCanvas.height, 0, 0, W, H);
  punchLive();
  fogCtx.globalCompositeOperation = 'source-atop';
  fogCtx.fillStyle = 'rgba(96,58,160,0.30)';
  fogCtx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.filter = 'blur(12px)';
  ctx.drawImage(fogCanvas, 0, 0, W, H);
  ctx.restore();
  // the gradient fade IS the boundary: no drawn line at the edge of sight
}

// ---------- combat ----------
// Cover rules, computed at the moment of firing:
// - standing next to a LOW wall lets your shots pass over that wall
// - standing at any wall's corner lets your shots pass the wall near that corner (peeking)
const PEEK_R = 31;         // how far around a peeked corner shots may pass
const ADJACENT_REACH = 12; // how close "standing next to" is, beyond body radius

function shooterExemptions(x, y, r){
  const adj = new Set();
  const peeks = [];
  const reach = r + ADJACENT_REACH;
  for(const w of state.walls){
    const nx = Math.max(w.x, Math.min(x, w.x+w.w));
    const ny = Math.max(w.y, Math.min(y, w.y+w.h));
    const d = Math.hypot(x-nx, y-ny);
    if(!w.high && d <= reach) adj.add(w);
    const cs = [[w.x,w.y],[w.x+w.w,w.y],[w.x,w.y+w.h],[w.x+w.w,w.y+w.h]];
    for(const [cx,cy] of cs){
      if(Math.hypot(x-cx, y-cy) <= reach + 6) peeks.push({w, cx, cy});
    }
  }
  return (adj.size || peeks.length) ? {adj, peeks} : null;
}

function wallBlocksShot(ex, w, hx, hy){
  if(!ex) return true;
  if(ex.adj.has(w)) return false;
  for(const pk of ex.peeks){
    if(pk.w === w && Math.hypot(hx-pk.cx, hy-pk.cy) < PEEK_R) return false;
  }
  return true;
}

function impactDamage(b){
  const spd = Math.hypot(b.vx, b.vy);
  return b.dmg * (spd / b.maxSpeed);
}

// being shot AT is stressful even when it misses: a round passing within a
// unit's suppression band adds stress once per bullet per unit
// near-miss stress made visible: violet numbers rising off rattled nerves.
// Aggregated per unit over a short window so bursts read as one number.
function stressPop(u, amt){
  if(!u.alive || isFearless(u)) return;
  if(!u.stats && !u.visible) return;
  const now = performance.now();
  u.sPopAcc = (u.sPopAcc || 0) + amt;
  if(!u.sPopAt || now - u.sPopAt > 650){
    u.sPopAt = now;
    addPopup(u.x + u.r + 4, u.y - 2, '+' + Math.round(u.sPopAcc), '#b06ae0', 42, -10);
    u.sPopAcc = 0;
  }
}

// the window closes on its own: banked near-miss stress always surfaces
function flushStressPops(){
  const now = performance.now();
  for(const u of [...state.squad, ...state.enemies]){
    if(!u.sPopAcc || u.sPopAcc <= 0) continue;
    if(!u.alive || (now - (u.sPopAt || 0)) <= 650) continue;
    if(u.stats || u.visible){
      addPopup(u.x + u.r + 4, u.y - 2, '+' + Math.round(u.sPopAcc), '#b06ae0', 42, -10);
    }
    u.sPopAcc = 0;
    u.sPopAt = now;
  }
}

// fear scales with the round: a rifle crack past the ear outranks a spent pellet
function grazeStressOf(b, braced){
  const v = 2 + impactDamage(b) * 0.5;
  return braced ? v * 0.5 : v;
}
function pinStressOf(b, braced){
  const v = 3 + impactDamage(b) * 0.75;
  return braced ? v * 0.5 : v;
}

function grazeCheck(b){
  const list = [...state.squad, ...state.enemies];
  for(const u of list){
    if(!u.alive || u === b.owner) continue;
    if(b.grazed && b.grazed.has(u)) continue;
    const d = Math.hypot(u.x-b.x, u.y-b.y);
    if(d < u.r + 18 && d > u.r + b.r){
      (b.grazed || (b.grazed = new Set())).add(u);
      const gAmt = grazeStressOf(b, u.braced);
      addStress(u, gAmt);
      stressPop(u, gAmt);
      if(u.stats && b.team !== 'player') bark(u, 'underFire');
      if(!u.stats && b.team === 'player' && b.owner && b.owner.stats) bark(b.owner, 'nearMiss');
      // a bullet past the ear moves awareness one step: once per trigger-pull
      if(!u.stats && !u.ko && b.team === 'player' && b.volleyId){
        if(!u.grazeVolleys) u.grazeVolleys = new Set();
        if(!u.grazeVolleys.has(b.volleyId)){
          u.grazeVolleys.add(b.volleyId);
          const src = (b.owner && b.owner.alive) ? b.owner : {x: b.x - b.vx * 0.25, y: b.y - b.vy * 0.25};
          if(u.alert === 'unaware') makeSuspicious(u, src.x, src.y);
          else if(u.alert === 'suspicious') alertEnemy(u, src.x, src.y, false);
        }
      }
    }
  }
}

function bounce(b){
  b.bounces++;
  b.vx *= TUNE.bounceKeep; b.vy *= TUNE.bounceKeep;
  spawnBurst(b.x, b.y, 4, '#6fd6ff', 150);
  state.shake = Math.max(state.shake, 2.5);
  if(b.bounces > b.maxBounces){
    spawnBurst(b.x, b.y, 8, '#6fd6ff', 190);
    return true;
  }
  return false;
}

function addPopup(x, y, txt, color, vx, vy){
  state.popups.push({x, y, txt, t:0, life:0.8, color,
    vx: vx === undefined ? 0 : vx,
    vy: vy === undefined ? -34 : vy});
}

function wpnCritMul(b){ return b.critMul || 2; }

function hitEnemy(e, b){
  const pierceMul = Math.max(0, 1 - (TUNE.bodyPenFalloff || 0) * (b.pierced ? b.pierced.size : 0));
  // critical: did the round's path pass through the very heart of the circle?
  const spd = Math.hypot(b.vx, b.vy) || 1;
  const crit = Math.abs((e.x - b.x) * (b.vy / spd) - (e.y - b.y) * (b.vx / spd)) <= (TUNE.critWindow || 2.5);
  if(b.sed){
    addSed(e, b.sed * Math.min(1, Math.hypot(b.vx,b.vy) / b.maxSpeed + 0.35), b.owner);
    addStress(e, 8);
    spawnBurst(b.x, b.y, 6, '#6fd6ff', 160);
    // being arced is very informative too
    alertEnemy(e, b.x - b.vx*0.1, b.y - b.vy*0.1, true,
      (b.owner && b.owner.stats) ? b.owner : null);
    return;
  }
  let dmg = impactDamage(b) * pierceMul;
  if(crit && !b.sed) dmg *= (wpnCritMul(b) || 2);
  // rear arc: where did the shot come from, relative to where they're looking?
  const bearing = Math.atan2(-b.vy, -b.vx);
  const rear = Math.abs(angleDiff(bearing, e.facing)) > 2.36;
  if(rear) dmg *= TUNE.rearMult;
  if(state.aar && b.team === 'player' && !b.aarHit){
    b.aarHit = true;
    state.aar.hits++; if(crit) state.aar.crits++;
  }
  if(crit && !b.sed && dmg > 0){
    if(b.owner && b.owner.stats) bark(b.owner, 'crit');
    addPopup(e.x, e.y - e.r - 22, 'CRITICAL', '#ffd76a');
    spawnBurst(e.x, e.y, 20, '#ffd76a', 340);
    state.shake = Math.max(state.shake, 6);
  }
  const splitE = applyDamage(e, dmg);
  e.hitFlash = 1;
  if(splitE.armor > 0) addPopup(e.x, e.y - e.r - 14, '-' + splitE.armor.toFixed(1) + ' ARMOR', '#9aa4b5');
  if(splitE.flesh > 0) addPopup(e.x, e.y - e.r - 6,
    (splitE.flesh >= 9.5 ? splitE.flesh.toFixed(1)+'!' : splitE.flesh.toFixed(1)) + (rear ? ' REAR' : ''),
    rear ? '#d4a843' : (splitE.flesh >= 9.5 ? '#d4a843' : '#e8e0cc'));
  if(e.hp <= 0){
    kill(e, b);
  }else{
    addStress(e, dmg*1.6 + (rear ? 6 : 0));
    // being shot is very informative, about the shooter, if the shooter is a person
    alertEnemy(e, b.x - b.vx*0.1, b.y - b.vy*0.1, true,
      (b.owner && b.owner.stats) ? b.owner : null);
    spawnBurst(b.x, b.y, 8, '#e0483e', 200);
    state.shake = Math.max(state.shake, 4);
  }
}

// armor absorbs first; the rest reaches the body. Sedation never asks.
function applyDamage(u, dmg){
  // armour is the first layer, whole: flesh takes nothing until the plate is spent
  const a = Math.min(u.armor || 0, dmg);
  if(a > 0) u.armor -= a;
  const flesh = dmg - a;
  u.hp -= flesh;
  return {armor: a, flesh};
}

function hitChar(c, b){
  if(b.sed){
    addSed(c, b.sed * Math.min(1, Math.hypot(b.vx,b.vy) / b.maxSpeed + 0.35));
    addStress(c, 8);
    spawnBurst(b.x, b.y, 6, '#6fd6ff', 160);
    return;
  }
  let dmg = impactDamage(b);
  const bearing = Math.atan2(-b.vy, -b.vx);
  const rear = Math.abs(angleDiff(bearing, c.facing)) > 2.36;
  if(rear) dmg *= TUNE.rearMult;
  if(c.bulwark) dmg *= 0.5;
  const split = applyDamage(c, dmg);
  c.hitFlash = 1;
  if(split.armor > 0) addPopup(c.x, c.y - c.r - 16, '-' + split.armor.toFixed(1) + ' ARMOR', '#9aa4b5');
  if(split.flesh > 0) addPopup(c.x, c.y - c.r - 8, split.flesh.toFixed(1) + (rear ? ' REAR' : ''), '#e0483e');
  spawnBurst(b.x, b.y, 10, '#e0483e', 220);
  state.shake = Math.max(state.shake, 7);
  if(c.hp <= 0) charDown(c);
  else { addStress(c, dmg*2 + (rear ? 6 : 0)); updateHud(); }
}

function squadWipe(){
  // nobody left standing: the downed bleed out where they lie
  for(const c of state.squad){
    if(c.alive && c.downed) charDie(c);
  }
  fail();
}
function standUp(rescuer, c){
  if(!c.downed || !c.alive) return false;
  if(rescuer.ap < 1 || rescuer.downed || rescuer.ko) return false;
  if(Math.hypot(rescuer.x - c.x, rescuer.y - c.y) > rescuer.r + c.r + ADJACENT_REACH) return false;
  rescuer.ap -= 1;
  if(c.cuffed){
    c.cuffed = false;
    addPopup(c.x, c.y - c.r - 18, 'TAKEN BACK FROM THE LAW', '#e0a33e');
  }
  c.downed = false;
  c.downTimer = 0;
  c.hp = Math.max(3, Math.round(c.maxHp * 0.25));
  c.ap = 0;   // stood up, not restored: this turn is spent surviving
  if(c.pendingInjury && c.def){
    const inj = INJURIES[c.pendingInjury];
    c.def.injuries = c.def.injuries || [];
    c.def.injuries.push(c.pendingInjury);
    addPopup(c.x, c.y - c.r - 28, inj.label.toUpperCase(), '#e0a33e');
    c.pendingInjury = null;
    shipSave();
  }
  squadUnstack(c, rescuer);
  addPopup(c.x, c.y - c.r - 14, 'BACK ON THEIR FEET', '#6fd6ff');
  bark(rescuer, 'rally', true);
  updateHud();
  return true;
}
function charDown(c){
  if(c.downed) return;                    // already on the floor
  for(const w of state.squad){
    if(w !== c && w.alive) bark(w, 'allyDown', true);
  }
  // knocked down, not dead: three turns for someone to reach them
  c.downed = true;
  c.downTimer = 3;
  c.hp = 0;
  c.ap = 0;
  c.stress = 0; c.morale = 'steady';
  c.moving = false; c.run = null;
  c.watch = null; c.braced = false;
  c.pendingInjury = (Math.random() < INJURY_CHANCE)
    ? Object.keys(INJURIES)[Math.floor(Math.random() * Object.keys(INJURIES).length)]
    : null;
  addPopup(c.x, c.y - c.r - 14, 'DOWN, 3 TURNS', '#e0483e');
  showBanner(c.name.toUpperCase() + ' DOWNED!', '#e0483e', true);
  downedAdvisory(c);
  updateHud();
  if(state.squad.every(w => !w.alive || w.downed)) squadWipe();
  return;
}
function charDie(c){
  const ci = state.squad.indexOf(c);
  c.alive = false;
  c.downed = false;
  c.moving = false; c.run = null;
  if(c.def){
    c.def.dead = true; ship.graves.push(c.name);
    chronicle('crew', c.name + ' fell' + (galaxyNode(ship.at) ? ' at ' + galaxyNode(ship.at).name : '') + '. The berth stands empty.');
  }
  addPopup(c.x, c.y - c.r - 14, 'GONE', '#e0483e');
  showBanner(c.name.toUpperCase() + ', GONE', '#e0483e');
  // whoever watched them drop stops hunting that spot; the rest keep their ghosts
  for(const e of state.enemies){
    if(!e.alive || e.ko || !e.mem || !e.mem[ci]) continue;
    if(inVisionOf(e, enemyVisionRange(e), c.x, c.y) && losHigh(e.x, e.y, c.x, c.y)){
      delete e.mem[ci];
    }
  }
  spawnBurst(c.x, c.y, 26, c.color, 420);
  state.flash = 0.5;
  for(const o of state.squad) if(o.alive && o !== c) addStress(o, 35);
  if(!aliveChars().length){ updateHud(); squadWipe(); return; }
  if(!pc().alive || pc().downed) state.sel = state.squad.findIndex(x => x.alive && !x.downed);
  syncWeaponButtons();
  updateHud();
}

function shoveAside(mover, e, dirX, dirY){
  // which side of the line are they on? push them further that way
  const rx = e.x - mover.x, ry = e.y - mover.y;
  const side = (rx * dirY - ry * dirX) >= 0 ? 1 : -1;   // note: screen-space cross
  let px = dirY * -side, py = dirX * side;              // perpendicular, away
  const need = mover.r + e.r + 3;
  let nx = mover.x + px * need, ny = mover.y + py * need;
  // don't shove into a high wall or off the field: flip sides if we must
  const hitsWall = (x, y) => {
    if(x < e.r || x > W - e.r || y < e.r || y > H - e.r) return true;
    for(const wl of state.walls){
      if(!wl.high) continue;
      if(x > wl.x - e.r && x < wl.x + wl.w + e.r && y > wl.y - e.r && y < wl.y + wl.h + e.r) return true;
    }
    return false;
  };
  if(hitsWall(nx, ny)){ nx = mover.x - px * need; ny = mover.y - py * need; }
  if(!hitsWall(nx, ny)){
    e.x = nx; e.y = ny;
    spawnBurst(e.x, e.y, 4, '#e8e0cc', 120);
  }
}

function ramEnemy(e, speedFrac, rammer, mult){
  const p = rammer || pc();
  const str = p.stats ? p.stats.strength/10 : 1;
  const dose = TUNE.ramDmg * str * Math.max(0.25, Math.min(1, speedFrac)) * (mult || 1);
  addSed(e, dose, p);
  addStress(e, 6);
  e.hitFlash = 1;
  addPopup(e.x, e.y - e.r - 6, 'RUSHED +' + dose.toFixed(1), '#6fd6ff');
  alertEnemy(e, p.x, p.y, false);
  noiseAt(p.x, p.y, NOISE_MELEE);
  spawnBurst((p.x+e.x)/2, (p.y+e.y)/2, 12, '#e8e0cc', 260);
  state.shake = Math.max(state.shake, 8);
  if(e.ko){
    // shoulder-checked into the dark: the pod feels it
    showBanner('RUSHED DOWN', '#6fd6ff');
    for(const o of state.enemies){
      if(o === e || !o.alive || o.ko) continue;
      if(Math.hypot(o.x-e.x, o.y-e.y) < 200 && losHigh(o.x, o.y, e.x, e.y)){
        addStress(o, 14);
        stressPop(o, 14);
      }
    }
    updateHud();
    checkWin();
  }
}

function stockAt(nodeId){

function districtPark(){

  const carry = (state.props || []).filter(p => p.holder && state.squad.some(c => c.name === p.holder));
  // who follows the crew through an arch: a fan at their shoulder, an officer who wants a word, a hunter on their scent
  const followers = (state.civs || []).filter(cv => cv.alive && !cv.ko && !cv.gone &&
    ((cv.kind === 'fan' && !cv.spooked) || (cv.kind === 'constable' && (cv.attend || cv.hunt))));
  const stay = (state.civs || []).filter(cv => !followers.includes(cv));

function districtWake(snap){
  const el = (performance.now() - snap.t) / 1000;
  let civs = snap.civs.filter(cv => !cv.gone);
  civs = civs.filter(cv => !cv.tide);                           // the tide is new people every minute anyway
  civs = civs.filter(cv => {
    if(cv.crook && cv.errand && cv.errand.kind === 'slink'){ cv.errand.loiterT = (cv.errand.loiterT || 0) - el; return cv.errand.loiterT > 0; }
    if(cv.crook) return false;                                  // a stalk with nobody to stalk is given up
    if(cv.kind === 'face' || cv.kind === 'fan') return false;   // a face that did not follow has drifted off
    return true;
  });
  let enemies = snap.enemies, props = snap.props;
  const cleaners = civs.filter(cv => cv.kind === 'cleaner');
  if(cleaners.length){
    const bodies = civs.filter(cv => !cv.alive).length + enemies.length;
    if(el > bodies * 3 + 15){                                   // the job is done and they have gone
      civs = civs.filter(cv => cv.alive || inShipZone(cv.x, cv.y)).filter(cv => cv.kind !== 'cleaner');
      enemies = enemies.filter(e => inShipZone(e.x, e.y));
      chronicle('event', 'The recovery crew finished on that floor while you were elsewhere. It is clear now.');
    }
  }
  for(const cv of civs){ cv._nav = null; cv._lc = null; }
  state.civs = civs.concat((state.civs || []).filter(cv => cv.tide));   // the fresh tide this build just seeded
  state.enemies = enemies.concat((state.enemies || []).filter(e => e.alive));
  state.props = props;
  if(snap.walls && snap.walls.length === state.walls.length) state.walls = snap.walls;   // the same plan: keep its damage

}

  if(state.arrivals && state.arrivals.length){
    const now = performance.now();
    const due = state.arrivals.filter(a => now >= a.at);
    if(due.length){

  }

// the backpack: four grid slots of pockets; only gear, mission items and trinkets fit
const PACKABLE = {trinket: true, gear: true, mission: true, weapon: true};
const ARCH_SIDEARM = {soldier: 'stdautogun', runner: 'stdknife', valkyrie: 'pistol', breaker: 'stdblade'};
const TRINKET_NAMES = ['Dented sigil ring', 'Vial of raw silk', 'Bureau scrip, unsigned',
  'Pocket icon, worn smooth', 'Cracked optic lens', 'Foil of stim tabs'];
// what the fallen carried: rolled once, the first time anyone kneels
function lootOf(e){
  if(e.loot) return e.loot;
  const out = [];
  // provenance: gear remembers its dead; only currency is anonymous
  const isCop = e.type === 'constable';
  const own = e.name ? ((isCop ? 'Constable ' : '') + e.name + (isCop ? ' \u00B7 Constabulary issue' : ''))
    : (isCop ? 'Constabulary issue' : null);
  const ownFac = isCop ? 'constabulary' : null;
  const stamp = (it) => { if(own) it.own = own; if(ownFac) it.ownFac = ownFac; return it; };
  if(e.stolen) out.push(e.stolen);   // what they snatched rides on the body
  if(e.wpnKey){ out.push(stamp({kind: 'weapon', key: e.wpnKey})); }
  else{
    const wkey = ARCH_SIDEARM[e.type];
    if(wkey && Math.random() < 0.4) out.push(stamp({kind: 'weapon', key: wkey}));
  }
  const piles = 1 + (Math.random() < 0.35 ? 1 : 0);
  for(let i = 0; i < piles; i++) out.push({kind: 'credits', value: 4 + Math.floor(Math.random() * 15)});
  if(Math.random() < 0.45) out.push(stamp({kind: 'trinket',
    label: TRINKET_NAMES[Math.floor(Math.random() * TRINKET_NAMES.length)],
    value: 8 + Math.floor(Math.random() * 19)}));
  e.loot = out;
  return out;
}
function lootSpent(e){ return !!(e.loot && e.loot.length === 0); }
// taking: credits go to the stash the moment they're touched
function lootStash(e, idx){
  const it = (e.loot || [])[idx];
  if(!it || it.kind !== 'credits') return false;
  ship.credits += it.value;
  e.loot.splice(idx, 1);
  if(lootSpent(e)) e.looted = true;
  if(typeof shipCreditsRefresh === 'function') shipCreditsRefresh();
  shipSave();
  return true;
}
// taking: a packable thing goes into a free pocket
function lootTake(c, e, idx){
  const it = (e.loot || [])[idx];
  if(!it || !PACKABLE[it.kind]) return false;
  if(!Array.isArray(c.def.pack)) c.def.pack = [];
  if(c.def.pack.length >= 4) return false;
  c.def.pack.push(it);
  e.loot.splice(idx, 1);
  if(lootSpent(e)) e.looted = true;
  shipSave();
  return true;
}
// taking: his iron for yours: the swap leaves your old piece on the body
function lootEquip(c, e, idx, slot){
  const it = (e.loot || [])[idx];
  if(!it || it.kind !== 'weapon') return false;
  if(!weaponAllowed(c.def, it.key) || !slotLegal(slot, it.key)) return false;
  const other = slot === 'primary' ? 'sidearm' : 'primary';
  if(it.key === c.def.loadout[other]) return false;
  const old = c.def.loadout[slot];
  const pvOld = provOf(c.def, slot);
  c.def.loadout[slot] = it.key;
  provSet(c.def, slot, it);
  e.loot.splice(idx, 1);
  if(old) e.loot.push(Object.assign({kind: 'weapon', key: old},
    pvOld ? {own: pvOld.own, ownFac: pvOld.ownFac} : {}));
  if(c.slot === slot) c.weapon = it.key;
  if(c.mag && WPN_CLIP[it.key])
    c.mag[slot] = Math.max(1, Math.floor(WPN_CLIP[it.key] * (0.4 + 0.5 * Math.random())));
  if(lootSpent(e)) e.looted = true;
  shipSave();
  return true;
}
// a pocketed thing can be left on the body too
function lootLeave(c, e, pi){
  const it = (c.def.pack || [])[pi];
  if(!it) return false;
  c.def.pack.splice(pi, 1);
  (e.loot = e.loot || []).push(it);
  e.looted = false;
  shipSave();
  return true;
}
function sellable(it){ return !it.kind || it.kind === 'trinket'; }
function packTotal(){
  let n = 0, v = 0;
  for(const d of SQUAD_DEFS){
    if(d.dead || !Array.isArray(d.pack)) continue;
    for(const it of d.pack){ if(sellable(it)){ n++; v += it.value || 0; } }
  }
  return {n, v};
}
function sellSalvage(){
  const t = packTotal();
  if(!t.n) return false;
  const vS = Math.round(t.v * sellHeatMul());
  ship.credits += vS;
  for(const d of SQUAD_DEFS) if(Array.isArray(d.pack)) d.pack = d.pack.filter(it => !sellable(it));
  chronicle('trade', 'Sold ' + t.n + ' piece' + (t.n === 1 ? '' : 's') + ' of field salvage for ' + vS + ' CR.');
  if(typeof shipCreditsRefresh === 'function') shipCreditsRefresh();
  return true;
}

// an unaligned witness weighs a real walk to the law: their own nerve,
// how near the law stands, and how the thief looks. No dice: a comparison.
function witnessNerve(cv, op, grade){
  const cops = (state.civs || []).filter(c2 => c2.kind === 'constable' && c2.alive && !c2.ko);
  let d = Infinity;
  for(const c2 of cops) d = Math.min(d, Math.hypot(c2.x - cv.x, c2.y - cv.y));
  for(const dr of (state.doors || [])) d = Math.min(d, Math.hypot(dr.x - cv.x, dr.y - cv.y) + 260);
  if(d === Infinity) return {tells: false, nerve: 0};   // truly nowhere to tell
  const lawNear = d < 300 ? 4 : d < 700 ? 2 : 0;
  const w = op && WEAPONS[op.weapon];
  const intim = Math.round(((op && op.stats && op.stats.strength) || 8) / 2 + ((w && w.noise) || 0) / 160);
  const nerve = (cv.brave || 10) + lawNear - intim;
  // petty complaints need conviction; a killing gets reported by anyone with any spine left
  return {tells: nerve >= (grade === 'minor' ? 4 : 0), nerve};
}
// one witness, one crime: the word goes where the witness answers.
// constable -> the law acts itself. faction -> the faction's books move.
// unaligned -> maybe the law, if their nerve carries the walk.
function crimeSeen(cv, op, crime){
  const fac = cv.fac || (bzCastOf(cv.name) || {}).fac || null;
  if(cv.kind === 'constable' || fac === 'constabulary') return 'law';
  if(fac){
    if(fac === crime.victim){ facRepAdd(fac, -1); return 'victim'; }
    if((crime.benefits || []).includes(fac)){ facRepAdd(fac, 1); return 'approves'; }
    facRepAdd(fac, -1); return 'disapproves';
  }
  return witnessNerve(cv, op).tells ? 'tells' : 'quiet';
}

function npcAttitude(cv){

    if(b.shop && b.shop.counted) return {word: 'WARY', tint: '#e0a33e'};

  if(cv.kind === 'friend') return {word: 'OLD FRIEND', tint: '#9fe08e'};
  if(cv.kind === 'fan') return {word: cv.spooked ? 'SPOOKED' : 'STARSTRUCK', tint: '#e0a33e'};
  if(cv.kind === 'cleaner') return {word: 'RECOVERY \u00B7 ' + (cv.bag || 0) + ' BAGGED', tint: '#b06ae0'};

    if(mood === 'bought') return {word: 'SHREWD', tint: '#e0a33e'};

  }
  if(cv.name === 'June'){
    if(b.juneRep >= 1) return {word: 'WARM', tint: '#9fe08e'};
    if(b.crateHolder === 'crew' && !b.boughtFromJune) return {word: 'SOUR', tint: '#e0a33e'};

  }

}

function bzWitnessCheck(px, py){
  const seers = [];
  for(const cv of (state.civs || [])){
    if(!cv.alive || cv.ko) continue;
    if(cv.name === 'June') continue;
    const d = Math.hypot(cv.x - px, cv.y - py);
    if(d > 340) continue;
    if(!segClearHigh(cv.x, cv.y, px, py)) continue;
    seers.push(cv);
  }
  return seers;
}
function bzPickup(c){
  const b = bz();
  const p = bzCrate();
  if(!b || !p || p.holder) return false;
  carryAttach(c, p);
  if(b.boughtFromJune){ bzSet({crateHolder: 'crew'}); return true; }   // lifting your own property is nobody's business
  const seers = bzWitnessCheck(c.x, c.y);
  const nf = {crateHolder: 'crew'};
  const rank = ['quiet', 'approves', 'disapproves', 'victim', 'tells', 'law'];
  let loud = null;   // the strongest thing any witness did, for the record
  for(const w2 of seers){
    w2.marked = true;   // one look, one decision, remembered
    const r2 = crimeSeen(w2, c, CRATE_CRIME);
    nf.witnessed = true;
    if(r2 === 'law'){ nf.copHunt = true; nf.varricKnows = true; nf.lawAware = true; nf.copT = 0; }
    else if(r2 === 'victim'){ nf.varricKnows = true; }
    else if(r2 === 'tells' && !nf.copHunt && !b.confronted){
      witnessRun(w2, {grade: 'minor', who: c.name, what: 'the theft of a sealed crate'});
    }
    addPopup(w2.x, w2.y - w2.r - 12, (w2.name ? w2.name.toUpperCase() + ' ' : '') +
      (r2 === 'law' ? 'SAW THAT' : (WITNESS_CRY[r2] || 'SAW THAT')),
      r2 === 'quiet' ? '#8a8474' : '#e0a33e');
    if(!loud || rank.indexOf(r2) > rank.indexOf(loud)) loud = r2;
  }
  bzSet(nf);
  chronicle('event', 'Lifted Varric\u2019s crate off June\u2019s corner' + (
    loud === 'law' ? ', under the law\u2019s own eyes.' :
    loud === 'tells' ? ', and a bystander went for the law.' :
    loud === 'victim' ? ', and Varric himself watched it happen.' :
    loud === 'disapproves' ? ', and the wrong people marked it.' :
    loud === 'approves' ? ', and the only witness smiled.' :
    loud === 'quiet' ? ', seen, but the eyes that saw kept to themselves.' :
    '. Nobody looked twice.'));
  return true;
}
function segClearHigh(x1, y1, x2, y2){
  const steps = 14;
  for(let i = 1; i < steps; i++){
    const t = i / steps;
    const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
    if(state.walls.some(w => w.high && px > w.x && px < w.x + w.w && py > w.y && py < w.y + w.h))
      return false;
  }
  return true;
}

    ship.armoury = d.armoury || []; ship.graves = d.graves || [];

function applyInjuries(def){
  // stats as hired, minus what the job has taken
  const out = {...def.stats};
  for(const key of (def.injuries || [])){

    if(inj) out[inj.stat] = Math.max(1, out[inj.stat] + inj.delta);
  }

}

function parseRecVal(v){
  const m = String(v).match(/^([\d,]+)/);
  return m ? parseInt(m[1].replace(/,/g, '')) : null;

function fmtRecVal(orig, add){
  const base = parseRecVal(orig);
  if(base === null || !add) return String(orig);
  const suffix = String(orig).replace(/^[\d,]+/, '');
  return (base + add).toLocaleString('en-GB') + suffix;
}

function bark(c, trigger, force){
  if(!c || !c.alive || !c.stats) return;
  const lines = (BARKS[c.kind] || {})[trigger];
  if(!lines || !lines.length) return;
  const now = Date.now();
  const urgent = trigger === 'panic' || trigger === 'allyDown' || trigger === 'jealous';
  if(!force && !urgent){
    if(now - (c.barkAt || 0) < 3500) return;
    if(Math.random() > 0.65) return;
  }
  c.barkAt = now;
  let line = lines[Math.floor(Math.random() * lines.length)];
  if(lines.length > 1 && line === c.lastBark) line = lines[(lines.indexOf(line) + 1) % lines.length];
  c.lastBark = line;
  if(!state.barks) state.barks = [];
  state.barks = state.barks.filter(bk => bk.c !== c);   // one thought at a time
  state.barks.push({c, txt: line, t: 0, life: 3.3});
}

    if(e.type !== 'arachne' && e.type !== 'queen') continue;
    e.alert = 'alerted';
    e.lastKnown = {x: originX, y: originY};
  }
}
function kill(e, b){
  if(e.type === 'queen' && e.alive) colonyAlarm(e.x, e.y);
  if(state.portDock && e.alive && e.type === 'constable' && e.name &&
     b && b.team === 'player' && b.owner && b.owner.name){
    e.killedBy = b.owner.name;   // the monitor flatlines; the cam keeps the shooter's face
  }
  if(state.portDock && e.alive && e.wasCiv && e.type !== 'constable' &&
     b && b.team === 'player' && b.owner && b.owner.name){
    // a thief shot down in the open is still a person shot down in the open; a knife that drew first is not
    bzCrimeWitness(e.x, e.y, {grade: e.defence ? 'defence' : 'major', who: b.owner.name,
      what: e.defence ? 'the killing of ' + (e.name || 'a stranger') + ', who drew first'
                      : 'the killing of ' + (e.name || 'a stranger') + ' on the concourse'}, b.owner);
  }
  if(state.invoice && e.alive && b && b.team === 'player' &&
     (e.morale === 'broken' || e.morale === 'panicked')) state.invoice.cruelty++;
  e.alive = false;
  e.moving = false; e.run = null;
  if(b && b.bounces > 0){
    addPopup(e.x, e.y - e.r - 26, 'RICOCHET!', '#6fd6ff');
    spawnBurst(e.x, e.y, 14, '#6fd6ff', 300);
  }
  state.slowmoHold = 0.35;
  state.shake = 12;
  const killer = b && b.owner && b.owner.stats ? b.owner : null;
  if(killer && state.aar && state.aar.perHero[killer.name]) state.aar.perHero[killer.name].kills++;
  if(killer){
    bark(killer, 'kill');
    let jealousyFired = false;
    for(const w of state.squad){
      if(w !== killer && w.alive && w.kind === 'amarok' &&
         Math.hypot(w.x - e.x, w.y - e.y) < charVisionRange(w) && losHigh(w.x, w.y, e.x, e.y)){
        bark(w, 'jealous');
        jealousyFired = true;
      }
    }
    if(!jealousyFired && Math.random() < 0.3){
      const mate = state.squad.find(w => w !== killer && w.alive);
      const pt = pairTalk();
      if(mate && pt && pt.kill && pt.kill[killer.kind] &&
         Date.now() - (mate.barkAt || 0) > 5000){
        const lines = pt.kill[killer.kind];
        mate.barkAt = Date.now();
        queueBark(mate, lines[Math.floor(Math.random() * lines.length)], 1.4);
      }
    }
  }
  state.flash = 0.5;
  spawnBurst(e.x, e.y, 26, '#e0483e', 420);
  spawnBurst(e.x, e.y, 12, '#e8e0cc', 260);
  if(b && b.bounces > 1) showBanner('TRICK SHOT', '#6fd6ff');
  else if(b && b.bounces === 1) showBanner('BANK SHOT', '#6fd6ff');
  else showBanner('HOSTILE DOWN');
  const terror = 18 + (b && b.bounces > 0 ? 12 : 0);
  const frightR = (b && b.noise) ? Math.max(120, b.noise * 0.55) : NOISE_GUN;
  for(const o of state.enemies){
    if(!o.alive) continue;
    if(Math.hypot(o.x-e.x, o.y-e.y) < frightR){
      addStress(o, terror);
      makeSuspicious(o, e.x, e.y);
    }
  }
  updateHud();
  checkWin();
}

function checkWin(){
  if(state.shipDeck && !state.deckCombat) return;
  if(state.deckCombat){
    if(state.portFight){
      if(state.enemies.every(e => !e.alive || e.ko)){ resolvePortFight(true); }
      else if(state.squad.every(c => !c.alive || c.downed)){ resolvePortFight(false); }
    }else if(state.boarding && state.boarding.spawned){
      if(state.enemies.every(e => !e.alive || e.ko)){ resolveBoarding(true); }
      else if(state.squad.every(c => !c.alive || c.downed)){ resolveBoarding(false); }
    }
    return;
  }
  if(state.range){
    if(state.rangePhase === 'play'){
      if(state.enemies.every(e => !e.alive || e.ko)) spawnRangeTargets(3);
    }else if(state.rangePhase !== 'move' &&
       state.enemies.every(e => !e.alive || e.ko)){
      rangePhaseSet('move');
      const h = state.squad[0];
      state.rangeMoveFrom = {x: h.x, y: h.y};
    }
    return;
  }
  if(state.pkg) return;   // retrieval contracts end at the extraction point
  if(state.enemies.every(e => !e.alive || e.ko)) winOffer();
}
// the field is yours: objectives met, nobody hostile left standing
function freeRoam(){
  return !!(state.missionFree && state.winReady && !state.over && !state.shipDeck &&
    (state.enemies || []).every(e => !e.alive || e.ko));
}
// the contract is done when YOU say it's done: loot, look around, then sign off
function winOffer(){
  if(state.winReady || state.over) return;
  state.winReady = true;
  state.winTurn = state.turn;        // the clock stops for the ledger: looting costs nothing
  state.missionFree = true;          // the field is yours: walk it off the clock
  state.invoiceSnap = JSON.parse(JSON.stringify(state.invoice || {}));   // the meter stops too
  showBanner('OBJECTIVE COMPLETE', '#9fe08e');
  const b = document.getElementById('winbtn');
  if(b && b.style) b.style.display = 'block';
  if((state.enemies || []).every(e => !e.alive || e.ko)){
    const eb = document.getElementById('endturnbtn');
    if(eb && eb.style) eb.style.display = 'none';   // no one left to take a turn against
  }
}

let advanceOnRestart = false;

function win(){
  closeAdvisoriesForEnd();
  if(state.over) return;
  state.over = true;
  const pt = pairTalk();
  if(pt && pt.win && pt.win.length && state.squad.filter(c => c.alive).length === 2){
    const ex = pt.win[Math.floor(Math.random() * pt.win.length)];
    const [a, b] = state.squad;
    const first = a.kind <= b.kind ? a : b;

    queueBark(second, ex[1], 2.2);

  const t = state.winTurn || state.turn;
  const L = currentLevel();

  else if(t <= L.par + 2) grade = 'Solid work. The client is satisfied.';

  advanceOnRestart = hasNext;

  document.getElementById('ovTitle').textContent = 'Contract Complete';

  // the settlement: every clause itemised, bureaucratically, with a total beneath

  const items = [];

        (met ? ', FULFILLED' : ', UNFULFILLED'),

  }
  if(civP > 0) items.push(['CIVILIAN CASUALTY INDEMNITY (×' + civP + ')', -Math.round(fee * 0.75) * civP]);
  const noiseLevy = Math.min(Math.round(fee * 0.2), Math.floor(inv.noise / 2500) * 5);
  if(noiseLevy > 0) items.push(['ACOUSTIC DISCHARGE LEVY', -noiseLevy]);
  if(inv.civPanics > 0) items.push(['CIVILIAN DISTRESS TAX (×' + inv.civPanics + ')', -8 * inv.civPanics]);
  if(inv.cruelty > 0) items.push(['EXCESSIVE FORCE SURCHARGE (×' + inv.cruelty + ')', -15 * inv.cruelty]);
  const propLevy = Math.min(Math.round(fee * 0.15), 2 * inv.wallHits);
  if(propLevy > 0) items.push(['MUNICIPAL PROPERTY REMEDIATION', -propLevy]);
  if(t > L.par + 2) items.push(['SCHEDULE OVERRUN (' + (t - L.par - 2) + ' TURNS)', -10 * (t - L.par - 2)]);
  let paid = items.reduce((a, [, v]) => a + v, 0);
  if(paid < 25){ items.push(['ADMINISTRATIVE MINIMUM, APPLIED', 25 - paid]); paid = 25; }
  state.invoiceItems = items;
  ship.credits += paid;
  state.lastPaid = paid;
  {
    const chL = currentLevel();
    const chHurt = state.squad.filter(c => c.alive && c.hp < c.maxHp * 0.5).length;
    const chPar = chL.par && (state.winTurn || state.turn) <= chL.par;
    chronicle('contract', '\u201C' + (chL.name || 'The contract') + '\u201D settled: ' + paid +
      ' CR remitted' + (chPar ? ', commendation earned' : '') +
      (chHurt ? '; ' + chHurt + ' walked away hurt' : '') + '.');
  }
  if(ship.medPod) ship.medPod.hp = ship.medPod.max;   // a settled contract refills the pod
  // fallen operators who won anyway are recovered; the downed left at fail are handled there

    if(c.alive && c.downed){ c.downed = false; c.hp = Math.max(3, Math.round(c.maxHp * 0.25)); }
    if(c.alive && c.def) c.def.hp = c.hp;   // the flesh remembers; the plate renews
    if(c.alive) c.armor = protMax(c);
  }
  shipSave();
  // careers advance: a contract served, a win recorded
  const survivors = state.squad.filter(c => c.alive);
  for(const c of state.squad){
    const cr = careerOf(c.name);
    cr.contracts++; cr.wins++;
    const ph = (state.aar && state.aar.perHero[c.name]) || {kills: 0, subdued: 0};
    cr.kills += ph.kills; cr.subdued += ph.subdued;
  }
  const a2 = state.aar || {shots:0, rounds:0, hits:0, crits:0, chunks:0, loudest:0, perHero:{}};
  const acc = a2.rounds ? Math.min(100, Math.round(100 * a2.hits / a2.rounds)) : 0;
  const noiseGrade = a2.loudest <= 0 ? 'SILENT' : a2.loudest < 250 ? 'DISCREET' : a2.loudest < 550 ? 'LOUD' : 'DEAFENING';
  const kills2 = state.enemies.filter(e => !e.alive).length;

  const svc = state.squad.map((c, i) => {
    const rec = SERVICE_RECORDS[SQUAD_DEFS.findIndex(d => d.name === c.name)] || {};

    const line = contractsKey ? fmtRecVal(rec[contractsKey], cr.contracts - 1) + ' → ' + fmtRecVal(rec[contractsKey], cr.contracts) : '';
    const ph = (a2.perHero[c.name]) || {kills: 0, subdued: 0};
    return '<div class="aarhero"><b style="color:' + c.color + '">' + c.name.toUpperCase() + '</b>' +
      (line ? ' · contracts ' + line : '') +
      (ph.kills ? ' · kills +' + ph.kills : '') +
      (ph.subdued ? ' · subdued +' + ph.subdued : '') +
      (c.alive ? '' : ' · <span style="color:#e0483e">RECOVERED BY MEDICAL</span>') + '</div>';
  }).join('');
  document.getElementById('result').innerHTML =

      '<div class="aargrid">' +
        '<div><span>Hostiles terminated</span><b>' + kills2 + '</b></div>' +

        '<div><span>Trigger pulls</span><b>' + a2.shots + '</b></div>' +
        '<div><span>Rounds discharged</span><b>' + a2.rounds + '</b></div>' +
        '<div><span>Rounds on target</span><b>' + acc + '%</b></div>' +
        '<div><span>Critical strikes</span><b style="color:#ffd76a">' + a2.crits + '</b></div>' +
        '<div><span>Property damage</span><b>' + a2.chunks + ' section' + (a2.chunks === 1 ? '' : 's') + '</b></div>' +
        '<div><span>Noise discipline</span><b>' + noiseGrade + '</b></div>' +
        (currentLevel().civilians ? '<div><span>Civilian casualties</span><b style="color:' +
          (((state.aarCiv||{}).player||0) + (((state.aarCiv||{}).hostile)||0) > 0 ? '#e0483e' : '#6fd6ff') + '">' +
          ((((state.aarCiv||{}).player)||0) + (((state.aarCiv||{}).hostile)||0)) +

      '</div>' +
      '<div class="aarsvcHead">SETTLEMENT OF ACCOUNT · VALHALLA CORPORATION, REMITTANCE DIVISION</div>' +
      '<div class="aarInv">' +
        (state.invoiceItems || []).map(([k, v], ri) =>
          '<div class="aiRow aiLive" style="animation-delay:' + (0.55 + ri * 0.22) + 's"><span>' + k +
          '</span><i></i><b style="color:' + (v >= 0 ? 'var(--bone)' : '#e0483e') + '">' +

          '<i class="aiTick aiTickTotal" data-final="' + (state.lastPaid || 0) +

  const homeN = (typeof galaxyNode === 'function') && galaxyNode(ship.at);
  document.getElementById('again').textContent = homeN ? 'Return to ' + homeN.name : 'Return to Ship';

  if(ovT && ovT.classList){ ovT.classList.remove('ovSlam'); void (ovT.offsetWidth || 0); ovT.classList.add('ovSlam'); }

// the numbers earn themselves: each figure counts up when its line lands
function tickInvoice(){
  if(typeof document.querySelectorAll !== 'function' ||
     typeof requestAnimationFrame !== 'function' || typeof performance === 'undefined') return;
  const ticks = document.querySelectorAll('.aiTick');
  if(!ticks || !ticks.length) return;
  const t0 = performance.now();
  const step = (now) => {
    let live = false;
    for(const el of ticks){
      const fin = +el.dataset.final || 0;
      const start = t0 + (+el.dataset.delay || 0) * 1000;
      const t = (now - start) / 600;                       // each figure takes 0.6s to land
      if(t < 1){ live = true; }
      const k = t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
      el.textContent = String(Math.round(fin * k));
    }
    if(live) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
