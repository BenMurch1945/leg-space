}

function draw(){
  const s = state;
  const p = pc();
  clearPhysical();          // the whole canvas, letterbox included
  ctx.clearRect(0,0,W,H);

  camApply();
  ctx.save();
  if(s.shake > 0.2){
    ctx.translate((Math.random()-0.5)*s.shake, (Math.random()-0.5)*s.shake);
  }

  // starfield (missions only: the deck paints its own sky)
  if(!s.shipDeck){
    for(const st of s.stars){
      ctx.globalAlpha = st.a;
      ctx.fillStyle = '#e8e0cc';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // the Orrix's floor: plating, seams, wear, a ship underfoot, not a field
  if(s.shipDeck && deckMask){
    ctx.save();
    ctx.beginPath();
    for(const r of deckMask.int) ctx.rect(r.x, r.y, r.w, r.h);
    ctx.clip();
    ctx.fillStyle = '#161b26';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(232,224,204,.05)';
    ctx.lineWidth = 1;
    for(let gx = 0; gx <= W; gx += 64){
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for(let gy = 0; gy <= H; gy += 64){
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }
    // worn plates: a seeded scatter of darker panels
    for(let i = 0; i < 26; i++){
      const seed = i * 53.9;
      ctx.fillStyle = 'rgba(0,0,0,' + (0.05 + (seed % 4) * 0.02) + ')';
      ctx.fillRect(((seed * 9.1) % W) - (((seed * 9.1) % W) % 64), ((seed * 5.3) % H) - (((seed * 5.3) % H) % 64), 64, 64);
    }
    ctx.restore();
  }

  // slow-mo vignette
  if(s.timeScale < 0.8){
    const v = (0.8 - s.timeScale) / 0.65;
    const g = ctx.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2,H*0.75);
    g.addColorStop(0,'rgba(11,14,26,0)');
    g.addColorStop(1,`rgba(111,214,255,${0.18*v})`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  // walls
  // burrow mouths: dark holes in the rock, ringed with worn ground
  {
    const Lb2 = currentLevel();
    if(Lb2.burrows){
      for(const b of Lb2.burrows){
        const bx = b.x * W, by = b.y * H;
        const br = Lb2.burrowR || 52;
        // worn ground: the traffic circle of a living nest
        const grd = ctx.createRadialGradient(bx, by, 4, bx, by, br);
        grd.addColorStop(0, 'rgba(20,14,30,.55)');
        grd.addColorStop(0.55, 'rgba(20,14,30,.22)');
        grd.addColorStop(1, 'rgba(20,14,30,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill();
        // the mouth itself
        ctx.fillStyle = '#0a0612';
        ctx.beginPath(); ctx.ellipse(bx, by, 16, 11, 0.3, 0, 7); ctx.fill();
        ctx.strokeStyle = `rgba(176,106,232,${0.35 + 0.15 * Math.sin(performance.now() / 700 + bx)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(bx, by, 16, 11, 0.3, 0, 7); ctx.stroke();
      }
    }
  }

  for(const w of s.walls){
    drawWall(w, w.high);
  }

  // props: sealed crates and their kin, on the floor, in hands, or mid-air
  if(s.props) for(const pcr of s.props){
    ctx.fillStyle = pcr.vol ? '#6e3a24' : '#5a4a2e';
    ctx.fillRect(pcr.x - 9, pcr.y - 8, 18, 15);
    ctx.strokeStyle = pcr.vol ? 'rgba(224,122,62,.9)' : 'rgba(212,168,67,.9)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(pcr.x - 9, pcr.y - 8, 18, 15);
    ctx.beginPath(); ctx.moveTo(pcr.x - 9, pcr.y - 0.5); ctx.lineTo(pcr.x + 9, pcr.y - 0.5); ctx.stroke();
    if(!pcr.holder && !pcr.flying && s.shipDeck && !s.deckCombat){
      ctx.fillStyle = 'rgba(212,168,67,.8)';
      ctx.font = "700 8.5px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText(pcr.bz ? 'SEALED CRATE' : 'CARGO', pcr.x, pcr.y + 20);
    }
  }
  // when you are the quarry, you see the hunter's eyes: constable cones go visible
  if(s.civs && s.shipDeck && !s.deckCombat && s.portDock){
    const bC = bz();
    const crPC = bzCrate();
    const hotC = !!(bC && ((crPC && crPC.holder && bC.crateHolder === 'crew' && !bC.boughtFromJune) ||
      bC.copHunt || bC.heat));
    const tC = performance.now() / 1000;
    if(hotC) for(const cv of s.civs){
      if(cv.kind !== 'constable' || !cv.alive || cv.ko) continue;
      const fa = cv.facing || 0;
      ctx.save();
      ctx.globalAlpha = 0.14 + 0.05 * Math.sin(tC * 3);
      ctx.fillStyle = '#b06ae0';
      ctx.beginPath();
      ctx.moveTo(cv.x, cv.y);
      ctx.arc(cv.x, cv.y, 260, fa - 1.05, fa + 1.05);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(176,106,224,.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cv.x, cv.y);
      ctx.arc(cv.x, cv.y, 260, fa - 1.05, fa + 1.05);
      ctx.closePath();
      ctx.stroke();
    }
  }
  // a witness running to the law carries the alarm over their head, clock or no clock
  if(s.civs && s.shipDeck) for(const cv of s.civs){
    if(!cv.alive || cv.ko || !cv.errand || cv.errand.kind !== 'law') continue;
    const bobE = Math.sin(performance.now() / 150) * 2.5;
    ctx.fillStyle = '#e0a33e';
    ctx.font = "900 18px 'Cinzel',serif";
    ctx.textAlign = 'center';
    ctx.fillText('!', cv.x, cv.y - cv.r - 10 + bobE);
  }
  // an operator under search stands beneath the bar that says so
  if(s.shipDeck && !s.deckCombat) for(const c of s.squad){
    if(!c.friskT || performance.now() >= c.friskT) continue;
    const frac = 1 - (c.friskT - performance.now()) / 10000;
    ctx.fillStyle = 'rgba(10,8,16,.75)';
    ctx.fillRect(c.x - 21, c.y - c.r - 24, 42, 7);
    ctx.fillStyle = '#e0a33e';
    ctx.fillRect(c.x - 20, c.y - c.r - 23, 40 * Math.max(0, Math.min(1, frac)), 5);
    ctx.font = "700 7px 'Space Grotesk',sans-serif";
    ctx.fillStyle = 'rgba(224,163,62,.95)';
    ctx.textAlign = 'center';
    ctx.fillText('SEARCHING', c.x, c.y - c.r - 28);
  }
  // the named folk wear their names, in peace and under the clock alike
  if(s.civs && s.shipDeck) for(const cv of s.civs){
    if(!cv.name || !cv.alive) continue;
    const tint = cv.kind === 'constable' ? '#b06ae0' : cv.kind === 'trader' ? '#6fd6ff'
      : cv.kind === 'barkeep' ? '#9fe08e' : 'var(--brass)';
    ctx.strokeStyle = tint;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cv.x, cv.y, cv.r + 3, 0, 7); ctx.stroke();
    ctx.fillStyle = tint;
    ctx.font = "800 9px 'Space Grotesk',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(cv.name.toUpperCase(), cv.x, cv.y - cv.r - 8);
  }
  // the hatches: plasma seams in orbit, green mouths when grounded
  if(s.shipDeck && usingCustom && customLevel && Array.isArray(customLevel.airlocks)){
    const open = !!s.portDock;
    for(const a of customLevel.airlocks){
      const px = a.x * W, py = a.y * H;
      const horiz = a.side === 'N' || a.side === 'S';
      ctx.fillStyle = open ? 'rgba(159,224,142,.5)' : 'rgba(111,214,255,.55)';
      if(horiz) ctx.fillRect(px - 16, py - 4, 32, 8);
      else ctx.fillRect(px - 4, py - 16, 8, 32);
      ctx.strokeStyle = open ? 'rgba(159,224,142,.95)' : 'rgba(111,214,255,.9)';
      ctx.lineWidth = 1.5;
      if(horiz){ ctx.strokeRect(px - 16, py - 4, 32, 8);
        ctx.beginPath(); ctx.moveTo(px, py - 4); ctx.lineTo(px, py + 4); ctx.stroke(); }
      else{ ctx.strokeRect(px - 4, py - 16, 8, 32);
        ctx.beginPath(); ctx.moveTo(px - 4, py); ctx.lineTo(px + 4, py); ctx.stroke(); }
    }
  }
  // aboard, space lies strictly outside the hull: still stars at anchor, a river astern underway
  if(s.shipDeck && deckMask){
    const flying = s.flight && !(s.flight.intro > 0);
    ctx.save();
    ctx.beginPath();
    for(const r of deckMask.ext) ctx.rect(r.x, r.y, r.w, r.h);
    ctx.clip();
    const t = performance.now() / 1000;
    const orbitN = !flying && galaxyNode(ship.at);
    if(orbitN){
      if(state.portDock){
        ctx.fillStyle = '#05070d';              // grounded: hard vacuum beyond the station ring
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(232,224,204,.5)';
        for(const st2 of state.stars){ ctx.globalAlpha = st2.a * 0.5;
          ctx.beginPath(); ctx.arc(st2.x, st2.y, st2.r, 0, 7); ctx.fill(); }
        ctx.globalAlpha = 1;
      }else{
        paintPlanetscape(ctx, W, H, orbitN, t); // the world you are orbiting, beyond the hull
      }
    }else{
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#02030a'); bg.addColorStop(1, '#060a16');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
    }
    if(flying){
      // the bow points starboard of screen: the stars run bow to stern, right to left
      for(let i = 0; i < 90; i++){
        const seed = i * 127.3;
        const sy2 = ((seed * 7.13) % H);
        const speed = 900 + (seed % 5) * 380;
        const sx2 = W + 80 - (((seed * 3.7 + t * speed) % (W + 160)));
        const len = 24 + (seed % 4) * 22;
        const a = 0.25 + ((seed % 7) / 7) * 0.5;
        ctx.strokeStyle = 'rgba(180,200,235,' + a + ')';
        ctx.lineWidth = (seed % 3) ? 1 : 1.8;
        ctx.beginPath();
        ctx.moveTo(sx2, sy2);
        ctx.lineTo(sx2 - len, sy2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // the cut: a red ring and sparks where the hull is losing the argument
  if(s.shipDeck && s.boarding && s.boarding.telegraph){
    const b = s.boarding;
    const t2 = performance.now() / 1000;
    const pr = 20 + 5 * Math.sin(t2 * 5);
    ctx.strokeStyle = 'rgba(224,72,62,.9)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.bx, b.by, pr, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(224,72,62,.18)';
    ctx.beginPath(); ctx.arc(b.bx, b.by, pr, 0, 7); ctx.fill();
    for(let i = 0; i < 7; i++){
      const sa = t2 * 9 + i * 1.7;

  // aboard: stations glow, and the near one offers its hand
  if(s.shipDeck && s.stations){
    const sel = p;
    for(const st of s.stations){
      const near = sel && Math.hypot(sel.x - st.x, sel.y - st.y) <= 85;
      ctx.strokeStyle = near ? 'rgba(111,214,255,.9)' : 'rgba(212,168,67,.55)';
      ctx.lineWidth = near ? 2.5 : 1.5;

  // enemy telegraph: the aiming line ramps up before the shot lands
  if(s.phase === 'enemy' && s.et && s.et.stage === 'aim' && s.et.e && s.et.e.alive && s.et.e.visible){

  // sound made visible: rings race out to the radius everything just heard
  if(s.noiseRings){
    for(let i = s.noiseRings.length - 1; i >= 0; i--){

      nr.t += realDtDraw;
      // three acts: race out, hold the ground, let go, footsteps do it all in a hurry
      const EXPAND = nr.step ? 0.3 : 0.8, HOLD = nr.step ? 0.35 : 2.4, FADE = nr.step ? 0.5 : 1.6;
      const dur = EXPAND + HOLD + FADE;
      if(nr.t >= dur){ s.noiseRings.splice(i, 1); continue; }
      const base = nr.hostile ? '224,72,62' : '212,168,67';

      if(nr.t < EXPAND){
        const k = nr.t / EXPAND;
        radius = nr.max * (1 - Math.pow(1 - k, 3));
        edgeA = 0.4;
        fillA = 0.07 * k;
      }else if(nr.t < EXPAND + HOLD){
        radius = nr.max;
        edgeA = 0.3;
        fillA = 0.07;
      }else{
        const k = (nr.t - EXPAND - HOLD) / FADE;
        radius = nr.max;
        edgeA = 0.3 * (1 - k);
        fillA = 0.07 * (1 - k);
      }
      // the claimed ground: everything inside this heard it
      ctx.fillStyle = `rgba(${base},${fillA})`;
      ctx.beginPath();
      ctx.arc(nr.x, nr.y, radius, 0, 7);
      ctx.fill();
      ctx.strokeStyle = `rgba(${base},${edgeA})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(nr.x, nr.y, radius, 0, 7);
      ctx.stroke();
      if(nr.t > EXPAND){   // settled: the boundary shows as a patient dashed edge
        ctx.setLineDash([3,7]);
        ctx.strokeStyle = `rgba(${base},${edgeA*0.8})`;

        ctx.arc(nr.x, nr.y, nr.max + 3, 0, 7);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  // active scans: an orbital reticle over the painted zone
  for(const sc of s.scans){
    const spin = performance.now()/900;
    ctx.strokeStyle = 'rgba(111,214,255,.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([10,8]);
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, sc.r, spin, spin + Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "700 14px 'Space Grotesk',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(111,214,255,.7)';
    ctx.fillText('⌖', sc.x, sc.y + 5);
  }

  // standing watch orders: a brass wedge everyone can plan around
  for(const c of s.squad){
    if(!c.alive || !c.watch) continue;
    const wr = watchRange(c);
    ctx.fillStyle = 'rgba(212,168,67,0.06)';
    ctx.strokeStyle = 'rgba(212,168,67,0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.arc(c.x, c.y, wr, c.watch.facing - WATCH_HALF, c.watch.facing + WATCH_HALF);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }



  // rally range preview
  if(s.mode === 'rally' && s.phase === 'player' && !s.over && !busy() && p.alive && p.ap > 0){
    ctx.strokeStyle = 'rgba(111,214,255,.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4,6]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, RALLY_RANGE, 0, 7);
    ctx.stroke();
    ctx.setLineDash([]);
    // allies in reach glow
    for(const c of s.squad){
      if(!c.alive || c === p) continue;
      if(Math.hypot(c.x-p.x, c.y-p.y) <= RALLY_RANGE){

  }

  // snap shot: the frozen moment, and no doubt about whose it is
  if(s.ow){
    ctx.fillStyle = 'rgba(4,6,14,0.35)';

    const e = s.ow.enemy;
    const c = s.ow.char;
    const pulse = 0.6 + 0.4*Math.sin(performance.now()/140);

    // the line of the moment: shooter to caught target
    ctx.strokeStyle = `rgba(212,168,67,${0.35 + 0.3*pulse})`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8,6]);
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(e.x, e.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // shooter beacon: pulsing double ring + name tag
    ctx.strokeStyle = `rgba(212,168,67,${0.5 + 0.5*pulse})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 14 + pulse*4, 0, 7);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 20 + pulse*4, 0, 7);
    ctx.stroke();
    ctx.font = "700 11px 'Space Grotesk',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = '#d4a843';
    ctx.fillText(c.name.toUpperCase() + ': TAKE THE SHOT', c.x, c.y - c.r - 26);

    // target countdown
    const frac = Math.max(0, s.ow.timer / TUNE.snapTime);
    ctx.strokeStyle = frac < 0.35 ? '#e0483e' : '#d4a843';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 12, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(212,168,67,.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 6, 0, 7);
    ctx.stroke();
    ctx.setLineDash([]);

    // persistent header while the moment holds
    ctx.font = "800 20px 'Cinzel',serif";
    ctx.fillStyle = `rgba(212,168,67,${0.75 + 0.25*pulse})`;
    ctx.fillText('SNAP SHOT · ' + c.name.toUpperCase() + '  ·  ' + Math.ceil(s.ow.timer) + 's', W/2, 46);
  }

  // aim preview


  // the port's furniture: named places and transit arches
  if(s.spots && s.spots.length){
    ctx.textAlign = 'center';
    for(const sp of s.spots){
      ctx.strokeStyle = 'rgba(212,168,67,.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 7, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(212,168,67,.55)';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 2.5, 0, 7); ctx.fill();
      if(sp.label){

        ctx.fillStyle = 'rgba(212,168,67,.5)';

      }
    }
  }
  if(s.shelves && s.shelves.length && s.portDock){
    const sh9 = bz() && bz().shop;
    if(sh9){
      ctx.textAlign = 'center';
      s.shelves.forEach((pt, i9) => {

  if(s.doors && s.doors.length){

  // the crowd: soft grey figures, bobbing, oblivious until they aren't
  if(s.civs) for(const cv of s.civs){

  // enemies (hidden by fog unless a squad member can see them)

      ctx.ellipse(e.x, e.y, (e.r || 9) * 1.35, (e.r || 9) * 0.55, 0.9, 0, 7);

      ctx.stroke();

        const nearC = pc() && pc().alive && Math.hypot(pc().x - e.x, pc().y - e.y) < 52;

                                : 'rgba(159,224,142,.22)';
        ctx.lineWidth = nearC ? 2 : 1.2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.arc(e.x, e.y, 46, t * 0.4, t * 0.4 + Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(159,224,142,' + gl.toFixed(2) + ')';

        ctx.fill();

    }

    e.everSeen = true;
    const arch = ARCHETYPES[e.type];

      ctx.restore();
      ctx.strokeStyle = 'rgba(111,214,255,.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(e.x, e.y - e.r - 6, 5, t*2 % 6.28, (t*2 % 6.28) + 2);
      ctx.stroke();
      ctx.font = "8px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(111,214,255,.6)';
      ctx.fillText('OUT', e.x, e.y + e.r + 12);
      continue;
    }
    drawStatusIcons(e, e.x, e.y + e.r + 16);
    let by = Math.sin(t*2 + e.bob)*1.5;
    let lx = 0, ly = 0;
    if(e.moving && e.run){
      by = -Math.abs(Math.sin(e.run.stride * 0.11)) * 2.4;
      lx = (e.run.dirX||0) * 1.8; ly = (e.run.dirY||0) * 1.8;

    if(e.morale === 'broken'){

      ctx.beginPath(); ctx.arc(edx, edy, e.r, 0, 7); ctx.fill();
    }

    // facing: the eye sits toward where they look, with a direction tick outside
    const fx = Math.cos(e.facing), fy = Math.sin(e.facing);
    ctx.fillStyle = arch.color;
    ctx.beginPath(); ctx.arc(edx + fx*e.r*0.45, edy + fy*e.r*0.45, 2.6, 0, 7); ctx.fill();
    ctx.strokeStyle = arch.color;

    ctx.moveTo(edx + fx*(e.r+1), edy + fy*(e.r+1));
    ctx.lineTo(edx + fx*(e.r+6), edy + fy*(e.r+6));
    ctx.stroke();

    // archetype silhouette cues
    if(e.type === 'runner'){
      // trailing chevrons behind the facing
      ctx.strokeStyle = arch.color;
      ctx.lineWidth = 1.5;
      for(let c=1; c<=2; c++){
        const bx = edx - fx*(e.r + 2.5 + c*3.6), byy = edy - fy*(e.r + 2.5 + c*3.6);
        const px2 = -fy, py2 = fx;
        ctx.beginPath();
        ctx.moveTo(bx + px2*3.6, byy + py2*3.6);
        ctx.lineTo(bx - fx*3, byy - fy*3);
        ctx.lineTo(bx - px2*3.6, byy - py2*3.6);

    }else if(e.type === 'breaker'){

      ctx.lineWidth = 1;

    ctx.strokeStyle = frac > 0.5 ? arch.color : '#d4a843';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(edx, edy, e.r + 5, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2);
    ctx.stroke();

    // detection meter: they're starting to notice someone
    if(TUNE.fog && e.alert !== 'alerted' && e.det > 4){
      const df = Math.min(1, e.det/100);
      ctx.strokeStyle = df > 0.75 ? '#e0483e' : df > 0.4 ? '#e0a33e' : 'rgba(232,224,204,.8)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(edx, edy, e.r + 9, -Math.PI/2 - df*Math.PI*0.5, -Math.PI/2 + df*Math.PI*0.5);
      ctx.stroke();
    }
    // suspicious marker
    if(e.alert === 'suspicious' && e.morale === 'steady'){
      ctx.fillStyle = '#e0a33e';
      ctx.font = "800 12px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('?', edx, edy - e.r - 10);
    }
  }

  // the fog itself, then ghosts of enemies at their last seen positions
  drawFog();

  // an armed mode announces itself: a wash over the world and quiet instructions
  const MODE_BANNERS = {
    scan:  ['SHIP SCANNER ARMED', 'CLICK AN AREA TO SCAN IT', 'rgba(111,214,255,'],
    watch: ['OVERWATCH ARMED', 'CLICK AND DRAG TO AIM YOUR WATCH CONE', 'rgba(212,168,67,'],
    rally: ['RALLY', 'CLICK A SHAKEN SQUADMATE TO STEADY THEM', 'rgba(111,214,255,'],
  };
  const mb = MODE_BANNERS[s.mode];
  if(mb && s.phase === 'player' && !s.over && !s.range){
    const mbElapsed = performance.now() - (s.modeAt || 0);
    const mbK = Math.min(1, mbElapsed / 300);
    const mbEase = 1 - Math.pow(1 - mbK, 3);
    // the wash: the world holds still while you aim the instrument
    ctx.fillStyle = mb[2] + (0.05 * mbEase) + ')';
    ctx.fillRect(0, 0, W, H);
    // the instruction band
    ctx.save();
    ctx.globalAlpha = mbEase;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(11,14,22,.72)';
    ctx.fillRect(0, 96, W, 62);
    ctx.font = "700 19px 'Cinzel', serif";
    ctx.fillStyle = mb[2] + '.95)';
    ctx.shadowColor = mb[2] + '.5)';
    ctx.shadowBlur = 10;
    ctx.fillText(mb[0] + (s.mode === 'scan' ? '  ·  ' + s.scansLeft + ' CHARGE' + (s.scansLeft === 1 ? '' : 'S') : ''), W/2, 122);
    ctx.font = "700 13px 'Space Grotesk', sans-serif";
    ctx.fillStyle = 'rgba(232,224,204,.9)';
    ctx.shadowBlur = 0;
    ctx.fillText(mb[1], W/2, 146);

  }

  // hacked camera feeds: a lens and its circle of custody
  for(const sc of s.scans){
    if(!sc.camera) continue;
    ctx.strokeStyle = 'rgba(111,214,255,.34)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 7]);
    ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = 'rgba(111,214,255,.8)';
    ctx.fillRect(-3.5, -3.5, 7, 7);
    ctx.restore();
    ctx.fillStyle = '#0b0e16';
    ctx.beginPath(); ctx.arc(sc.x, sc.y, 1.6, 0, 7); ctx.fill();
    ctx.font = "700 7px 'Space Grotesk',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(111,214,255,.5)';
    ctx.fillText('CAM', sc.x, sc.y - sc.r + 10);
  }

  // the hand's intent rides above the fog: cone and path must read at a glance
  // scanner placement preview
  if(s.mode === 'scan' && s.phase === 'player' && !s.over && !busy() && s.scansLeft > 0){
    ctx.strokeStyle = 'rgba(111,214,255,.85)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,5]);
    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, TUNE.scanRange, 0, 7);
    ctx.stroke();
    ctx.setLineDash([]);
  }


  // watch-direction preview while dragging
  if(s.mode === 'watch' && s.aiming && pointer.down && !s.ow){
    const a = Math.atan2(pointer.y - p.y, pointer.x - p.x);
    const wr = watchRange(p);
    ctx.fillStyle = 'rgba(212,168,67,0.16)';
    ctx.strokeStyle = 'rgba(212,168,67,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, wr, a - WATCH_HALF, a + WATCH_HALF);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  const showShootAim = s.aiming && pointer.down && s.mode === 'shoot' && s.power >= MIN_POWER;
  const showMoveAim  = s.aiming && pointer.down && s.mode === 'move' && s.movePreview;
  if((showShootAim || showMoveAim) && !busy() && p.alive && (p.ap > 0 || s.ow) &&
     p.morale !== 'broken' && p.morale !== 'panicked'){
    const isMove = s.mode === 'move';

    if(!isMove && p.chargeReady){
      const ca = Math.atan2(s.aimVec.y, s.aimVec.x);
      const cReach = Math.max(60, 260 * Math.max(0.35, s.power));
      let cx2 = p.x, cy2 = p.y;
      for(let d = 6; d <= cReach; d += 6){
        const px2 = p.x + Math.cos(ca)*d, py2 = p.y + Math.sin(ca)*d;
        if(px2 < p.r || px2 > W - p.r || py2 < p.r || py2 > H - p.r) break;
        let blk = false;
        for(const wl of s.walls){
          if(!wl.high) continue;
          if(px2 > wl.x - p.r && px2 < wl.x + wl.w + p.r && py2 > wl.y - p.r && py2 < wl.y + wl.h + p.r){ blk = true; break; }
        }
        if(blk) break;
        cx2 = px2; cy2 = py2;
      }
      ctx.strokeStyle = 'rgba(212,168,67,.85)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(cx2, cy2); ctx.stroke();
      ctx.fillStyle = 'rgba(212,168,67,.9)';
      ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, 7); ctx.fill();
      ctx.font = "700 9px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(212,168,67,.9)';
      ctx.fillText('CHARGE', cx2, cy2 - 12);
    }else if(!isMove && wpn().melee && isBluntKey(p.weapon)){
      // the hammer's promise: the breathing circle, time the swell
      const hw = wpn();
      const hr = bluntPulseR(p, hw);
      const swell = Math.max(0, Math.min(1, (hr - (p.r + 6)) / (hw.range - p.r - 6)));   // 0 at rest, 1 at full
      ctx.strokeStyle = `rgba(201,162,74,${0.5 + swell * 0.5})`;
      ctx.lineWidth = 2.5 + swell * 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, hr, 0, 7); ctx.stroke();
      ctx.fillStyle = `rgba(201,162,74,${0.06 + swell * 0.08})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, hr, 0, 7); ctx.fill();
    }else if(!isMove && wpn().melee){
      // the blade's honest promise: a wedge of possibility that narrows as you settle
      const bw = wpn();
      const ba = Math.atan2(s.aimVec.y, s.aimVec.x);
      const reach = Math.max(60, bw.range * Math.max(0.35, s.power));
      const half = coneAngle() / 2;
      const edgeEnd = (ang) => {
        let ex2 = p.x, ey2 = p.y;
        const dx2 = Math.cos(ang), dy2 = Math.sin(ang);
        for(let d = 6; d <= reach; d += 6){
          const px2 = p.x + dx2*d, py2 = p.y + dy2*d;
          if(px2 < p.r || px2 > W - p.r || py2 < p.r || py2 > H - p.r) break;
          let blk = false;
          for(const wl of s.walls){
            if(!wl.high) continue;
            if(px2 > wl.x - p.r && px2 < wl.x + wl.w + p.r && py2 > wl.y - p.r && py2 < wl.y + wl.h + p.r){ blk = true; break; }
          }
          if(blk) break;
          ex2 = px2; ey2 = py2;
        }
        return {x: ex2, y: ey2};
      };
      const e1 = edgeEnd(ba - half), e2 = edgeEnd(ba + half), mid = edgeEnd(ba);
      ctx.fillStyle = 'rgba(201,107,62,.10)';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y); ctx.lineTo(e1.x, e1.y);
      ctx.arc(p.x, p.y, Math.min(reach, Math.hypot(mid.x-p.x, mid.y-p.y)), ba - half, ba + half);
      ctx.lineTo(p.x, p.y);
      ctx.fill();
      ctx.strokeStyle = 'rgba(201,107,62,.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8,5]);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(e1.x, e1.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(e2.x, e2.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "700 8px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(201,107,62,.85)';
      ctx.fillText('DASH, ANYWHERE IN THE WEDGE', mid.x, mid.y - 10);
    }else if(!isMove){
      // the loudness of this decision, drawn before it's made
      const nR = wpn().noise || NOISE_GUN;
      ctx.strokeStyle = 'rgba(212,168,67,.16)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2,9]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, nR, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "9px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(212,168,67,.35)';
      ctx.fillText('HEARD TO HERE', p.x, p.y - nR - 5);
    }

    if(isMove){
      const mp = s.movePreview;
      if(mp.valid){
        // reachable path, bends around obstacles
        ctx.strokeStyle = 'rgba(212,168,67,.9)';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([9,7]);
        ctx.beginPath();
        ctx.moveTo(mp.cutPath[0].x, mp.cutPath[0].y);
        for(let i=1;i<mp.cutPath.length;i++) ctx.lineTo(mp.cutPath[i].x, mp.cutPath[i].y);
        ctx.stroke();

        // out-of-range remainder in red
        if(mp.over){
          const end = mp.cutPath[mp.cutPath.length-1];
          ctx.strokeStyle = 'rgba(224,72,62,.55)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(end.x, end.y);
          // draw the rest of the full path from the cut point onward
          let past = false;
          for(let i=1;i<mp.path.length;i++){
            const a = mp.path[i-1], b = mp.path[i];
            if(!past){
              // find the segment containing the cut point
              const onSeg = Math.abs(Math.hypot(end.x-a.x, end.y-a.y) + Math.hypot(b.x-end.x, b.y-end.y)
                            - Math.hypot(b.x-a.x, b.y-a.y)) < 1;
              if(onSeg){ past = true; ctx.lineTo(b.x, b.y); }
            }else{
              ctx.lineTo(b.x, b.y);
            }
          }
          ctx.stroke();
        }
        ctx.setLineDash([]);

        // pace and its price: WALK or RUN, and the circle your steps will claim
        const dest0 = mp.cutPath[mp.cutPath.length - 1];
        const pWalking = mp.dist <= maxMoveDist(p) * 0.5;
        const stepR = footfallRadius(p) * (pWalking ? 0.5 : 1);
        ctx.setLineDash([4,8]);
        ctx.strokeStyle = pWalking ? 'rgba(111,214,255,.3)' : 'rgba(224,163,62,.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(dest0.x, dest0.y, stepR, 0, 7);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = "700 8px 'Space Grotesk',sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = pWalking ? 'rgba(111,214,255,.7)' : 'rgba(224,163,62,.8)';
        ctx.fillText(pWalking ? 'WALK · quiet' : 'RUN · heard to here', dest0.x, dest0.y + stepR + 10);

        // this move ends in cover: say so, before they commit
        const dest = mp.cutPath[mp.cutPath.length - 1];
        const hug = hugsCoverAt(dest.x, dest.y, p.r);
        if(hug){
          drawShield(dest.x, dest.y - 30, 12, 'rgba(111,214,255,.95)');
          ctx.font = "800 17px 'Space Grotesk',sans-serif";
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(111,214,255,.95)';
          ctx.shadowColor = 'rgba(11,14,22,.9)';
          ctx.shadowBlur = 6;
          ctx.fillText(hug === 2 ? 'IN HARD COVER' : 'IN COVER', dest.x, dest.y - 50);
          ctx.shadowBlur = 0;
        }

        // target cursor at the reachable landing point
        const end = mp.cutPath[mp.cutPath.length-1];
        const pulse = 1 + Math.sin(performance.now()/180)*0.08;
        ctx.strokeStyle = mp.over ? '#e0483e' : '#d4a843';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(end.x, end.y, p.r * pulse, 0, 7);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(end.x, end.y, 3, 0, 7);
        ctx.fillStyle = mp.over ? '#e0483e' : '#d4a843';
        ctx.fill();
        // crosshair ticks
        ctx.beginPath();
        for(const [tx, ty] of [[1,0],[-1,0],[0,1],[0,-1]]){
          ctx.moveTo(end.x + tx*(p.r*pulse+3), end.y + ty*(p.r*pulse+3));
          ctx.lineTo(end.x + tx*(p.r*pulse+9), end.y + ty*(p.r*pulse+9));
        }
        ctx.stroke();

        // distance readout
        ctx.font = "700 12px 'Space Grotesk',sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = mp.over ? '#e0483e' : '#e8e0cc';
        ctx.fillText(`${Math.round(mp.dist)} / ${Math.round(maxMoveDist())}`, end.x, end.y - p.r - 14);
      }else{
        // unreachable: red X at the requested point
        const t = mp.target;
        ctx.strokeStyle = '#e0483e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(t.x-10, t.y-10); ctx.lineTo(t.x+10, t.y+10);
        ctx.moveTo(t.x+10, t.y-10); ctx.lineTo(t.x-10, t.y+10);
        ctx.stroke();
      }
    }else if(!isBluntKey(p.weapon)){
      const len = Math.hypot(s.aimVec.x, s.aimVec.y) || 1;
      const dx = s.aimVec.x/len, dy = s.aimVec.y/len;
      const baseA = Math.atan2(dy, dx);
      const cone = coneAngle();

      // pull-back cue line
      ctx.strokeStyle = 'rgba(232,224,204,.35)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,6]);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(pointer.x, pointer.y);
      ctx.stroke();

      const ex = shooterExemptions(p.x, p.y, p.r);
      const hit = raycast(p.x, p.y, dx, dy, Math.max(W,H)*1.5, ex);
      const hitDist = Math.hypot(hit.x - p.x, hit.y - p.y);

      // show which cover you're using: fired-over low walls glow, peeked corners get an arc
      if(ex){
        ctx.setLineDash([]);
        for(const w2 of s.walls){
          if(ex.adj.has(w2)){
            ctx.strokeStyle = 'rgba(212,168,67,.85)';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(w2.x-2, w2.y-2, w2.w+4, w2.h+4);
          }
        }
        for(const pk of ex.peeks){
          ctx.strokeStyle = 'rgba(111,214,255,.6)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(pk.cx, pk.cy, 10, 0, 7);
          ctx.stroke();
        }
      }

      const w = wpn();
      const tight = 1 - (cone - w.coneMin)/(w.coneMax - w.coneMin);
      const range = s.power * w.speed * w.life;
      const coneLen = Math.min(range, Math.max(W,H)*0.9);

      ctx.fillStyle = `rgba(111,214,255,${0.05 + tight*0.1})`;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.arc(p.x, p.y, coneLen, baseA - cone, baseA + cone);
      ctx.closePath();
      ctx.fill();
      const edgeCol = tight > 0.7 ? 'rgba(111,214,255,.9)' : `rgba(224,72,62,${0.35 + (1-tight)*0.4})`;
      ctx.strokeStyle = edgeCol;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(baseA - cone)*coneLen, p.y + Math.sin(baseA - cone)*coneLen);
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(baseA + cone)*coneLen, p.y + Math.sin(baseA + cone)*coneLen);
      ctx.stroke();

      const cx2 = hitDist <= range ? hit.x : p.x + dx*range;
      const cy2 = hitDist <= range ? hit.y : p.y + dy*range;
      ctx.strokeStyle = 'rgba(111,214,255,.4)';
      ctx.setLineDash([8,8]);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(cx2, cy2);
      ctx.stroke();

      if((hit.nx || hit.ny) && hitDist <= range){
        let rx = dx, ry = dy;
        if(hit.nx) rx = -rx;
        if(hit.ny) ry = -ry;
        ctx.strokeStyle = 'rgba(111,214,255,.3)';
        ctx.beginPath();
        ctx.moveTo(hit.x, hit.y);
        ctx.lineTo(hit.x + rx*46, hit.y + ry*46);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // power ring (shooting only)
      ctx.strokeStyle = s.power > 0.85 ? '#e0483e' : '#d4a843';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 7, -Math.PI/2, -Math.PI/2 + s.power*Math.PI*2);
      ctx.stroke();
    }
  }

  // retrieval markers ride ABOVE the fog: objectives are intel, not sights
  if(s.extract && s.pkg && !s.pkg.delivered){
    const ex = s.extract;
    const spin2 = performance.now()/1400;
    ctx.strokeStyle = 'rgba(111,214,255,.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([12,8]);
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r, spin2, spin2 + Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "700 9px 'Space Grotesk',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(111,214,255,.65)';
    ctx.fillText('EXTRACTION', ex.x, ex.y - ex.r - 6);
  }
  if(s.pkg && !s.pkg.delivered && !s.pkgFound && s.pkgSites){
    // intel overlay: candidate sites, amber rumours, grey struck-out clears
    const qp = 1 + Math.sin(performance.now()/400)*0.1;
    for(const site of s.pkgSites){
      if(site.cleared){
        ctx.save();
        ctx.translate(site.x, site.y);
        ctx.rotate(0.785);
        ctx.strokeStyle = 'rgba(140,140,150,.4)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-6, -6, 12, 12);
        ctx.restore();
        ctx.strokeStyle = 'rgba(224,72,62,.65)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(site.x - 6, site.y - 6); ctx.lineTo(site.x + 6, site.y + 6);
        ctx.moveTo(site.x + 6, site.y - 6); ctx.lineTo(site.x - 6, site.y + 6);
        ctx.stroke();
        ctx.font = "700 7px 'Space Grotesk',sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(140,140,150,.6)';
        ctx.fillText('CLEAR', site.x, site.y + 16);
      }else{
        ctx.save();
        ctx.translate(site.x, site.y);
        ctx.rotate(0.785);
        ctx.strokeStyle = 'rgba(224,163,62,.75)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-6*qp, -6*qp, 12*qp, 12*qp);
        ctx.restore();
        ctx.font = "700 10px 'Space Grotesk',sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(224,163,62,.85)';
        ctx.fillText('?', site.x, site.y + 3.5);
      }
    }
  }
  if(s.pkg && !s.pkg.delivered && s.pkgFound){
    if(!s.pkg.carried){
      const pk = s.pkg;
      const pp = 1 + Math.sin(performance.now()/300)*0.12;
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.rotate(0.785);
      ctx.fillStyle = 'rgba(212,168,67,.9)';
      ctx.fillRect(-6*pp, -6*pp, 12*pp, 12*pp);
      ctx.strokeStyle = 'rgba(232,224,204,.8)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-6*pp, -6*pp, 12*pp, 12*pp);
      ctx.restore();
      const glow = ctx.createRadialGradient(pk.x, pk.y, 4, pk.x, pk.y, 26);
      glow.addColorStop(0, 'rgba(212,168,67,.35)');
      glow.addColorStop(1, 'rgba(212,168,67,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(pk.x, pk.y, 26, 0, 7);
      ctx.fill();
      ctx.font = "700 8px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(212,168,67,.75)';
      ctx.fillText('PACKAGE', pk.x, pk.y + 22);
    }else if(s.pkg.carried.alive){
      const cc = s.pkg.carried;
      ctx.save();
      ctx.translate(cc.x + cc.r + 6, cc.y - cc.r - 4);
      ctx.rotate(0.785);
      ctx.fillStyle = 'rgba(212,168,67,.9)';
      ctx.fillRect(-4, -4, 8, 8);
      ctx.restore();
    }
  }
  if(TUNE.fog){
    for(const e of s.enemies){
      if(!e.alive || e.visible || !e.lastSeen) continue;
      const arch = ARCHETYPES[e.type];
      ctx.strokeStyle = arch.color;
      ctx.globalAlpha = 0.3;
      ctx.setLineDash([4,4]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(e.lastSeen.x, e.lastSeen.y, e.r, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "700 10px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = arch.color;
      ctx.fillText('?', e.lastSeen.x, e.lastSeen.y + 3.5);
      ctx.globalAlpha = 1;
    }
  }

  // squad, with running gait, distinct silhouettes, and a selection ring
  for(const c of s.squad){
    if(!c.alive) continue;
    let pbY = 0, pLeanX = 0, pLeanY = 0;
    if(c.moving && c.run){
      pbY = -Math.abs(Math.sin(c.run.stride * 0.11)) * 2.4;
      pLeanX = (c.run.dirX||0) * 1.8; pLeanY = (c.run.dirY||0) * 1.8;
    }
    const pdx = c.x + pLeanX, pdy = c.y + pbY + pLeanY;

    // in cover: a quiet shield says the sandbags count
    if(c.alive && !c.ko && hugsCoverAt(c.x, c.y, c.r)){
      drawShield(pdx - c.r - 8, pdy - c.r - 4, 5.5, 'rgba(111,214,255,.7)');
    }

    // exposed: the flash still hangs on you, everyone can see it
    if(c.alive && c.exposed){
      const espin = performance.now()/500;
      const epulse = 0.6 + Math.sin(performance.now()/180)*0.35;
      ctx.strokeStyle = `rgba(224,72,62,${epulse})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([6,6]);
      ctx.beginPath();
      ctx.arc(pdx, pdy, c.r + 15, espin, espin + 7);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "700 8px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(224,72,62,${0.5 + epulse*0.4})`;
      ctx.fillText('EXPOSED', pdx, pdy - c.r - 28);
    }

    // the downed: a sprawl on the stone with a countdown over it
    if(c.alive && c.downed){
      const dflash = 0.35 + Math.abs(Math.sin(performance.now() / 300)) * 0.65;
      // the empty battery, flashing red: no clearer way to say DOWN
      ctx.strokeStyle = `rgba(224,72,62,${dflash})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pdx, pdy, c.r + 9, 0, 7); ctx.stroke();
      ctx.fillStyle = `rgba(224,72,62,${dflash * 0.16})`;
      ctx.beginPath(); ctx.arc(pdx, pdy, c.r + 9, 0, 7); ctx.fill();
      ctx.save();
      ctx.translate(pdx, pdy);
      ctx.rotate(0.9);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#20283f';
      ctx.beginPath(); ctx.ellipse(0, 0, c.r + 3, c.r * 0.55, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, c.r + 3, c.r * 0.55, 0, 0, 7); ctx.stroke();
      ctx.restore();
      const dpulse = 0.6 + Math.sin(performance.now() / 260) * 0.4;
      ctx.font = "800 17px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(224,72,62,${dpulse})`;
      ctx.shadowColor = 'rgba(11,14,22,.9)';
      ctx.shadowBlur = 6;
      ctx.fillText(String(c.downTimer), pdx, pdy - c.r - 14);
      ctx.font = "700 8px 'Space Grotesk',sans-serif";
      ctx.fillStyle = 'rgba(232,224,204,.9)';
      ctx.fillText(c.name.toUpperCase() + ', DOWN, REACH THEM', pdx, pdy + c.r + 16);
      ctx.shadowBlur = 0;
      continue;   // a downed body wears none of the standing layers below
    }

    // the hood comes off: live states in a glance
    if(c.alive && !c.ko && !c.downed) drawStatusIcons(c, pdx, pdy + c.r + 16);

    // selection: a glow you can't miss, in the character's own colour
    if(c === p && s.phase === 'player' && !s.over){
      const pulse = 1 + Math.sin(performance.now()/240)*0.06;
      const col = c.color || '#d4a843';
      const glow = ctx.createRadialGradient(pdx, pdy, c.r, pdx, pdy, c.r + 20);
      glow.addColorStop(0, col + '55');
      glow.addColorStop(1, col + '00');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(pdx, pdy, c.r + 20, 0, 7);
      ctx.fill();
      // solid ring
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(pdx, pdy, (c.r + 7) * pulse, 0, 7);
      ctx.stroke();
      // rotating dash accent just outside it
      const spin = performance.now()/700;
      ctx.strokeStyle = 'rgba(232,224,204,.65)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([7, 16]);
      ctx.beginPath();
      ctx.arc(pdx, pdy, (c.r + 12) * pulse, spin, spin + 7);
      ctx.stroke();
      ctx.setLineDash([]);
      // chevron overhead, bobbing
      const bob = Math.sin(performance.now()/300) * 2;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(pdx, pdy - c.r - 16 + bob);
      ctx.lineTo(pdx - 5, pdy - c.r - 23 + bob);
      ctx.lineTo(pdx + 5, pdy - c.r - 23 + bob);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = '#20283f';
    ctx.beginPath(); ctx.arc(pdx, pdy, c.r, 0, 7); ctx.fill();
    if(c.alive && !c.ko){
      if(c.ap >= 2){
        ctx.fillStyle = c.color;
        ctx.beginPath(); ctx.arc(pdx, pdy, c.r - 1, 0, 7); ctx.fill();
      }else if(c.ap === 1){
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(pdx, pdy, c.r - 1, Math.PI, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.strokeStyle = c.hitFlash > 0 ? `rgba(255,255,255,${0.4+c.hitFlash*0.6})` : c.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pdx, pdy, c.r, 0, 7); ctx.stroke();
    if(c.morale === 'broken'){
      // huddled and dim
      ctx.fillStyle = 'rgba(11,14,26,.5)';
      ctx.beginPath(); ctx.arc(pdx, pdy, c.r, 0, 7); ctx.fill();
    }
    drawMoraleGlyph(c, pdx, pdy);

    // silhouette rotates with facing (drawn as if facing "up"); the broken huddle
    if(c.morale !== 'broken'){
      ctx.save();
      ctx.translate(pdx, pdy);
      ctx.rotate(c.facing + Math.PI/2);
      ctx.strokeStyle = '#e8e0cc';
      ctx.shadowColor = 'rgba(11,14,22,.9)';
      ctx.shadowBlur = 3;
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      if(c.kind === 'minotaur'){
        // the horns
        ctx.moveTo(-8.5, -5); ctx.quadraticCurveTo(-13, -11, -8.5, -14.5);
        ctx.moveTo(8.5, -5);  ctx.quadraticCurveTo(13, -11, 8.5, -14.5);
      }else if(c.kind === 'amarok'){
        // the ears, pricked forward
        ctx.moveTo(-6, -c.r+3); ctx.lineTo(-9.5, -c.r-6); ctx.lineTo(-2.5, -c.r+1);
        ctx.moveTo(6, -c.r+3);  ctx.lineTo(9.5, -c.r-6);  ctx.lineTo(2.5, -c.r+1);
      }else if(c.kind === 'human'){
        // the visor line: standard-issue, unglamorous, hers
        ctx.moveTo(-8, -3); ctx.lineTo(8, -3);
        ctx.moveTo(-8, -3); ctx.lineTo(-8, 1);
        ctx.moveTo(8, -3);  ctx.lineTo(8, 1);
      }else{
        // the cloak's fall: the vampire
        ctx.moveTo(-8, 1); ctx.lineTo(-11.5, 11);
        ctx.moveTo(8, 1);  ctx.lineTo(11.5, 11);
        ctx.moveTo(0, -c.r+1); ctx.lineTo(0, -c.r+5);
      }
      ctx.stroke();
      ctx.restore();
    }

    // integrity ring
    const pf = Math.max(0, c.hp / c.maxHp);
    ctx.strokeStyle = pf > 0.4 ? '#6fd6ff' : '#e0483e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pdx, pdy, c.r + 4, -Math.PI/2, -Math.PI/2 + pf*Math.PI*2);
    ctx.stroke();
    // concealed behind low cover: harder to notice
    if(TUNE.fog && charConcealed(c)){
      ctx.strokeStyle = 'rgba(232,224,204,.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2,4]);
      ctx.beginPath();
      ctx.arc(pdx, pdy, c.r + 7, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // bullets + trails
  for(const b of s.bullets){
    const col = b.team === 'enemy' ? '#e0483e' : '#6fd6ff';
    for(let i=0;i<b.trail.length;i++){
      const tr = b.trail[i];
      ctx.globalAlpha = (i/b.trail.length) * 0.5;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, (b.r*0.7)*(i/b.trail.length)+0.5, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r+2, 0, 7); ctx.stroke();
  }

  // particles
  for(const pt of s.particles){
    ctx.globalAlpha = 1 - pt.t/pt.life;
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // damage popups
  ctx.textAlign = 'center';
  ctx.font = "700 15px 'Space Grotesk',sans-serif";
  for(const pp of s.popups){
    ctx.globalAlpha = 1 - (pp.t/pp.life)*(pp.t/pp.life);
    ctx.fillStyle = pp.color;
    ctx.fillText(pp.txt, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;

  // the range prompt: one big instruction, nothing competing with it
  if(s.range && s.rangePhase){
    const hero = s.squad[0];
    const LINES = {
      aim:   ['CLICK YOUR OPERATIVE AND PULL BACK', ''],
      cone:  ['THE CONE IS THEIR BREATHING · IT TIGHTENS AS THEY STEADY.', 'THE FURTHER YOU PULL, THE HARDER YOUR SHOTS HIT. RELEASE TO FIRE DOWN THE CONE.'],
      again: ['AGAIN, RELEASE AT THE TIGHTEST BREATH.', ''],
      move:  ['NOW MOVE, CLICK THE GROUND AND DRAG A PATH.', 'THE PATH BENDS AROUND COVER. RELEASE TO COMMIT.'],
      play:  ['PRACTICE MOVING AND SHOOTING AND MOP UP THESE TARGETS.', 'WHEN YOU\'RE READY, MOVE BRAM TO THE EXTRACTION ZONE.'],
      complete: ['TUTORIAL COMPLETE', 'REPORT TO THE BRIEFING ROOM'],
    };
    const [l1, l2] = LINES[s.rangePhase] || ['', ''];
    const rpElapsed = performance.now() - (s.rangePhaseAt || 0);
    const rpK = Math.min(1, rpElapsed / 380);
    const rpEase = 1 - Math.pow(1 - rpK, 3);
    const rpScale = 1.55 - 0.55 * rpEase;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(11,14,22,.78)';
    ctx.fillRect(0, 96, W, l2 ? 92 : 66);
    ctx.globalAlpha = rpEase;
    ctx.translate(W/2, 150);
    ctx.scale(rpScale, rpScale);
    ctx.translate(-W/2, -150);
    ctx.font = "700 25px 'Cinzel', serif";
    ctx.fillStyle = '#d4a843';
    ctx.shadowColor = 'rgba(212,168,67,' + (0.5 + 0.4 * (1 - rpEase)) + ')';
    ctx.shadowBlur = 14 + 22 * (1 - rpEase);
    ctx.fillText(l1, W/2, 138);
    if(l2){
      ctx.font = "700 18px 'Cinzel', serif";
      ctx.fillStyle = s.rangePhase === 'done' ? '#6fd6ff' : '#e8e0cc';
      ctx.fillText(l2, W/2, 172);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = 1;
    // the extraction zone: the tutorial's end point, drawn like the real thing
    if(s.rangePhase === 'play' && s.rangeExtract){
      const ez = s.rangeExtract;
      const spin = performance.now() / 1400;
      const breathe = 1 + Math.sin(performance.now() / 500) * 0.05;
      ctx.strokeStyle = 'rgba(111,214,255,.75)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([14, 10]);
      ctx.lineDashOffset = -performance.now() / 30;
      ctx.beginPath();
      ctx.arc(ez.x, ez.y, ez.r * breathe, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(111,214,255,.10)';
      ctx.beginPath();
      ctx.arc(ez.x, ez.y, ez.r * breathe, 0, 7);
      ctx.fill();
      ctx.strokeStyle = 'rgba(111,214,255,.5)';
      ctx.lineWidth = 1.2;
      for(let a2 = 0; a2 < 4; a2++){
        const aa = spin + a2 * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(ez.x + Math.cos(aa) * ez.r * 0.55, ez.y + Math.sin(aa) * ez.r * 0.55);
        ctx.lineTo(ez.x + Math.cos(aa) * ez.r * 0.82, ez.y + Math.sin(aa) * ez.r * 0.82);
        ctx.stroke();
      }
      ctx.font = "800 13px 'Space Grotesk', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(111,214,255,.95)';
      ctx.shadowColor = 'rgba(11,14,22,.9)';
      ctx.shadowBlur = 6;
      ctx.fillText('EXTRACTION', ez.x, ez.y + ez.r + 22);
      ctx.shadowBlur = 0;
    }

    // the arrow: from the words to the one who acts
    if(s.rangePhase === 'aim' && hero){
      const bob = Math.sin(performance.now() / 280) * 9;
      const ax = hero.x, topY = 200, botY = hero.y - hero.r - 44 + bob;
      ctx.strokeStyle = '#d4a843';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -performance.now() / 24;
      ctx.beginPath();
      ctx.moveTo(W/2, topY);
      ctx.quadraticCurveTo(W/2, (topY + botY) / 2, ax, botY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#d4a843';
      ctx.beginPath();
      ctx.moveTo(ax, botY + 16);
      ctx.lineTo(ax - 10, botY - 2);
      ctx.lineTo(ax + 10, botY - 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // spoken lines: comic captions pinned to their speakers
  if(s.barks){
    ctx.save();
    ctx.font = "italic 600 12px 'Space Grotesk', sans-serif";
    ctx.textAlign = 'left';
    s.barks.forEach((bk, bi) => {
      const c = bk.c;
      const fade = bk.t > bk.life - 0.45 ? (bk.life - bk.t) / 0.45 : 1;
      ctx.globalAlpha = Math.max(0, fade);
      const txt = '\u201c' + bk.txt + '\u201d';
      const tw = ctx.measureText(txt).width;
      const mate = state.squad.find(w => w !== c && w.alive);
      const side = mate ? (c.x >= mate.x ? 1 : -1)                 // open away from the partner
                        : ((state.squad.indexOf(c) % 2 === 0) ? 1 : -1);
      let bx = c.x + side * (c.r + 22);
      const by = c.y - c.r - 34 - (bi % 2) * 6;
      if(side < 0) bx -= tw + 20;
      bx = Math.max(6, Math.min(W - tw - 26, bx));
      const bw = tw + 20, bh = 24;
      // connector: from the box's near corner to the shoulder
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(side > 0 ? bx + 2 : bx + bw - 2, by + bh);
      ctx.lineTo(c.x + side * c.r * 0.5, c.y - c.r * 0.7);
      ctx.stroke();
      // the caption box
      ctx.fillStyle = 'rgba(11,14,22,.93)';
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 3);
      else ctx.rect(bx, by, bw, bh);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#e8e0cc';
      ctx.fillText(txt, bx + 10, by + 16);
    });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // kill flash
  if(s.flash > 0){
    ctx.fillStyle = `rgba(232,224,204,${s.flash*0.25})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();

  if(s.phase === 'enemy' && s.worldBeatT && performance.now() > s.worldBeatT){
    s.worldBeatT = 0;
    endEnemyTurn();   // the concourse has had its beat
  }
  if(s.phase === 'enemy' && !s.over) drawEnemyTurnFrame();
  if(s.boardingSetup && s.phase === 'player' && !s.over) drawSetupPrompt();
}

function fmtVal(f, v){
  let shown = v;
  if(f.deg) shown = v/DEG;
  if(f.pct) shown = v*100;
  return f.step >= 1 ? Math.round(shown) : +shown.toFixed(2);
}

function makeRow(f, obj){
  if(obj[f.k] === undefined) obj[f.k] = (f.min !== undefined ? f.min : 0);   // never let a missing key kill the panel
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  const name = document.createElement('span');
  name.textContent = f.label;
  const val = document.createElement('b');
  val.textContent = fmtVal(f, obj[f.k]);
  lab.appendChild(name); lab.appendChild(val);
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = f.min; slider.max = f.max; slider.step = f.step;
  slider.value = f.deg ? obj[f.k]/DEG : (f.pct ? obj[f.k]*100 : obj[f.k]);
  slider.addEventListener('input', () => {
    const raw = parseFloat(slider.value);
    obj[f.k] = f.deg ? raw*DEG : (f.pct ? raw/100 : raw);
    val.textContent = fmtVal(f, obj[f.k]);
  });
  row.appendChild(lab); row.appendChild(slider);
  return row;
}

function addSection(titleTxt, fields, obj){
  const sect = document.createElement('div');
  sect.className = 'sect';
  const h2 = document.createElement('h2');
  h2.textContent = titleTxt;
  sect.appendChild(h2);
  for(const f of fields) sect.appendChild(makeRow(f, obj));
  tunePanel.appendChild(sect);
}

  tunePanel.appendChild(h);
  const w = WEAPONS[pc().weapon];
  for(const f of WPN_FIELDS) tunePanel.appendChild(makeRow(f, w));

  // squad: character tabs, then the six stats
  const ssect = document.createElement('div');
  ssect.className = 'sect';
  const sh2 = document.createElement('h2');
  sh2.textContent = 'Squad';

// a docked hatch is a door: carve the wall beneath it (fractions in, fractions out)
function carveDoorF(walls, a, PW, PH, gapPx){
  const gx = gapPx / PW, gy = gapPx / PH;
  for(let i = 0; i < walls.length; i++){
    const w = walls[i];
    if(a.x < w.x - 0.002 || a.x > w.x + w.w + 0.002 || a.y < w.y - 0.002 || a.y > w.y + w.h + 0.002) continue;
    const horiz = a.side === 'N' || a.side === 'S';
    const out = [];
    if(horiz){
      if(a.x - gx/2 - w.x > 0.001) out.push({...w, w: (a.x - gx/2) - w.x});
      if(w.x + w.w - (a.x + gx/2) > 0.001) out.push({...w, x: a.x + gx/2, w: w.x + w.w - (a.x + gx/2)});
    }else{
      if(a.y - gy/2 - w.y > 0.001) out.push({...w, h: (a.y - gy/2) - w.y});
      if(w.y + w.h - (a.y + gy/2) > 0.001) out.push({...w, y: a.y + gy/2, h: w.y + w.h - (a.y + gy/2)});
    }
    walls.splice(i, 1, ...out);
    return true;
  }
  return false;
}

function buildDistrict(def, node, dname){
  const PW = (def.world && def.world.w) || 5600, PH = (def.world && def.world.h) || 3520;
  return {
    name: (node && node.name ? (node.port ? node.port + ', ' + node.name : node.name) : def.name || 'Port') + (dname ? ', ' + dname : ''),
    par: 0, brief: '',

    world: {w: PW, h: PH},
    ship: false, noFog: def.noFog !== false,
    walls: (def.walls || []).map(w => ({...w})),

    npcs: (def.npcs || []).map(n2 => ({...n2})),

function embedShipInPort(def, node){

function nearestHighWallPoint(level, px, py, maxD){
  let best = null;
  for(const w of level.walls){
    if(!w.high) continue;
    const r = {x: w.x*W, y: w.y*H, w: Math.max(14, w.w*W), h: Math.max(14, w.h*H)};
    const cx = Math.max(r.x, Math.min(px, r.x + r.w));
    const cy = Math.max(r.y, Math.min(py, r.y + r.h));
    // push the clamped point to the rect's perimeter and name the face
    const dl = Math.abs(cx - r.x), dr = Math.abs(r.x + r.w - cx);
    const dt = Math.abs(cy - r.y), db = Math.abs(r.y + r.h - cy);
    const m = Math.min(dl, dr, dt, db);
    let ex = cx, ey = cy, side;
    if(m === dl){ ex = r.x; side = 'W'; }
    else if(m === dr){ ex = r.x + r.w; side = 'E'; }
    else if(m === dt){ ey = r.y; side = 'N'; }
    else { ey = r.y + r.h; side = 'S'; }
    const d = Math.hypot(px - ex, py - ey);
    if(d <= maxD && (!best || d < best.d)) best = {x: ex, y: ey, side, d};
  }
  return best;
}

// --- hit testing (fractions -> px) ---
function edWallRect(w){
  return {x: w.x*W, y: w.y*H, w: Math.max(14, w.w*W), h: Math.max(14, w.h*H)};
}
function edHitTest(px, py){
  // package sites and extraction first, then enemies, player, walls
  if(Array.isArray(customLevel.package)){
    for(let i=customLevel.package.length-1; i>=0; i--){
      const k = customLevel.package[i];
      if(Math.hypot(k.x*W - px, k.y*H - py) < 15) return {type:'pkg', idx:i};
    }
  }
  if(customLevel.extract){
    const ex = customLevel.extract;
    if(Math.hypot(ex.x*W - px, ex.y*H - py) < 20) return {type:'extract', idx:0};
  }
  if(Array.isArray(customLevel.burrows)){
    for(let i=customLevel.burrows.length-1; i>=0; i--){
      const b = customLevel.burrows[i];
      if(Math.hypot(b.x*W - px, b.y*H - py) < 18) return {type:'burrow', idx:i};
    }
  }
  if(customLevel.pad && Math.hypot(customLevel.pad.x*W - px, customLevel.pad.y*H - py) < 22)
    return {type:'pad'};
  if(Array.isArray(customLevel.npcs)){
    for(let i=customLevel.npcs.length-1; i>=0; i--){
      const n2 = customLevel.npcs[i];
      if(Math.hypot(n2.x*W - px, n2.y*H - py) < 15) return {type:'npc', idx:i};
    }
  }
  if(Array.isArray(customLevel.doors)){
    for(let i=customLevel.doors.length-1; i>=0; i--){
      const d2 = customLevel.doors[i];
      if(Math.hypot(d2.x*W - px, d2.y*H - py) < 16) return {type:'door', idx:i};
    }
  }
  if(Array.isArray(customLevel.spots)){
    for(let i=customLevel.spots.length-1; i>=0; i--){
      const s2 = customLevel.spots[i];
      if(Math.hypot(s2.x*W - px, s2.y*H - py) < 14) return {type:'spot', idx:i};
    }
  }
  if(Array.isArray(customLevel.patrols)){
    for(let i=customLevel.patrols.length-1; i>=0; i--)
      for(let j=customLevel.patrols[i].length-1; j>=0; j--){
        const pt = customLevel.patrols[i][j];
        if(Math.hypot(pt.x*W - px, pt.y*H - py) < 13) return {type:'patrol', idx:i, pt:j};
      }
  }
  if(Array.isArray(customLevel.stations)){
    for(let i=customLevel.stations.length-1; i>=0; i--){
      const st = customLevel.stations[i];
      if(Math.hypot(st.x*W - px, st.y*H - py) < 17) return {type:'term', idx:i};
    }
  }
  if(Array.isArray(customLevel.airlocks)){
    for(let i=customLevel.airlocks.length-1; i>=0; i--){
      const a = customLevel.airlocks[i];
      if(Math.hypot(a.x*W - px, a.y*H - py) < 15) return {type:'airlock', idx:i};
    }
  }
  for(let i=customLevel.enemies.length-1; i>=0; i--){
    const e = customLevel.enemies[i];
    if(Math.hypot(e.x*W - px, e.y*H - py) < 17) return {type:'enemy', idx:i};
  }
  const pl = customLevel.player;
  if(Math.hypot(pl.x*W - px, pl.y*H - py) < 18) return {type:'player', idx:0};
  for(let i=customLevel.walls.length-1; i>=0; i--){
    const r = edWallRect(customLevel.walls[i]);
    if(px >= r.x && px <= r.x+r.w && py >= r.y && py <= r.y+r.h) return {type:'wall', idx:i};
  }
  return null;
}

// --- pointer handlers ---
function edDown(p){
  ed.cursor = p;
  if(ed.tool === 'wall' || ed.tool === 'hwall'){
    ed.drawing = {x0:p.x, y0:p.y, x1:p.x, y1:p.y, high: ed.tool === 'hwall'};
  }else if(ed.tool === 'enemy'){
    customLevel.enemies.push({x: p.x/W, y: p.y/H, type:'soldier', hp: ARCHETYPES.soldier.hp});
    ed.selected = {type:'enemy', idx: customLevel.enemies.length-1};
    renderEdPanel();
  }else if(ed.tool === 'term'){
    if(!Array.isArray(customLevel.stations)) customLevel.stations = [];
    customLevel.stations.push({x: p.x/W, y: p.y/H, id: 'bridge'});
    ed.selected = {type:'term', idx: customLevel.stations.length-1};
    renderEdPanel();
  }else if(ed.tool === 'pad'){
    customLevel.pad = {x: p.x/W, y: p.y/H};        // one pad: placing again moves it
    ed.selected = {type: 'pad'};
    renderEdPanel();
  }else if(ed.tool === 'npc'){
    if(!Array.isArray(customLevel.npcs)) customLevel.npcs = [];
    customLevel.npcs.push({x: p.x/W, y: p.y/H, kind: 'civ'});
    ed.selected = {type: 'npc', idx: customLevel.npcs.length-1};
    renderEdPanel();
  }else if(ed.tool === 'door'){
    if(!Array.isArray(customLevel.doors)) customLevel.doors = [];
    customLevel.doors.push({x: p.x/W, y: p.y/H});
    ed.selected = {type: 'door', idx: customLevel.doors.length-1};
    renderEdPanel();
  }else if(ed.tool === 'spot'){
    if(!Array.isArray(customLevel.spots)) customLevel.spots = [];
    customLevel.spots.push({x: p.x/W, y: p.y/H, kind: 'shop'});
    ed.selected = {type: 'spot', idx: customLevel.spots.length-1};
    renderEdPanel();
  }else if(ed.tool === 'patrol'){
    if(!Array.isArray(customLevel.patrols)) customLevel.patrols = [];
    if(!customLevel.patrols.length || ed.patrolNew){ customLevel.patrols.push([]); ed.patrolNew = false; }
    customLevel.patrols[customLevel.patrols.length-1].push({x: p.x/W, y: p.y/H});
    ed.selected = {type: 'patrol', idx: customLevel.patrols.length-1};
    renderEdPanel();
  }else if(ed.tool === 'airlock'){
    const hit = nearestHighWallPoint(customLevel, p.x, p.y, 80);
    if(hit){
      if(!Array.isArray(customLevel.airlocks)) customLevel.airlocks = [];
      customLevel.airlocks.push({x: hit.x/W, y: hit.y/H, side: hit.side});
      ed.selected = {type:'airlock', idx: customLevel.airlocks.length-1};
      renderEdPanel();
    }else{
      ed.msg = 'AIRLOCK NEEDS A HIGH WALL';
      ed.msgT = performance.now() + 1500;
    }
  }else if(ed.tool === 'player'){
    customLevel.player = {x: p.x/W, y: p.y/H};
  }else if(ed.tool === 'pkg'){
    if(!Array.isArray(customLevel.package)) customLevel.package = [];
    customLevel.package.push({x: p.x/W, y: p.y/H});
    renderEdPanel();
  }else if(ed.tool === 'extract'){
    customLevel.extract = {x: p.x/W, y: p.y/H, r: 0.075};
    renderEdPanel();
  }else if(ed.tool === 'burrow'){
    if(!Array.isArray(customLevel.burrows)) customLevel.burrows = [];
    customLevel.burrows.push({x: p.x/W, y: p.y/H});
    renderEdPanel();
  }else if(ed.tool === 'move'){
    const hit = edHitTest(p.x, p.y);
    ed.selected = hit;
    if(hit){
      let ox=0, oy=0;
      if(hit.type === 'wall'){
        const w = customLevel.walls[hit.idx];
        ox = p.x - w.x*W; oy = p.y - w.y*H;
      }else if(hit.type === 'enemy'){
        const e = customLevel.enemies[hit.idx];
        ox = p.x - e.x*W; oy = p.y - e.y*H;
      }else if(hit.type === 'pkg'){
        const k = customLevel.package[hit.idx];
        ox = p.x - k.x*W; oy = p.y - k.y*H;
      }else if(hit.type === 'extract'){
        ox = p.x - customLevel.extract.x*W; oy = p.y - customLevel.extract.y*H;
      }else if(hit.type === 'burrow'){
        const b = customLevel.burrows[hit.idx];
        ox = p.x - b.x*W; oy = p.y - b.y*H;
      }else if(hit.type === 'term'){
        const st = customLevel.stations[hit.idx];
        ox = p.x - st.x*W; oy = p.y - st.y*H;
      }else if(hit.type === 'pad'){
        ox = p.x - customLevel.pad.x*W; oy = p.y - customLevel.pad.y*H;
      }else if(hit.type === 'npc'){
        const n2 = customLevel.npcs[hit.idx];
        ox = p.x - n2.x*W; oy = p.y - n2.y*H;
      }else if(hit.type === 'door'){
        const d2 = customLevel.doors[hit.idx];
        ox = p.x - d2.x*W; oy = p.y - d2.y*H;
      }else if(hit.type === 'spot'){
        const s2 = customLevel.spots[hit.idx];
        ox = p.x - s2.x*W; oy = p.y - s2.y*H;
      }else if(hit.type === 'patrol'){
        const pt = customLevel.patrols[hit.idx][hit.pt];
        ox = p.x - pt.x*W; oy = p.y - pt.y*H;
      }else if(hit.type === 'airlock'){
        ox = 0; oy = 0;                          // the hatch rides the cursor and re-snaps
      }else{
        ox = p.x - customLevel.player.x*W; oy = p.y - customLevel.player.y*H;
      }
      ed.dragging = {...hit, ox, oy};
    }
    renderEdPanel();
  }else if(ed.tool === 'erase'){
    const hit = edHitTest(p.x, p.y);
    if(hit){
      if(hit.type === 'enemy') customLevel.enemies.splice(hit.idx, 1);
      else if(hit.type === 'term') customLevel.stations.splice(hit.idx, 1);
      else if(hit.type === 'pad') customLevel.pad = null;
      else if(hit.type === 'npc') customLevel.npcs.splice(hit.idx, 1);
      else if(hit.type === 'door') customLevel.doors.splice(hit.idx, 1);
      else if(hit.type === 'spot') customLevel.spots.splice(hit.idx, 1);
      else if(hit.type === 'patrol'){
        customLevel.patrols[hit.idx].splice(hit.pt, 1);
        if(!customLevel.patrols[hit.idx].length) customLevel.patrols.splice(hit.idx, 1);
      }
      else if(hit.type === 'airlock') customLevel.airlocks.splice(hit.idx, 1);
      else if(hit.type === 'wall') customLevel.walls.splice(hit.idx, 1);
      else if(hit.type === 'pkg') customLevel.package.splice(hit.idx, 1);
      else if(hit.type === 'burrow') customLevel.burrows.splice(hit.idx, 1);
      else if(hit.type === 'extract') customLevel.extract = null;
      ed.selected = null;
      renderEdPanel();
    }
  }
}
function edMove(p){
  ed.cursor = p;
  if(ed.drawing){
    ed.drawing.x1 = p.x; ed.drawing.y1 = p.y;
  }else if(ed.dragging){
    const d = ed.dragging;
    const nx = (p.x - d.ox), ny = (p.y - d.oy);
    if(d.type === 'wall'){
      customLevel.walls[d.idx].x = nx/W;
      customLevel.walls[d.idx].y = ny/H;
    }else if(d.type === 'enemy'){
      customLevel.enemies[d.idx].x = Math.max(0, Math.min(1, nx/W));
      customLevel.enemies[d.idx].y = Math.max(0, Math.min(1, ny/H));
    }else if(d.type === 'pkg'){
      customLevel.package[d.idx].x = Math.max(0, Math.min(1, nx/W));
      customLevel.package[d.idx].y = Math.max(0, Math.min(1, ny/H));
    }else if(d.type === 'extract'){
      customLevel.extract.x = Math.max(0, Math.min(1, nx/W));
      customLevel.extract.y = Math.max(0, Math.min(1, ny/H));
    }else if(d.type === 'burrow'){
      customLevel.burrows[d.idx].x = Math.max(0, Math.min(1, nx/W));
      customLevel.burrows[d.idx].y = Math.max(0, Math.min(1, ny/H));
    }else if(d.type === 'term'){
      customLevel.stations[d.idx].x = Math.max(0, Math.min(1, nx/W));
      customLevel.stations[d.idx].y = Math.max(0, Math.min(1, ny/H));
    }else if(d.type === 'pad'){
      customLevel.pad.x = Math.max(0, Math.min(1, nx/W));

      customLevel.npcs[d.idx].x = Math.max(0, Math.min(1, nx/W));
      customLevel.npcs[d.idx].y = Math.max(0, Math.min(1, ny/H));

      customLevel.patrols[d.idx][d.pt].y = Math.max(0, Math.min(1, ny/H));
