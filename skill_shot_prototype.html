      customLevel.player.x = Math.max(0, Math.min(1, nx/W));
      customLevel.player.y = Math.max(0, Math.min(1, ny/H));
    }
  }
}
function edUp(){
  if(ed.drawing){
    const d = ed.drawing;
    const x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1);
    const w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
    if(w > 8 || h > 8){
      customLevel.walls.push({
        x: x/W, y: y/H,
        w: Math.max(14, w)/W,
        h: Math.max(14, h)/H,
        ...(d.high ? {high:true} : {})
      });
    }
    ed.drawing = null;
  }
  ed.dragging = null;
}

// --- panel UI ---
function edField(labelTxt, inputEl){
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  const name = document.createElement('span');
  name.textContent = labelTxt;
  lab.appendChild(name);
  row.appendChild(lab);
  row.appendChild(inputEl);
  return row;
}

function renderEdPanel(){
  edPanel.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = 'Level Designer';
  h.style.cursor = 'move';
  h.title = 'Drag to move this panel';
  h.addEventListener('pointerdown', (e) => {
    const r = edPanel.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    const mv = (e2) => {
      edPanel.style.left = (e2.clientX - ox) + 'px';
      edPanel.style.top = (e2.clientY - oy) + 'px';
      edPanel.style.right = 'auto';
    };
    const up = () => {
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up);
    e.preventDefault();
  });
  edPanel.appendChild(h);

  // tools
  const deckBtn = document.createElement('button');
  deckBtn.textContent = '⚓ Load The Orrix (deck plan)';
  deckBtn.style.cssText = 'width:100%;margin-bottom:8px;';
  deckBtn.addEventListener('click', () => {
    loadIntoEditor(SHIP_LEVEL);
    customLevel.name = 'The Orrix (deck edit)';
    ed.selected = null;
    renderEdPanel();
  });
  edPanel.appendChild(deckBtn);

  const tools = document.createElement('div');
  tools.className = 'edtools';
  [['wall','▭ Low Wall'],['hwall','█ High Wall'],['enemy','◉ Enemy'],['player','♞ Start'],['term','▣ Terminal'],['airlock','◧ Airlock'],['pad','⬡ Pad'],['npc','☺ Folk'],['door','◫ Door'],['spot','✦ Spot'],['patrol','⚐ Patrol'],['pkg','◈ Package'],['extract','⊚ Extract'],['burrow','◎ Burrow'],['move','✥ Move'],['erase','✕ Erase']].forEach(([t, txt]) => {
    const b = document.createElement('button');
    b.className = 'edtool' + (ed.tool === t ? ' active' : '');
    b.textContent = txt;
    b.addEventListener('click', () => { ed.tool = t; ed.selected = null; renderEdPanel(); });
    tools.appendChild(b);
  });
  edPanel.appendChild(tools);

  // name & par
  const nameIn = document.createElement('input');
  nameIn.type = 'text';
  nameIn.value = customLevel.name;
  nameIn.addEventListener('input', () => customLevel.name = nameIn.value || 'Custom');
  edPanel.appendChild(edField('Level name', nameIn));

  const parIn = document.createElement('input');
  parIn.type = 'number';
  parIn.min = 1; parIn.max = 12;
  parIn.value = customLevel.par;
  parIn.addEventListener('input', () => customLevel.par = parseInt(parIn.value) || 4);
  edPanel.appendChild(edField('Par (turns)', parIn));

  const crowdIn = document.createElement('input');
  crowdIn.type = 'number';
  crowdIn.min = 0; crowdIn.max = 60;
  crowdIn.value = customLevel.crowd || '';
  crowdIn.placeholder = '0';
  crowdIn.addEventListener('input', () => {
    const v = parseInt(crowdIn.value);
    customLevel.crowd = (v && v > 0) ? Math.min(60, v) : 0;
  });
  edPanel.appendChild(edField('Crowd (folk in the tide, max 60)', crowdIn));

  if(ed.selected && ed.selected.type === 'spot' && Array.isArray(customLevel.spots) &&
     customLevel.spots[ed.selected.idx]){
    const sp = customLevel.spots[ed.selected.idx];
    const rowK = document.createElement('div');
    rowK.className = 'btnrow';
    for(const k of ['shop','bar','food','bench','stage','society']){
      const b = document.createElement('button');
      b.textContent = k.toUpperCase();
      b.style.opacity = (sp.kind === k) ? 1 : 0.45;
      b.addEventListener('click', () => { sp.kind = k; renderEdPanel(); });
      rowK.appendChild(b);
    }
    edPanel.appendChild(edField('Spot kind', rowK));
    const lblIn = document.createElement('input');
    lblIn.type = 'text';
    lblIn.value = sp.label || '';
    lblIn.placeholder = 'auto';
    lblIn.addEventListener('input', () => { sp.label = lblIn.value || undefined; });
    edPanel.appendChild(edField('Spot label', lblIn));
  }

  const cntIn = document.createElement('input');
  cntIn.type = 'number';
  cntIn.min = 1; cntIn.max = 40;
  cntIn.value = customLevel.enemyCount || '';
  cntIn.placeholder = 'all';
  cntIn.addEventListener('input', () => {
    const v = parseInt(cntIn.value);
    customLevel.enemyCount = (v && v > 0) ? v : null;
  });
  edPanel.appendChild(edField('Spawn count (of ' + customLevel.enemies.length + ' placed)', cntIn));

  // selected enemy: archetype + HP
  if(ed.selected && ed.selected.type === 'enemy' && customLevel.enemies[ed.selected.idx]){
    const e = customLevel.enemies[ed.selected.idx];
    const eType = e.type || 'soldier';

    const rowA = document.createElement('div');
    rowA.className = 'btnrow';
    for(const key of Object.keys(ARCHETYPES)){
      const b = document.createElement('button');
      b.textContent = ARCHETYPES[key].label;
      if(key === eType){ b.style.borderColor = ARCHETYPES[key].color; b.style.color = ARCHETYPES[key].color; }
      b.addEventListener('click', () => {
        e.type = key;
        e.hp = ARCHETYPES[key].hp;
        renderEdPanel();
      });
      rowA.appendChild(b);
    }
    edPanel.appendChild(rowA);

    const hpIn = document.createElement('input');
    hpIn.type = 'number';
    hpIn.min = 1; hpIn.max = 99;
    hpIn.value = e.hp || ARCHETYPES[eType].hp;
    hpIn.addEventListener('input', () => e.hp = parseInt(hpIn.value) || ARCHETYPES[eType].hp);
    edPanel.appendChild(edField('Selected enemy HP', hpIn));
  }

  // selected folk: who stands here?
  if(ed.selected && ed.selected.type === 'npc' && Array.isArray(customLevel.npcs) &&
     customLevel.npcs[ed.selected.idx]){
    const n2 = customLevel.npcs[ed.selected.idx];
    const rowN = document.createElement('div');
    rowN.className = 'btnrow';
    for(const kind of ['civ', 'worker', 'constable', 'barkeep', 'trader']){
      const b = document.createElement('button');
      b.textContent = kind.toUpperCase();
      if(kind === n2.kind){ b.style.borderColor = '#9fe08e'; b.style.color = '#9fe08e'; }
      b.addEventListener('click', () => { n2.kind = kind; renderEdPanel(); });
      rowN.appendChild(b);
    }
    edPanel.appendChild(rowN);
  }
  // patrol: start a fresh route with the next click
  if(ed.tool === 'patrol'){
    const nb = document.createElement('button');
    nb.textContent = '\u2690 New Route';
    nb.addEventListener('click', () => { ed.patrolNew = true; });
    const rowP = document.createElement('div');
    rowP.className = 'btnrow';
    rowP.appendChild(nb);
    edPanel.appendChild(rowP);
  }

  // selected terminal: which console is this?
  if(ed.selected && ed.selected.type === 'term' && Array.isArray(customLevel.stations) &&
     customLevel.stations[ed.selected.idx]){
    const st = customLevel.stations[ed.selected.idx];
    const rowS = document.createElement('div');
    rowS.className = 'btnrow';
    for(const id of Object.keys(STATION_LABELS)){
      const b = document.createElement('button');
      b.textContent = STATION_LABELS[id];
      if(id === st.id){ b.style.borderColor = '#d4a843'; b.style.color = '#d4a843'; }
      b.addEventListener('click', () => { st.id = id; renderEdPanel(); });
      rowS.appendChild(b);
    }
    edPanel.appendChild(rowS);
  }

  // a deck with terminals but no bridge cannot fly
  if(Array.isArray(customLevel.stations) && customLevel.stations.length &&
     !customLevel.stations.some(st => st.id === 'bridge')){
    const warn = document.createElement('div');
    warn.textContent = '\u26A0 NO BRIDGE TERMINAL: THE SHIP CANNOT FLY';
    warn.style.cssText = 'color:#e0a33e;font-size:10px;letter-spacing:.12em;margin:6px 0;';
    edPanel.appendChild(warn);
  }

  // selected wall type toggle
  if(ed.selected && ed.selected.type === 'wall' && customLevel.walls[ed.selected.idx]){
    const w = customLevel.walls[ed.selected.idx];
    const rowT = document.createElement('div');
    rowT.className = 'btnrow';
    const tog = document.createElement('button');
    tog.textContent = w.high ? 'Make Low Wall' : 'Make High Wall';
    tog.addEventListener('click', () => {
      if(w.high) delete w.high; else w.high = true;
      renderEdPanel();
    });
    rowT.appendChild(tog);
    edPanel.appendChild(rowT);
  }

  // actions
  const row1 = document.createElement('div');
  row1.className = 'btnrow';
  const test = document.createElement('button');
  test.className = 'go';
  test.textContent = '▶ Test';
  test.addEventListener('click', () => {
    if(!customLevel.enemies.length){ test.textContent = 'Add an enemy!'; setTimeout(()=>test.textContent='▶ Test', 1400); return; }
    usingCustom = true;
    editorOn = false;
    document.body.classList.remove('editing');
    edPanel.style.display = 'none';
    edBtn.textContent = '✎ Designer';
    advanceOnRestart = false;
    restart();
  });
  const clear = document.createElement('button');
  clear.textContent = 'Clear';
  clear.addEventListener('click', () => {
    customLevel.walls = []; customLevel.enemies = [];
    customLevel.player = {x:0.5, y:0.85};
    ed.selected = null;
    renderEdPanel();
  });
  row1.appendChild(test); row1.appendChild(clear);
  edPanel.appendChild(row1);

  const row2 = document.createElement('div');
  row2.className = 'btnrow';
  const exp = document.createElement('button');
  exp.textContent = 'Export';
  const imp = document.createElement('button');
  imp.textContent = 'Import';
  row2.appendChild(exp); row2.appendChild(imp);
  edPanel.appendChild(row2);

  // load an existing level as a starting point
  const row3 = document.createElement('div');
  row3.className = 'btnrow';
  const load = document.createElement('button');
  load.textContent = 'Load level ' + (levelIdx+1);
  load.addEventListener('click', () => {
    loadIntoEditor(LEVELS[levelIdx]);
    customLevel.name = LEVELS[levelIdx].name + ' (edit)';
    ed.selected = null;
    renderEdPanel();
  });
  row3.appendChild(load);
  edPanel.appendChild(row3);

  const box = document.createElement('textarea');
  box.id = 'edbox';
  edPanel.appendChild(box);

  exp.addEventListener('click', async () => {
    const out = {
      name: customLevel.name, par: customLevel.par,
      player: {x:+customLevel.player.x.toFixed(3), y:+customLevel.player.y.toFixed(3)},
      walls: customLevel.walls.map(w => ({
        x:+w.x.toFixed(3), y:+w.y.toFixed(3), w:+w.w.toFixed(3), h:+w.h.toFixed(3),
        ...(w.high ? {high:true} : {})
      })),
      enemies: customLevel.enemies.map(e => {
        const eType = e.type || 'soldier';
        return {
          x:+e.x.toFixed(3), y:+e.y.toFixed(3),
          ...(eType !== 'soldier' ? {type:eType} : {}),
          ...(e.hp && e.hp !== ARCHETYPES[eType].hp ? {hp:e.hp} : {}),
          ...(e.always ? {always:true} : {})
        };
      }),
      ...(Array.isArray(customLevel.stations) && customLevel.stations.length ? {stations:
        customLevel.stations.map(st => ({x:+st.x.toFixed(3), y:+st.y.toFixed(3), id: st.id}))} : {}),
      ...(Array.isArray(customLevel.airlocks) && customLevel.airlocks.length ? {airlocks:
        customLevel.airlocks.map(a => ({x:+a.x.toFixed(3), y:+a.y.toFixed(3), side: a.side}))} : {}),
      ...(customLevel.pad ? {pad: {x:+customLevel.pad.x.toFixed(3), y:+customLevel.pad.y.toFixed(3)}} : {}),
      ...(Array.isArray(customLevel.npcs) && customLevel.npcs.length ? {npcs:
        customLevel.npcs.map(n2 => ({x:+n2.x.toFixed(3), y:+n2.y.toFixed(3), kind: n2.kind}))} : {}),
      ...(Array.isArray(customLevel.patrols) && customLevel.patrols.length ? {patrols:
        customLevel.patrols.map(r => r.map(pt => ({x:+pt.x.toFixed(3), y:+pt.y.toFixed(3)})))} : {}),
      ...(customLevel.enemyCount ? {enemyCount: customLevel.enemyCount} : {}),
      ...(Array.isArray(customLevel.package) && customLevel.package.length ? {
        package: customLevel.package.map(k => ({x:+k.x.toFixed(3), y:+k.y.toFixed(3)}))
      } : {}),
      ...(customLevel.extract ? {
        extract: {x:+customLevel.extract.x.toFixed(3), y:+customLevel.extract.y.toFixed(3), r:+customLevel.extract.r.toFixed(3)}
      } : {}),
      ...(Array.isArray(customLevel.burrows) && customLevel.burrows.length ? {
        burrows: customLevel.burrows.map(b => ({x:+b.x.toFixed(3), y:+b.y.toFixed(3)})),
        ...(customLevel.calmEvery ? {calmEvery: customLevel.calmEvery, calmBrood: customLevel.calmBrood} : {}),
        ...(customLevel.alarmEvery ? {alarmEvery: customLevel.alarmEvery, alarmBrood: customLevel.alarmBrood} : {}),
        ...(customLevel.burrowR ? {burrowR: customLevel.burrowR} : {}),
      } : {}),
      ...(Array.isArray(customLevel.doors) && customLevel.doors.length ? {doors:
        customLevel.doors.map(d2 => ({x:+d2.x.toFixed(3), y:+d2.y.toFixed(3)}))} : {}),
      ...(Array.isArray(customLevel.spots) && customLevel.spots.length ? {spots:
        customLevel.spots.map(s2 => ({x:+s2.x.toFixed(3), y:+s2.y.toFixed(3), kind: s2.kind,
          ...(s2.label ? {label: s2.label} : {}),
          ...(s2.gx != null ? {gx:+s2.gx.toFixed(3), gy:+s2.gy.toFixed(3)} : {})}))} : {}),
      ...(customLevel.crowd ? {crowd: customLevel.crowd} : {}),
      ...(customLevel.theme ? {theme: customLevel.theme} : {}),
    };
    const json = JSON.stringify(out, null, 2);
    box.style.display = 'block';
    box.readOnly = true;
    box.value = json;
    box.select();
    try{ await navigator.clipboard.writeText(json); exp.textContent = 'Copied!'; }
    catch(err){ exp.textContent = 'Select & copy'; }
    setTimeout(()=>exp.textContent='Export', 1600);
  });

  imp.addEventListener('click', () => {
    if(box.style.display !== 'block' || box.readOnly){
      box.style.display = 'block';
      box.readOnly = false;
      box.value = '';
      box.placeholder = 'Paste level JSON here, then press Import again';
      box.focus();
      return;
    }
    try{
      const L = JSON.parse(box.value);
      if(!L.player || !Array.isArray(L.walls) || !Array.isArray(L.enemies)) throw new Error('bad shape');
      customLevel = {
        name: L.name || 'Custom', par: L.par || 4, brief: L.brief || '',
        player: L.player, walls: L.walls, enemies: L.enemies,
        enemyCount: L.enemyCount || null,
        package: Array.isArray(L.package) ? L.package : (L.package ? [L.package] : []),
        extract: L.extract || null,
        burrows: Array.isArray(L.burrows) ? L.burrows : [],
        stations: Array.isArray(L.stations) ? L.stations : [],
        airlocks: Array.isArray(L.airlocks) ? L.airlocks : [],
        pad: L.pad || null,
        npcs: Array.isArray(L.npcs) ? L.npcs : [],
        patrols: Array.isArray(L.patrols) ? L.patrols : [],
        calmEvery: L.calmEvery, calmBrood: L.calmBrood,
        alarmEvery: L.alarmEvery, alarmBrood: L.alarmBrood,
        burrowR: L.burrowR, theme: L.theme,
        objective: L.objective, secondaries: L.secondaries
      };
      ed.selected = null;
      box.style.display = 'none';
      renderEdPanel();
    }catch(err){
      imp.textContent = 'Invalid JSON';
      setTimeout(()=>imp.textContent='Import', 1600);
    }
  });

  const edhint = document.createElement('div');
  edhint.id = 'edhint';
  edhint.textContent = 'Wall: drag to draw a block. Enemy / Start: tap to place. Move: drag things around (tap an enemy to edit its HP). Erase: tap to delete. Test drops you straight into the level.';
  edPanel.appendChild(edhint);
}

// --- editor rendering ---
function drawEditor(){
  clearPhysical();
  ctx.clearRect(0,0,W,H);
  camApply();

  // starfield
  for(const st of state.stars){
    ctx.globalAlpha = st.a * 0.6;
    ctx.fillStyle = '#e8e0cc';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // placement grid
  ctx.strokeStyle = 'rgba(111,214,255,.07)';
  ctx.lineWidth = 1;
  for(let i=1;i<10;i++){
    ctx.beginPath(); ctx.moveTo(W*i/10, 0); ctx.lineTo(W*i/10, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H*i/10); ctx.lineTo(W, H*i/10); ctx.stroke();
  }

  // walls
  customLevel.walls.forEach((w, i) => {
    const r = edWallRect(w);
    const sel = ed.selected && ed.selected.type==='wall' && ed.selected.idx===i;
    drawWall(r, !!w.high, sel ? '#6fd6ff' : null);
  });

  // wall being drawn
  if(ed.drawing){
    const d = ed.drawing;
    const x = Math.min(d.x0,d.x1), y = Math.min(d.y0,d.y1);
    const w = Math.abs(d.x1-d.x0), h = Math.abs(d.y1-d.y0);
    ctx.fillStyle = 'rgba(111,214,255,.15)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#6fd6ff';
    ctx.setLineDash([5,5]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
  }

  // burrow mouths
  if(Array.isArray(customLevel.burrows)) customLevel.burrows.forEach((b, i) => {
    const bx = b.x*W, by = b.y*H;
    const sel = ed.selected && ed.selected.type==='burrow' && ed.selected.idx===i;
    ctx.fillStyle = '#0a0612';
    ctx.beginPath(); ctx.ellipse(bx, by, 16, 11, 0.3, 0, 7); ctx.fill();
    ctx.strokeStyle = sel ? '#6fd6ff' : 'rgba(176,106,232,.8)';
    ctx.lineWidth = sel ? 2.5 : 1.5;
    ctx.beginPath(); ctx.ellipse(bx, by, 16, 11, 0.3, 0, 7); ctx.stroke();
    ctx.font = "700 8px 'Space Grotesk',sans-serif";
    ctx.fillStyle = 'rgba(176,106,232,.8)';
    ctx.textAlign = 'center';
    ctx.fillText('BURROW', bx, by - 18);
  });

  // doors and spots: the port's life, visible at design time
  if(Array.isArray(customLevel.doors)) customLevel.doors.forEach((d2, i) => {
    const dx2 = d2.x*W, dy2 = d2.y*H;
    const sel = ed.selected && ed.selected.type==='door' && ed.selected.idx===i;
    ctx.strokeStyle = sel ? '#6fd6ff' : 'rgba(111,214,255,.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(dx2, dy2, 15, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dx2-15, dy2); ctx.lineTo(dx2+15, dy2); ctx.stroke();
    ctx.font = "700 8px 'Space Grotesk',sans-serif";
    ctx.fillStyle = 'rgba(111,214,255,.8)';
    ctx.textAlign = 'center';
    ctx.fillText('DOOR', dx2, dy2 - 20);
  });
  if(Array.isArray(customLevel.spots)) customLevel.spots.forEach((s2, i) => {
    const sx2 = s2.x*W, sy2 = s2.y*H;
    const sel = ed.selected && ed.selected.type==='spot' && ed.selected.idx===i;
    ctx.strokeStyle = sel ? '#6fd6ff' : 'rgba(212,168,67,.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx2, sy2, 8, 0, 7); ctx.stroke();
    ctx.font = "700 8px 'Space Grotesk',sans-serif";
    ctx.fillStyle = 'rgba(212,168,67,.85)';
    ctx.textAlign = 'center';
    ctx.fillText((s2.kind || 'spot').toUpperCase(), sx2, sy2 - 13);
  });
  // enemies
  ctx.textAlign = 'center';
  customLevel.enemies.forEach((e, i) => {
    const ex = e.x*W, ey = e.y*H;
    const arch = ARCHETYPES[e.type || 'soldier'];
    ctx.fillStyle = '#3a1622';
    ctx.beginPath(); ctx.arc(ex, ey, arch.bodyR, 0, 7); ctx.fill();
    const sel = ed.selected && ed.selected.type==='enemy' && ed.selected.idx===i;
    ctx.strokeStyle = sel ? '#6fd6ff' : arch.color;
    ctx.lineWidth = sel ? 3 : 2.5;
    ctx.beginPath(); ctx.arc(ex, ey, arch.bodyR, 0, 7); ctx.stroke();
    ctx.fillStyle = arch.color;
    ctx.beginPath(); ctx.arc(ex, ey, 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8e0cc';
    ctx.font = "700 10px 'Space Grotesk',sans-serif";
    ctx.fillText(arch.label + ' · HP ' + (e.hp || arch.hp), ex, ey - arch.bodyR - 7);
  });

  // package candidate sites
  if(Array.isArray(customLevel.package)){
    customLevel.package.forEach((k, i) => {
      const kx = k.x*W, ky = k.y*H;
      const sel = ed.selected && ed.selected.type==='pkg' && ed.selected.idx===i;
      ctx.save();
      ctx.translate(kx, ky);
      ctx.rotate(0.785);
      ctx.fillStyle = 'rgba(212,168,67,.25)';
      ctx.fillRect(-7, -7, 14, 14);
      ctx.strokeStyle = sel ? '#6fd6ff' : 'rgba(212,168,67,.85)';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      ctx.strokeRect(-7, -7, 14, 14);
      ctx.restore();
      ctx.fillStyle = 'rgba(212,168,67,.85)';
      ctx.font = "700 9px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('CACHE ' + (i+1), kx, ky - 13);
    });
  }
  // extraction zone
  if(customLevel.extract){
    const ex = customLevel.extract;
    ctx.strokeStyle = 'rgba(111,214,255,.6)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([10,7]);
    ctx.beginPath();
    ctx.arc(ex.x*W, ex.y*H, ex.r*Math.min(W,H), 0, 7);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(111,214,255,.7)';
    ctx.font = "700 9px 'Space Grotesk',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText('EXTRACTION', ex.x*W, ex.y*H);
  }

  // player start
  const px = customLevel.player.x*W, py = customLevel.player.y*H;
  ctx.fillStyle = '#20283f';
  ctx.beginPath(); ctx.arc(px, py, 12, 0, 7); ctx.fill();
  ctx.strokeStyle = '#d4a843';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py, 12, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#e8e0cc';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px-8.5, py-5); ctx.quadraticCurveTo(px-13, py-11, px-8.5, py-14.5);
  ctx.moveTo(px+8.5, py-5); ctx.quadraticCurveTo(px+13, py-11, px+8.5, py-14.5);
  ctx.stroke();
  ctx.fillStyle = 'rgba(212,168,67,.8)';
  ctx.font = "700 10px 'Space Grotesk',sans-serif";
  ctx.fillText('START', px, py + 28);

  // terminals: brass consoles with their names
  if(Array.isArray(customLevel.stations)){
    ctx.textAlign = 'center';
    for(let i=0; i<customLevel.stations.length; i++){
      const st = customLevel.stations[i];
      const px = st.x*W, py = st.y*H;
      const sel = ed.selected && ed.selected.type === 'term' && ed.selected.idx === i;
      ctx.fillStyle = sel ? 'rgba(212,168,67,.4)' : 'rgba(212,168,67,.18)';
      ctx.strokeStyle = '#d4a843';
      ctx.lineWidth = sel ? 2.5 : 1.5;
      ctx.fillRect(px-11, py-11, 22, 22);
      ctx.strokeRect(px-11, py-11, 22, 22);
      ctx.fillStyle = '#d4a843';
      ctx.font = "700 9px 'Space Grotesk',sans-serif";
      ctx.fillText(STATION_LABELS[st.id] || st.id, px, py + 24);
    }
  }
  // airlocks: a hatch bar flush to its wall face
  if(Array.isArray(customLevel.airlocks)){
    for(let i=0; i<customLevel.airlocks.length; i++){
      const a = customLevel.airlocks[i];
      const px = a.x*W, py = a.y*H;
      const sel = ed.selected && ed.selected.type === 'airlock' && ed.selected.idx === i;
      const horiz = a.side === 'N' || a.side === 'S';
      ctx.fillStyle = sel ? 'rgba(111,214,255,.9)' : 'rgba(111,214,255,.6)';
      if(horiz) ctx.fillRect(px-14, py-3.5, 28, 7);
      else ctx.fillRect(px-3.5, py-14, 7, 28);
      ctx.strokeStyle = '#6fd6ff';
      ctx.lineWidth = sel ? 2 : 1;
      if(horiz) ctx.strokeRect(px-14, py-3.5, 28, 7);
      else ctx.strokeRect(px-3.5, py-14, 7, 28);
      ctx.fillStyle = '#6fd6ff';
      ctx.font = "700 8px 'Space Grotesk',sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('AIRLOCK', px, py + (horiz ? 18 : 24));
    }
  }

  // the pad: a brass dashed ring where the hull sets down
  if(customLevel.pad){
    const px = customLevel.pad.x*W, py = customLevel.pad.y*H;
    ctx.strokeStyle = 'rgba(212,168,67,.8)';
    ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(px, py, 120, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(212,168,67,.8)';
    ctx.font = "700 11px 'Space Grotesk',sans-serif"; ctx.textAlign = 'center';
    ctx.fillText('PAD', px, py + 4);
  }
  // folk: green diamonds with their trade
  if(Array.isArray(customLevel.npcs)){
    for(let i=0; i<customLevel.npcs.length; i++){
      const n2 = customLevel.npcs[i];
      const px = n2.x*W, py = n2.y*H;
      const sel = ed.selected && ed.selected.type === 'npc' && ed.selected.idx === i;
      ctx.fillStyle = sel ? 'rgba(159,224,142,.95)' : 'rgba(159,224,142,.6)';
      ctx.beginPath();
      ctx.moveTo(px, py-9); ctx.lineTo(px+9, py); ctx.lineTo(px, py+9); ctx.lineTo(px-9, py);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#9fe08e';
      ctx.font = "700 8px 'Space Grotesk',sans-serif"; ctx.textAlign = 'center';
      ctx.fillText((n2.kind || 'civ').toUpperCase(), px, py + 20);
    }
  }
  // patrols: violet numbered beats joined by their walk
  if(Array.isArray(customLevel.patrols)){
    for(let i=0; i<customLevel.patrols.length; i++){
      const route = customLevel.patrols[i];
      ctx.strokeStyle = 'rgba(176,106,224,.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      route.forEach((pt, j) => { j ? ctx.lineTo(pt.x*W, pt.y*H) : ctx.moveTo(pt.x*W, pt.y*H); });
      if(route.length > 2) ctx.closePath();
      ctx.stroke();
      route.forEach((pt, j) => {
        ctx.fillStyle = 'rgba(176,106,224,.85)';
        ctx.beginPath(); ctx.arc(pt.x*W, pt.y*H, 6, 0, 7); ctx.fill();
        ctx.fillStyle = '#0b0e16';
        ctx.font = "700 8px 'Space Grotesk',sans-serif"; ctx.textAlign = 'center';
        ctx.fillText(String(j+1), pt.x*W, pt.y*H + 3);
      });
    }
  }

  // the hatch refusal note, near the cursor, fading
  if(ed.msg && performance.now() < ed.msgT){
    ctx.fillStyle = 'rgba(224,72,62,.9)';
    ctx.font = "700 12px 'Space Grotesk',sans-serif";
    ctx.fillText(ed.msg, ed.cursor.x, ed.cursor.y - 18);
  }

  // tool label pinned to the glass, not the world
  ctx.setTransform(DPR * viewScale, 0, 0, DPR * viewScale, DPR * viewOX, DPR * viewOY);
  ctx.fillStyle = 'rgba(232,224,204,.4)';
  ctx.font = "600 12px 'Space Grotesk',sans-serif";
  ctx.textAlign = 'right';
  ctx.fillText('Tool: ' + ed.tool.toUpperCase(), W - 16, H - 14);
  ctx.textAlign = 'center';
}

resize();
layout();
syncWeaponButtons();
const FACTORY_DEFS = JSON.parse(JSON.stringify(SQUAD_DEFS));
shipLoad();
worldEnsure();
// a wiped, broke section gets a Bureau advance rather than a locked door
if(!livingRoster().length && ship.credits < Math.min(...RECRUIT_POOL.map(p => p.price))){
  ship.credits = 400;
}
shipCreditsRefresh();
renderRoster();
titleShow();      // the game opens on the title; headless, this is a no-op and tests drive the verbs directly
updateHud();
requestAnimationFrame(frame);

// recovered wiring: deploy + dossier close
document.getElementById('rosterGo').addEventListener('click', () => {
  const goBtn = document.getElementById('rosterGo');
  if(goBtn && goBtn.dataset.lapsed) return;   // a closed window does not open for clicking
  if(goBtn && goBtn.dataset.away){
    // the work is somewhere else: show them where
    mapState.sel = goBtn.dataset.away;
    shipShowPane('paneMap');
    mapSidePanel();
    return;
  }
  // names travel with the operatives
  SQUAD_DEFS.forEach((def, i) => {
    const inp = document.getElementById('rname' + i);
    if(inp && inp.value.trim()) def.name = inp.value.trim().slice(0, 14);
  });
  rosterDeployed = true;
  document.getElementById('roster').classList.add('hidden');
  restart();
});

document.getElementById('dossier').addEventListener('click', () => {
  document.getElementById('dossier').classList.remove('show');
});


// recovered wiring: hud scale + squad return

document.getElementById('squadbtn').addEventListener('click', () => {
  if(state.range) return;
  renderRoster();
  document.getElementById('roster').classList.remove('hidden');
});

// the first thing a cold player ever sees: one hero, one target, one lesson
startRange();


// recovered wiring: remaining one-line listeners
document.getElementById('brieftoast').addEventListener('click', dismissBrief);
document.getElementById('specialbtn').addEventListener('click', tryAbility);
document.getElementById('sysmodal').addEventListener('click', dismissSys);
document.getElementById('rangeskip').addEventListener('click', exitRange);
document.getElementById('cprev').addEventListener('click', () => cycleContract(-1));
document.getElementById('cnext').addEventListener('click', () => cycleContract(1));


// recovered wiring: multi-line listeners


})();
</script>
